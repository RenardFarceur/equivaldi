
<header class="top" id="top">
  <div class="top-in">
    <button class="iconbtn" id="backBtn" data-act="back" aria-label="Retour" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="brand" id="brandBtn" data-act="go" data-tab="accueil" aria-label="EquiValdi, accueil">{{MARK}}</button>
    <div class="top-title">
      <div class="eyebrow" id="topEyebrow">Carnet d'écurie</div>
      <h1 id="topTitle">EquiValdi</h1>
    </div>
    <button class="crot" id="crotBtn" data-act="boutique" aria-label="Crottins : ouvrir la boutique" hidden><svg class="crottin" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="cr-fume" d="M12.8 7.6c-1.7-1.5-1.7-3 0-4.4M18.6 7.2c-1.5-1.4-1.5-2.8 0-4.1"/><ellipse class="cr-b" cx="10.5" cy="22.6" rx="7" ry="6"/><ellipse class="cr-b" cx="21.6" cy="23.1" rx="6.8" ry="5.8"/><ellipse class="cr-b" cx="16" cy="14.6" rx="6.2" ry="5.4"/><path class="cr-l" d="M7.4 20.6q1.5-2 3.6-2.1M18.5 21.2q1.5-2 3.5-2M12.9 12.6q1.4-1.8 3.4-1.9"/></svg><b id="crotN">0</b><i class="crot-dot" aria-hidden="true"></i></button>
    <button class="iconbtn reg" id="settingsBtn" data-act="reglages" aria-label="Réglages"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="sync" id="sync" aria-hidden="true"><i></i></span></button>
  </div>
</header>
<main class="view" id="view" aria-live="polite">
  <div class="loading">{{LOGO}}<p class="note">Ouverture du carnet…</p></div>
</main>
<button class="fab" id="fab" data-act="fab" aria-label="Ajouter"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="sheet-root" id="sheet" hidden>
  <div class="scrim" data-act="close-sheet"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-h">
      <h2 id="sheetTitle">&nbsp;</h2>
      <button class="iconbtn" data-act="close-sheet" aria-label="Fermer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-b" id="sheetBody"></div>
    <div class="sheet-f" id="sheetFoot"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
