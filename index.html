ACT['edit-entretien'] = d => formEntretien(d.id);

/* ---------- Foin : stock, autonomie, mouvements ---------- */
const balleNom = (id, n = 1) => {
  const b = cfg().balles.find(x => x.id === id);
  const nom = b ? b.nom : (id || 'balle');
  return n > 1 ? plWords(nom) : nom.toLowerCase();
};
function rowFoin(m) {
  const isIn = m.sens === 'in';
  const sub = [dFull(m.date), m.origine, isIn && Number(m.prix) > 0 ? `${num(Number(m.prix), 2)} € la balle` : ''].filter(Boolean).join(' · ');
  return `<button type="button" class="row" data-act="edit-foin" data-id="${m.id}"><span class="lead ${isIn ? 'in' : 'out'}">${ic(isIn ? 'plus' : 'minus')}</span><div class="row-main"><div class="row-t">${isIn ? 'Entrée' : 'Sortie'} · ${m.nb} ${esc(balleNom(m.balle, m.nb))} ${exTag(m)}</div><div class="row-s">${esc(sub)}</div></div></button>`;
}
VIEWS.foin = () => {
  const A = autonomie(), st = A.st, t = todayISO();
  const types = Object.values(st.by).filter(x => !x.orphan || x.n !== 0);
  let html = `<div class="hero"><div class="eyebrow">Stock estimé</div><div><span class="big">${num(st.kg / 1000, 1)}</span><span class="unit"> t de foin</span></div>
    ${types.map(x => `<div class="bale-row"><div class="row-main"><div class="row-t">${esc(x.b.nom)}</div><div class="row-s">≈ ${num(x.poidsMoy, 0)} kg la balle</div></div>
      <span class="big" aria-label="${x.n} en stock">${x.n}</span>
      <button type="button" class="stepbtn out" data-act="foin-out" data-balle="${esc(x.b.id)}" aria-label="Entamer une balle : ${esc(x.b.nom)}">${ic('minus')}</button>
      <button type="button" class="stepbtn" data-act="new" data-what="foin" data-balle="${esc(x.b.id)}" data-sens="in" aria-label="Entrée : ${esc(x.b.nom)}">${ic('plus')}</button></div>`).join('')}
    <p class="note" style="margin-top:6px">Touche − à chaque balle entamée : le carnet en déduit ta consommation réelle.</p></div>`;
  if (A.rate) {
    const jours = Math.floor(A.days), pct = A.besoin ? Math.min(100, Math.round(st.kg / A.besoin * 100)) : 0, ref = balleRef(st);
    const solde = A.solde >= 0
      ? `<span class="pill ok">${ic('check')}Excédent ≈ ${num(A.solde / 1000, 1)} t</span>`
      : `<span class="pill danger">Manque ≈ ${num(-A.solde / 1000, 1)} t${ref ? ` · ${Math.ceil(-A.solde / ref.poidsMoy)} ${esc(plWords(ref.b.nom))}` : ''}</span>`;
    let card = `<div class="card">
      <div class="pnums"><span class="big">${num(jours, 0)}</span><span class="unit">${pl(jours, 'jour')} · jusqu'au ${dFull(addDays(t, jours))}</span></div>
      <div class="row-s">À ${num(A.rate, 0)} kg par jour, ${A.src === 'reel' ? 'calculé sur les balles entamées ces 30 derniers jours' : "d'après le foin des rations"}.</div>
      <div class="gauge graze" role="img" aria-label="Le stock couvre ${pct} % du besoin"><i style="width:${pct}%"></i></div>
      <div class="wrap"><span class="small">Besoin jusqu'au ${dShort(A.finSaison)} : <b>${num(A.besoin / 1000, 1)} t</b></span>${solde}</div>`;
    if (A.reel != null && A.rat > 0) {
      const ecart = Math.abs(A.reel - A.rat) / A.rat > 0.25;
      card += `<p class="note">Rations : ${num(A.rat, 0)} kg/j · balles entamées : ${num(A.reel, 0)} kg/j.${ecart ? " Un écart important vient souvent du gaspillage ou d'une ration à mettre à jour." : ''}</p>`;
    }
    html += section('Autonomie', card + '</div>');
  } else {
    html += section('Autonomie', '<p class="note">Pour savoir combien de jours tu tiens, note le foin des rations en kg (fiche cheval, onglet Ration) ou touche − à chaque balle entamée.</p>');
  }
  const since = addDays(t, -365);
  const buys = list('foin').filter(m => m.sens === 'in' && m.date > since && Number(m.prix) > 0);
  if (buys.length) {
    const eur = buys.reduce((a, m) => a + m.nb * Number(m.prix), 0);
    const kg = buys.reduce((a, m) => a + m.nb * (Number(m.poids) || (st.by[m.balle] ? st.by[m.balle].b.poids : 0)), 0);
    html += section('Achats sur 12 mois', `<div class="stats"><div class="stat"><b>${num(eur, 0)} €</b><span>dépensés</span></div><div class="stat"><b>${kg ? num(eur / kg * 1000, 0) : '–'}</b><span>€ la tonne</span></div><div class="stat"><b>${num(kg / 1000, 1)}</b><span>t achetées</span></div></div>`);
  }
  const mv = list('foin').sort((a, b) => b.date.localeCompare(a.date) || (b.maj || 0) - (a.maj || 0)).slice(0, 40);
  html += section('Mouvements', mv.length ? `<div class="list">${mv.map(rowFoin).join('')}</div>` : empty('Aucun mouvement', 'Ajoute ta première livraison ou récolte avec le bouton +.'),
    `<button type="button" class="link" data-act="new" data-what="foin" data-sens="in">${ic('plus', 'sm')}Entrée</button>`);
  return { title: 'Foin', eyebrow: 'Stock et autonomie', html, fab: () => formFoin(null, { sens: 'in' }), fabLabel: 'Entrée de foin' };
};

function quickOut(balle) {
  const x = stock().by[balle];
  if (!x || x.n <= 0) { toast('Plus de balle de ce type en stock.'); return; }
  const m = put('foin', { date: todayISO(), sens: 'out', balle, nb: 1 });
  toast(`Sortie : 1 ${balleNom(balle)} · reste ${x.n - 1}`, { undo: () => del('foin', m.id) });
}
ACT['foin-out'] = d => { closeSheet(); quickOut(d.balle); };
ACT['foin-out-pick'] = () => {
  const xs = Object.values(stock().by).filter(x => x.n > 0);
  if (!xs.length) { toast('Aucune balle en stock : ajoute une entrée de foin.'); formFoin(null, { sens: 'in' }); return; }
  if (xs.length === 1) { quickOut(xs[0].b.id); return; }
  openSheet('Quelle balle entames-tu ?', `<div class="list">${xs.map(x =>
    `<button type="button" class="row" data-act="foin-out" data-balle="${esc(x.b.id)}">${lead('bale')}<div class="row-main"><div class="row-t">${esc(x.b.nom)}</div><div class="row-s">${x.n} en stock</div></div><span class="row-end">${ic('minus')}</span></button>`).join('')}</div>`);
};

function formFoin(id, pre = {}) {
  const ex = id ? get('foin', id) : null;
  if (id && !ex) return;
  const C = cfg();
  const m = ex ? clone(ex) : { sens: pre.sens === 'out' ? 'out' : 'in', balle: pre.balle || C.balles[0].id, nb: 1, date: todayISO() };
  const bOpts = C.balles.map(b => ({ v: b.id, l: b.nom }));
  if (ex && !C.balles.some(b => b.id === ex.balle)) bOpts.push({ v: ex.balle, l: ex.balle });
  const origines = Array.from(new Set([...pres(true).map(p => 'Récolte ' + p.nom), ...historyValues('foin', 'origine')]));
  const defW = b => (C.balles.find(x => x.id === b) || {}).poids || '';
  const body = `
    ${grp('Mouvement', chips('sens', [{ v: 'in', l: 'Entrée : achat, récolte' }, { v: 'out', l: 'Sortie : balle entamée' }], m.sens))}
    ${grp('Type de balle', chips('balle', bOpts, m.balle), 'Types et poids moyens se règlent dans les réglages.')}
    <div class="grid2">${fld('Nombre', inp('f_nb', m.nb, 'inputmode="numeric" autocomplete="off" required'))}${fld('Date', inp('f_date', m.date, 'type="date" required'))}</div>
    <div id="w_in" style="display:flex;flex-direction:column;gap:16px"${m.sens === 'in' ? '' : ' hidden'}>
      <div class="grid2">${fld('Poids par balle (kg)', inp('f_poids', m.poids, `${numAttr} placeholder="${defW(m.balle)}"`))}${fld('Prix par balle (€)', inp('f_prix', m.prix != null ? String(m.prix).replace('.', ',') : '', numAttr + ' placeholder="vide si récolte"'))}</div>
      ${fld('Provenance', inp('f_orig', m.origine, `list="dl-orig" autocomplete="off" placeholder="Récolte d'un pré, fournisseur…"`))}
    </div>
    ${fld('Notes', area('f_notes', m.notes, 'rows="2" placeholder="Qualité, coupe, humidité…"'))}
    ${dlist('dl-orig', origines)}`;
  openSheet(ex ? 'Mouvement de foin' : 'Foin', body, {
    onMount: f => {
      f.addEventListener('chipchange', e => {
        if (e.detail.name === 'sens') $('#w_in').hidden = chipVal(f, 'sens') !== 'in';
        if (e.detail.name === 'balle') $('#f_poids').placeholder = defW(chipVal(f, 'balle'));
      });
    },
    onSubmit: f => {
      const sens = chipVal(f, 'sens') || 'in', balle = chipVal(f, 'balle');
      if (!balle) return 'Choisis le type de balle.';
      const nb = parseNum(val('f_nb'));
      if (!nb || nb <= 0 || !Number.isInteger(nb)) return 'Le nombre de balles doit être un entier positif.';
      const date = val('f_date');
      if (!validISO(date)) return 'Indique la date.';
      if (sens === 'out') {
        const x = stock().by[balle];
        let dispo = x ? x.n : 0;
        if (ex && ex.balle === balle) dispo += ex.sens === 'out' ? ex.nb : -ex.nb;
        if (nb > dispo) return `Il ne reste que ${Math.max(0, dispo)} ${balleNom(balle, 2)} en stock. Enregistre d'abord l'entrée correspondante.`;
      }
      const poids = sens === 'in' ? parseNum(val('f_poids')) : null;
      if (sens === 'in' && val('f_poids') && (poids == null || poids <= 0)) return 'Le poids doit être un nombre positif.';
      const prix = sens === 'in' ? parseNum(val('f_prix')) : null;
      if (sens === 'in' && val('f_prix') && (prix == null || prix < 0)) return 'Le prix doit être un nombre.';
      const saved = put('foin', Object.assign(m, { sens, balle, nb, date, poids, prix, origine: sens === 'in' ? val('f_orig') : '', notes: val('f_notes') }));
      toast(ex ? 'Mouvement enregistré' : `${sens === 'in' ? 'Entrée' : 'Sortie'} : ${nb} ${balleNom(balle, nb)}`, ex ? {} : { undo: () => del('foin', saved.id) });
    },
    onDelete: ex ? () => { del('foin', id); toast('Mouvement supprimé'); } : null
  });
}
ACT['edit-foin'] = d => formFoin(d.id);

/* ---------- Concours : sorties prévues et résultats ---------- */
function ccard(c, showHorse = true) {
  const h = cheval(c.horseId), t = todayISO(), past = c.date < t;
  const meta = [sameYear(c.date) ? '' : c.date.slice(0, 4), c.discipline, nivLabel(c.niveau), c.epreuve].filter(Boolean).join(' · ');
  const pills = past ? '' : engPill(c) + vacCheck(c).filter(i => i.sev !== 'ok').map(i => `<span class="pill ${i.sev}">${ic('alert')}${esc(i.short)}</span>`).join('');

  COLS.forEach(k => {

  catch (e) { toast("Impossible de charger l'équipe : vérifie ta connexion.", { danger: true }); return; }
  const lien = EQ.lien();
  const membres = mb.sort((a, b) => (a.role === 'gerante' ? -1 : 0) - (b.role === 'gerante' ? -1 : 0)).map(m => `<div class="row"><div class="row-main">
      <div class="row-t">${esc(m.nom || m.email)}${m.moi ? ' <span class="pill ok">Toi</span>' : ''}</div><div class="row-s">${esc(m.email)} · ${esc(ROLE_LABEL[m.role] || m.role)}</div>
      ${m.role === 'gerante' ? '' : `<div class="wrap" style="margin-top:6px"><button type="button" class="btn small" data-act="eq-role" data-uid="${esc(m.uid)}" data-role="${m.role === 'lecture' ? 'equipe' : 'lecture'}">${m.role === 'lecture' ? 'Passer en « Peut modifier »' : 'Passer en lecture seule'}</button><button type="button" class="btn small danger" data-act="eq-del" data-uid="${esc(m.uid)}" data-confirm="Confirmer le retrait">Retirer</button></div>`}
    </div></div>`).join('');
  const invites = inv.map(i => `<div class="row"><div class="row-main"><div class="row-t">${esc(i.email)}</div><div class="row-s">Invitation en attente · ${esc(ROLE_LABEL[i.role] || i.role)}</div></div><button type="button" class="btn small" data-act="eq-inv-del" data-mail="${esc(i.email)}">Annuler</button></div>`).join('');
  openSheet("L'équipe", `
    ${msg ? `<div class="box ok"><div class="issue ok">${ic('check', 'sm')}<span>${esc(msg)}</span></div></div>` : ''}
    ${grp('Membres', `<div class="list">${membres || '<div class="row"><div class="row-s">Aucun membre</div></div>'}</div>`)}
    ${inv.length ? grp('Invitations en attente', `<div class="list">${invites}</div>`) : ''}
    ${fld('Inviter une adresse e-mail', inp('f_inv', '', 'type="email" autocomplete="off" placeholder="prenom@exemple.fr"'))}
    ${grp('Droits', chips('invrole', [{ v: 'equipe', l: 'Peut modifier' }, { v: 'lecture', l: 'Lecture seule' }], 'equipe'))}
    <div class="box"><p class="note" style="color:var(--ink)">Envoie ensuite le lien de l'appli à la personne. Elle crée son compte avec cette adresse e-mail.</p><p class="note" style="overflow-wrap:anywhere"><b>${esc(lien)}</b></p><button type="button" class="btn small" data-act="eq-copy">${ic('copy', 'sm')}Copier le lien</button></div>`, {
    submit: 'Inviter',
    onSubmit: f => {
      const mail = val('f_inv').toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) return 'Indique une adresse e-mail valide.';
      EQ.inviter(mail, chipVal(f, 'invrole') || 'equipe')
        .then(() => equipeSheet(`${mail} est invité. Envoie-lui le lien de l'appli.`))
        .catch(() => toast("L'invitation n'a pas pu être enregistrée.", { danger: true }));
      return false;
    }
  });
}
const eqDo = (p, ok) => p.then(() => equipeSheet(ok)).catch(() => toast("La modification n'a pas pu être enregistrée.", { danger: true }));
ACT['eq-role'] = d => eqDo(EQ.changerRole(d.uid, d.role), 'Droits modifiés.');
ACT['eq-del'] = d => eqDo(EQ.retirerMembre(d.uid), 'Personne retirée du carnet.');
ACT['eq-inv-del'] = d => eqDo(EQ.annulerInvitation(d.mail), 'Invitation annulée.');
ACT['eq-copy'] = () => {
  const txt = `Rejoins le carnet d'écurie EquiValdi : ${EQ.lien()}`;
  try { navigator.clipboard.writeText(txt).then(() => toast('Lien copié'), () => toast(txt)); } catch (e) { toast(txt); }
};
ACT['save-moi'] = () => {
  const v = val('f_moi');
  if (!v) { toast('Indique ton prénom.'); return; }
  setMoi(v.slice(0, 40));
  toast('Prénom enregistré');
};

/* ---------- Tâches partagées : chacun coche, tout le monde voit ---------- */
function tacheSub(tk, e) {
  const pre = tk.preId ? get('pres', tk.preId) : null, h = tk.horseId ? cheval(tk.horseId) : null;
  const where = [pre ? pre.nom : '', h ? h.nom : ''].filter(Boolean).join(' · ');
  let st;
  if (e.done) st = faitTxt(e.last) + (e.n > 1 && e.next ? ` · à refaire ${dRel(e.next)}` : '');
  else if (tk.freq === 'une') st = e.due ? (e.days < 0 ? `En retard de ${nJ(-e.days)}` : `À faire ${dRel(e.due)}`) : 'À faire';
  else if (e.last) st = (e.retard > 0 ? `En retard de ${nJ(e.retard)} · ` : '') + `Dernière fois ${dRel(e.last.d)}${e.last.par ? ', ' + e.last.par : ''}`;
  else st = freqLabel(tk);
  return [where, st].filter(Boolean).join(' · ');
}
function trow(tk) {
  const e = tacheEtat(tk);
  const late = !e.done && e.retard > 0;
  return `<div class="trow${e.done ? ' done' : ''}${late ? ' late' : ''}">
    <button type="button" class="tick" data-act="tick" data-id="${tk.id}" aria-pressed="${e.done}" aria-label="${esc(tk.titre)} : ${e.done ? 'fait, toucher pour annuler' : 'marquer comme fait'}">${ic('check')}</button>
    <button type="button" class="trow-main" data-act="edit-tache" data-id="${tk.id}"><span class="row-t">${esc(tk.titre)}</span><span class="row-s">${esc(tacheSub(tk, e))}</span></button>
  </div>`;
}
function tachesTriees(filter) {
  const xs = taches().filter(filter || (() => true)).map(tk => ({ tk, e: tacheEtat(tk) })).filter(x => x.e.visible);
  return xs.sort((a, b) => (a.e.done - b.e.done)
    || (a.e.done ? ((b.e.last.t || 0) - (a.e.last.t || 0)) : ((b.e.retard || 0) - (a.e.retard || 0)))
    || String(a.tk.titre).localeCompare(String(b.tk.titre), 'fr'));
}
const tachesListe = xs => `<div class="list">${xs.map(x => trow(x.tk)).join('')}</div>`;
function tachesSection() {
  const xs = tachesTriees();
  const add = sync.readOnly ? '' : `<button type="button" class="link" data-act="new" data-what="tache">${ic('plus', 'sm')}Ajouter</button>`;
  if (!xs.length) {
    if (taches().length) return section('Tâches', empty('Rien en cours', 'Les tâches ponctuelles déjà faites sont rangées. Ajoute-en une nouvelle si besoin.'), add);
    const sugg = sync.readOnly ? '' : `<div class="sugg">${chips('sugg', TACHES_SUGG.map((s, i) => ({ v: String(i), l: s.titre })), [], { multi: true })}</div>
      <button type="button" class="btn primary small" data-act="add-sugg">${ic('plus', 'sm')}Ajouter ces tâches</button>`;
    return section('Tâches', `<div class="empty"><b>Aucune tâche</b>Ajoute les gestes du quotidien : chacun coche quand c'est fait et tout le monde le voit, pour ne rien faire deux fois.${sugg}</div>`, add);
  }
  const nDone = xs.filter(x => x.e.done).length;
  return section(`Tâches <span class="count">${nDone}/${xs.length}</span>`, tachesListe(xs), add);
}

/* Prénom affiché à côté des coches (demandé une fois par téléphone) */
function withName(cb) {
  const n = getMoi();
  if (n) { cb(n); return; }
  openSheet('Qui coche ?', fld('Ton prénom', inp('f_moi', me.platformName || '', 'autocomplete="given-name" autocapitalize="words" required'),
    "Il s'affiche à côté des tâches que tu coches, pour que les autres sachent qui les a faites. Il reste sur ce téléphone."), {
    focus: '#f_moi', submit: 'Valider et cocher', local: true,
    onSubmit: () => {
      const v = val('f_moi');
      if (!v) return 'Indique ton prénom.';
      if (v.length > 40) return 'Un prénom court suffit.';
      setMoi(v);
      setTimeout(() => cb(v), 0);
    }
  });
}
ACT.tick = d => {
  const tk = get('taches', d.id);
  if (!tk) return;
  if (tacheEtat(tk).done) {
    const prev = clone(tk);
    put('taches', Object.assign({}, tk, { fait: faitsDe(tk).slice(1) }));
    toast('Coche retirée', { undo: () => put('taches', prev) });
    return;
  }
  withName(nom => {
    const cur = get('taches', d.id);
    if (!cur) return;
    const prev = clone(cur);
    const f = { d: todayISO(), t: Date.now(), par: nom, uid: me.uid || null };
    put('taches', Object.assign({}, cur, { fait: [f, ...faitsDe(cur)].slice(0, 30) }));
    toast(`${cur.titre} : fait`, { undo: () => put('taches', prev) });
  });
};
ACT['add-sugg'] = () => {
  const sel = chipVals(document, 'sugg').map(Number).filter(i => TACHES_SUGG[i]);
  if (!sel.length) { toast('Touche une ou plusieurs tâches pour les choisir.'); return; }
  const ids = sel.map(i => { const s = TACHES_SUGG[i]; return put('taches', { titre: s.titre, freq: s.freq, n: s.n || null, fait: [] }).id; });
  toast(`${ids.length} ${pl(ids.length, 'tâche ajoutée', 'tâches ajoutées')}`, { undo: () => ids.forEach(i => del('taches', i)) });
};

function formTache(id, pre = {}) {
  const ex = id ? get('taches', id) : null;
  if (id && !ex) return;
  const tk = ex ? clone(ex) : { titre: '', freq: 'jour', n: 3, preId: pre.pid || null, horseId: pre.hid || null };
  const ps = pres(), hs = chevaux();
  const fs = ex ? faitsDe(ex).slice(0, 10) : [];
  const hist = fs.length ? grp('Dernières fois', `<div class="list">${fs.map(f =>
    `<div class="row"><div class="row-main"><div class="row-t">${esc(f.par || "Quelqu'un")}</div><div class="row-s">${esc(dFull(f.d))}${f.t ? ' · ' + hTxt(f.t) : ''}</div></div></div>`).join('')}</div>`) : '';
  const body = `
    ${fld('Tâche', inp('f_titre', tk.titre, 'required autocomplete="off" autocapitalize="sentences" placeholder="ex. Foin du matin"'))}
    ${ex ? '' : `<div class="wrap">${TACHES_SUGG.map(s => `<button type="button" class="chip" data-act="fill" data-target="f_titre" data-fill="${esc(s.titre)}">${esc(s.titre)}</button>`).join('')}</div>`}
    ${grp('Fréquence', chips('freq', [{ v: 'jour', l: 'Chaque jour' }, { v: 'jours', l: 'Tous les … jours' }, { v: 'une', l: 'Une seule fois' }], tk.freq || 'jour'))}
    <div id="w_n"${tk.freq === 'jours' ? '' : ' hidden'}>${fld('Tous les combien de jours ?', inp('f_n', tk.n || 3, 'inputmode="numeric" autocomplete="off"'), '7 pour une fois par semaine.')}</div>
    <div id="w_date"${tk.freq === 'une' ? '' : ' hidden'}>${fld('À faire le', inp('f_date', tk.date, 'type="date"'), 'Facultatif.')}</div>
    ${ps.length ? grp('Pré', chips('pre', ps.map(p => ({ v: p.id, l: p.nom })), tk.preId ? [tk.preId] : [], { optional: true }), 'Facultatif.') : ''}
    ${hs.length ? grp('Cheval', chips('h', horseOpts(hs), tk.horseId ? [tk.horseId] : [], { optional: true }), 'Facultatif.') : ''}
    ${fld('Consignes', area('f_notes', tk.notes, 'rows="2" placeholder="ex. 2 rounds dans le râtelier, vérifier le niveau d\'eau"'))}
    ${hist}`;
  openSheet(ex ? 'Tâche' : 'Nouvelle tâche', body, {
    focus: ex ? null : '#f_titre',
    onMount: f => f.addEventListener('chipchange', e => {
      if (e.detail.name !== 'freq') return;
      const v = chipVal(f, 'freq');
      $('#w_n').hidden = v !== 'jours';
      $('#w_date').hidden = v !== 'une';
    }),
    onSubmit: f => {
      const titre = val('f_titre');
      if (!titre) return 'Indique la tâche, par exemple « Foin du matin ».';
      const freq = chipVal(f, 'freq') || 'jour';
      let n = null;
      if (freq === 'jours') {
        n = parseNum(val('f_n'));
        if (!Number.isInteger(n) || n < 1 || n > 365) return 'Indique un nombre de jours entre 1 et 365.';
      }
      const date = freq === 'une' ? val('f_date') : '';
      Object.assign(tk, { titre, freq, n, date: validISO(date) ? date : null, preId: chipVal(f, 'pre'), horseId: chipVal(f, 'h'), notes: val('f_notes') });
      if (!Array.isArray(tk.fait)) tk.fait = [];
      put('taches', tk);
      toast(ex ? 'Tâche enregistrée' : 'Tâche ajoutée');
    },
    onDelete: ex ? () => { const prev = clone(ex); del('taches', ex.id); toast('Tâche supprimée', { undo: () => put('taches', prev) }); } : null
  });
}
ACT['edit-tache'] = d => formTache(d.id);

/* ---------- Entraînement : séances faites ou prévues ---------- */
function seanceRow(s, showHorse = false) {
  const t = todayISO(), h = cheval(s.horseId), prevu = s.statut === 'prevu';
  const title = [s.type || 'Séance', durTxt(s.duree)].filter(Boolean).join(' · ');
  const who = [prevu && s.heure ? heureTxt(s.heure) : '', s.coach ? `Coach : ${s.coach}` : '', s.cavalier ? `Cavalier : ${s.cavalier}` : '', s.lieu].filter(Boolean).join(' · ');
  const pills = [
    prevu ? (s.date < t ? '<span class="pill warn">À confirmer</span>' : '<span class="pill info">Prévue</span>') : '',
    s.intensite ? `<span class="pill">${esc(intLabel(s.intensite))}</span>` : '',
    !prevu && s.ressenti ? `<span class="pill ${s.ressenti === 'difficile' ? 'warn' : s.ressenti === 'moyen' ? '' : 'ok'}">${esc(resLabel(s.ressenti))}</span>` : '',
    showHorse && h ? hchip(h) : ''
  ].join('');
  return `<button type="button" class="ccard" data-act="edit-seance" data-id="${s.id}">
    <span class="dblock" aria-hidden="true"><span>${dWeek(s.date)}</span><b>${dDay(s.date)}</b><span>${dMon(s.date)}</span></span>
    <span class="row-main"><span class="row-t">${esc(title)}</span>${who ? `<span class="row-s">${esc(who)}</span>` : ''}${s.notes ? `<span class="row-s clamp2">${esc(s.notes)}</span>` : ''}${pills ? `<span class="wrap" style="margin-top:4px">${pills}</span>` : ''}</span>
  </button>`;
}
function entrainementHtml(h) {
  const t = todayISO(), st = statsSeances(h.id), ss = seancesDe(h.id);
  if (!ss.length) return empty('Aucune séance', "Note le travail du jour ou prévois un cours avec ton coach : type, durée, intensité, cavalier, coach, ressenti.")
    + (sync.readOnly ? '' : `<button type="button" class="btn primary" data-act="new" data-what="seance" data-hid="${h.id}">${ic('plus', 'sm')}Ajouter une séance</button>`);
  const repos = st.last ? diffDays(st.last.date, t) : null;
  const stats = `<div class="stats">
    <div class="stat"><b>${st.n7}</b><span>${pl(st.n7, 'séance')} sur 7 jours</span></div>
    <div class="stat"><b>${st.min7 ? durTxt(st.min7) : '0'}</b><span>de travail sur 7 jours</span></div>
    <div class="stat"><b>${repos == null ? '–' : repos + ' j'}</b><span>${repos == null ? 'pas encore de séance faite' : 'depuis la dernière séance'}</span></div></div>`;
  const up = ss.filter(s => s.statut === 'prevu').sort((a, b) => a.date.localeCompare(b.date) || String(a.heure || '').localeCompare(String(b.heure || '')));
  const past = ss.filter(s => s.statut !== 'prevu').sort((a, b) => b.date.localeCompare(a.date) || (b.maj || 0) - (a.maj || 0));
  return stats
    + (up.length ? section('Prévues', `<div class="list">${up.map(s => seanceRow(s)).join('')}</div>`) : '')
    + (past.length ? section('Historique', `<div class="list">${past.slice(0, 60).map(s => seanceRow(s)).join('')}</div>`) : '');
}

function formSeance(id, pre = {}) {
  const ex = id ? get('seances', id) : null;
  if (id && !ex) return;
  const hs = chevaux(), all = chevaux(true);
  if (!all.length) { toast("Ajoute d'abord un cheval."); formCheval(null); return; }
  const t = todayISO();
  const s = ex ? clone(ex) : { date: t, type: null, cavalier: lastUsed('seances', 'cavalier') };
  const selH = ex ? [ex.horseId] : pre.hid ? [pre.hid] : (hs.length === 1 ? [hs[0].id] : []);
  const auto = d => (d > todayISO() ? 'prevu' : 'fait');
  const statut0 = ex ? (ex.statut === 'prevu' ? 'prevu' : 'fait') : auto(s.date);
  const hOpts = horseOpts(ex ? all.filter(h => !h.archive || h.id === ex.horseId) : hs);
  const lieux = Array.from(new Set([...historyValues('seances', 'lieu'), ...LIEUX]));
  const cavs = Array.from(new Set([...historyValues('seances', 'cavalier'), ...historyValues('concours', 'cavalier')]));
  const body = `
    ${grp(ex ? 'Cheval' : 'Chevaux', chips('h', hOpts, selH, { multi: !ex }))}
    <div class="grid2">${fld('Date', inp('f_date', s.date, 'type="date" required'))}${fld('Heure', inp('f_heure', s.heure, 'type="time"'), 'Facultatif.')}</div>
    ${grp('Statut', chips('statut', [{ v: 'fait', l: 'Faite' }, { v: 'prevu', l: 'Prévue' }], statut0))}
    ${ex && ex.statut === 'prevu' ? `<button type="button" class="btn" id="b_done">${ic('check', 'sm')}Marquer faite</button>` : ''}
    ${grp('Type de travail', chips('type', TYPES_SEANCE.map(x => ({ v: x, l: x })), s.type ? [s.type] : []))}
    ${fld('Durée (minutes)', inp('f_duree', s.duree, 'inputmode="numeric" autocomplete="off" placeholder="ex. 45"'))}
    <div class="wrap">${DUREES.map(m => `<button type="button" class="chip" data-act="fill" data-target="f_duree" data-fill="${m}">${durTxt(m)}</button>`).join('')}</div>
    ${grp('Intensité', chips('int', INTENSITES.map(x => ({ v: x.id, l: x.label })), s.intensite ? [s.intensite] : [], { optional: true }))}
    ${fld('Coach (s\'il y en a un)', inp('f_coach', s.coach, 'list="dl-coach" autocomplete="off" autocapitalize="words"'), 'Laisse vide pour une séance sans coach.')}
    ${fld('Cavalier', inp('f_cav', s.cavalier, 'list="dl-cavs" autocomplete="off" autocapitalize="words"'))}
    ${fld('Lieu', inp('f_lieu', s.lieu, 'list="dl-lieux" autocomplete="off" placeholder="Carrière, manège, extérieur…"'))}
    ${fld('Contenu, objectifs', area('f_notes', s.notes, 'rows="3" placeholder="ex. transitions, épaule en dedans, gymnastique à 1 m"'))}
    <div id="w_res"${statut0 === 'fait' ? '' : ' hidden'}>${grp('Ressenti', chips('res', RESSENTIS.map(x => ({ v: x.id, l: x.label })), s.ressenti ? [s.ressenti] : [], { optional: true }))}</div>
    ${fld('Prix du cours (€)', inp('f_cout', s.cout != null ? String(s.cout).replace('.', ',') : '', numAttr), 'Facultatif.')}
    ${dlist('dl-coach', historyValues('seances', 'coach'))}${dlist('dl-cavs', cavs)}${dlist('dl-lieux', lieux)}`;
  openSheet(ex ? (ex.statut === 'prevu' ? 'Séance prévue' : 'Séance') : 'Séance de travail', body, {
    onMount: f => {
      let touched = false;
      const showRes = () => { $('#w_res').hidden = (chipVal(f, 'statut') || auto(val('f_date'))) !== 'fait'; };
      f.addEventListener('chipchange', e => { if (e.detail.name === 'statut') { touched = true; showRes(); } });
      $('#f_date').addEventListener('change', () => {
        if (!touched && validISO(val('f_date'))) setChips(f, 'statut', [auto(val('f_date'))]);
        showRes();
      });
      const b = $('#b_done');
      if (b) b.addEventListener('click', () => {
        setChips(f, 'statut', ['fait']);
        if (val('f_date') > todayISO()) $('#f_date').value = todayISO();
        touched = true;
        showRes();
        b.hidden = true;
        toast('Ajoute le ressenti si tu veux, puis Enregistrer.');
      });
    },
    onSubmit: f => {
      const hids = chipVals(f, 'h');
      if (!hids.length) return 'Choisis au moins un cheval.';
      const date = val('f_date');
      if (!validISO(date)) return 'Indique la date.';
      const statut = chipVal(f, 'statut') || auto(date);
      if (statut === 'fait' && date > todayISO()) return 'Une séance faite ne peut pas être datée dans le futur : choisis « Prévue ».';
      const type = chipVal(f, 'type');
      if (!type) return 'Choisis le type de travail.';
      const dRaw = val('f_duree'), duree = parseNum(dRaw);
      if (dRaw && (!duree || duree <= 0 || duree > 600)) return 'La durée se note en minutes, par exemple 45.';
      const coutRaw = val('f_cout'), cout = parseNum(coutRaw);
      if (coutRaw && (cout == null || cout < 0)) return 'Le prix doit être un nombre, par exemple 35.';
      const heure = val('f_heure');
      const base = {
        date, heure: /^\d{2}:\d{2}$/.test(heure) ? heure : null, statut, type, duree: duree ? Math.round(duree) : null,
        intensite: chipVal(f, 'int'), coach: val('f_coach'), cavalier: val('f_cav'), lieu: val('f_lieu'), notes: val('f_notes'),
        ressenti: statut === 'fait' ? chipVal(f, 'res') : null, cout
      };
      if (ex) { put('seances', Object.assign({}, ex, base, { horseId: hids[0] })); toast('Séance enregistrée'); return; }
      const ids = hids.map(hid => put('seances', Object.assign({ horseId: hid }, base)).id);
      toast(`${statut === 'prevu' ? 'Séance prévue' : 'Séance notée'}${ids.length > 1 ? ` pour ${ids.length} chevaux` : ''}`, { undo: () => ids.forEach(i => del('seances', i)) });
    },
    onDelete: ex ? () => { const prev = clone(ex); del('seances', ex.id); toast('Séance supprimée', { undo: () => put('seances', prev) }); } : null
  });
}
ACT['edit-seance'] = d => formSeance(d.id);

/* ---------- Démarrage ---------- */
loadCache();
render();
connect();
let lastDay = todayISO();
setInterval(() => { if (todayISO() !== lastDay) { lastDay = todayISO(); render(); } }, 60000);
</script>

  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendEmailVerification, sendPasswordResetEmail, signOut, updateProfile
} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
import {
  initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, setDoc, deleteDoc, getDoc, getDocs, onSnapshot, updateDoc
} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyDCv_7VGRnPbszuajk1dPGfeEa15_nNB1M',
  authDomain: 'equivaldi.firebaseapp.com',
  projectId: 'equivaldi',
  storageBucket: 'equivaldi.firebasestorage.app',
  messagingSenderId: '438472603797',
  appId: '1:438472603797:web:670fef2053cebb0772c39c'
};
const GERANTE = 'celiacourtois8@gmail.com';   // première gérante du carnet
const ROLE_KEY = 'equivaldi:role:v1';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
auth.languageCode = 'fr';
let fs;
try { fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { fs = getFirestore(app); }

/* ---------- Adaptateur : la base Firestore sous la forme attendue par le carnet ---------- */
const code = e => ({ 'permission-denied': 'invalid_argument', 'invalid-argument': 'invalid_argument', 'resource-exhausted': 'quota_exceeded', 'unauthenticated': 'revoked' }[e && e.code] || 'unavailable');
const fail = e => { throw { code: code(e), message: e && e.message }; };
const clean = d => JSON.parse(JSON.stringify(d));
const snapDoc = s => ({ id: s.id, exists: s.exists(), data: () => s.data(), metadata: { fromCache: s.metadata.fromCache, hasPendingWrites: s.metadata.hasPendingWrites } });
const docApi = r => ({
  id: r.id, path: r.path,
  set: d => setDoc(r, clean(d)).catch(fail),
  delete: () => deleteDoc(r).catch(fail),
  get: () => getDoc(r).then(snapDoc, fail),
  onSnapshot: (next, err) => onSnapshot(r, { includeMetadataChanges: true }, s => next(snapDoc(s)), e => err && err({ code: code(e), message: e.message }))
});
const db = {
  doc: path => docApi(doc(fs, path)),
  collection: c => ({
    path: c,
    doc: id => docApi(id ? doc(fs, c, id) : doc(collection(fs, c))),
    onSnapshot: (next, err) => onSnapshot(collection(fs, c), { includeMetadataChanges: true },
      q => next({ docs: q.docs.map(snapDoc), size: q.size, empty: q.empty, metadata: { fromCache: q.metadata.fromCache, hasPendingWrites: q.metadata.hasPendingWrites } }),
      e => err && err({ code: code(e), message: e.message }))
  })
};

/* ---------- Écran de connexion ---------- */
const $a = () => document.getElementById('auth');
const body = () => document.getElementById('authBody');
const escH = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MSG = {
  'auth/invalid-credential': 'Adresse ou mot de passe incorrect.',
  'auth/wrong-password': 'Mot de passe incorrect.',
  'auth/user-not-found': 'Aucun compte avec cette adresse : crée-le d\'abord.',
  'auth/email-already-in-use': 'Un compte existe déjà avec cette adresse : connecte-toi.',
  'auth/invalid-email': 'Cette adresse e-mail n\'est pas valide.',
  'auth/weak-password': 'Le mot de passe doit faire au moins 6 caractères.',
  'auth/too-many-requests': 'Trop d\'essais. Patiente quelques minutes puis réessaie.',
  'auth/network-request-failed': 'Pas de connexion internet. Réessaie avec du réseau.'
};
const errTxt = e => MSG[e && e.code] || 'Ça n\'a pas marché. Réessaie dans un instant.';
function show(html, bind) {
  $a().hidden = false;
  document.body.classList.add('lock');
  body().innerHTML = html;
  if (bind) bind(body());
}
function hide() { $a().hidden = true; document.body.classList.remove('lock'); }
const field = (id, label, type, extra = '') => `<label class="field"><span>${label}</span><input id="${id}" type="${type}" ${extra}></label>`;
const errBox = '<p class="err" id="aErr" role="alert" hidden></p>';
const setErr = (root, m) => { const e = root.querySelector('#aErr'); e.textContent = m || ''; e.hidden = !m; };
async function busy(btn, fn) { btn.disabled = true; try { await fn(); } finally { btn.disabled = false; } }

function ecranConnexion() {
  show(`<form class="form" id="aForm" novalidate>
      <h2 class="auth-t">Connexion</h2>
      ${field('aMail', 'Adresse e-mail', 'email', 'autocomplete="email" required')}
      ${field('aPass', 'Mot de passe', 'password', 'autocomplete="current-password" required')}
      ${errBox}
      <button class="btn primary" type="submit">Se connecter</button>
      <div class="auth-links"><button type="button" class="link" id="aNew">Créer un compte</button><button type="button" class="link" id="aLost">Mot de passe oublié</button></div>
    </form>`, root => {
    root.querySelector('#aForm').addEventListener('submit', e => {
      e.preventDefault();
      busy(e.submitter || root.querySelector('[type=submit]'), async () => {
        try { await signInWithEmailAndPassword(auth, root.querySelector('#aMail').value.trim(), root.querySelector('#aPass').value); }
        catch (x) { setErr(root, errTxt(x)); }
      });
    });
    root.querySelector('#aNew').addEventListener('click', ecranCreation);
    root.querySelector('#aLost').addEventListener('click', async () => {
      const m = root.querySelector('#aMail').value.trim();
      if (!m) { setErr(root, 'Indique ton adresse e-mail, puis touche « Mot de passe oublié ».'); return; }
      try { await sendPasswordResetEmail(auth, m); setErr(root, ''); root.querySelector('#aLost').textContent = 'E-mail envoyé : regarde ta boîte'; }
      catch (x) { setErr(root, errTxt(x)); }
    });
  });
}
function ecranCreation() {
  show(`<form class="form" id="aForm" novalidate>
      <h2 class="auth-t">Créer ton compte</h2>
      ${field('aNom', 'Prénom', 'text', 'autocomplete="given-name" autocapitalize="words" required')}
      ${field('aMail', 'Adresse e-mail', 'email', 'autocomplete="email" required')}
      ${field('aPass', 'Mot de passe (6 caractères minimum)', 'password', 'autocomplete="new-password" required')}
      <p class="hint">Utilise l'adresse à laquelle tu as été invitée ou invité.</p>
      ${errBox}
      <button class="btn primary" type="submit">Créer mon compte</button>
      <div class="auth-links"><button type="button" class="link" id="aBack">J'ai déjà un compte</button></div>
    </form>`, root => {
    root.querySelector('#aForm').addEventListener('submit', e => {
      e.preventDefault();
      const nom = root.querySelector('#aNom').value.trim();
      if (!nom) { setErr(root, 'Indique ton prénom.'); return; }
      busy(root.querySelector('[type=submit]'), async () => {
        try {
          const c = await createUserWithEmailAndPassword(auth, root.querySelector('#aMail').value.trim(), root.querySelector('#aPass').value);
          await updateProfile(c.user, { displayName: nom });
          try { localStorage.setItem('carnet-ecurie:moi:v1', JSON.stringify({ nom })); } catch (x) { /* ignoré */ }
          await sendEmailVerification(c.user);
          ecranVerification(c.user);
        } catch (x) { setErr(root, errTxt(x)); }
      });
    });
    root.querySelector('#aBack').addEventListener('click', ecranConnexion);
  });
}
function ecranVerification(u) {
  show(`<div class="form">
      <h2 class="auth-t">Confirme ton adresse</h2>
      <p>Un e-mail de confirmation a été envoyé à <b>${escH(u.email)}</b>. Clique sur le lien qu'il contient, puis reviens ici.</p>
      <p class="hint">Pense à regarder dans les indésirables.</p>
      ${errBox}
      <button class="btn primary" id="aOk">J'ai confirmé mon adresse</button>
      <div class="auth-links"><button type="button" class="link" id="aResend">Renvoyer l'e-mail</button><button type="button" class="link" id="aOut">Se déconnecter</button></div>
    </div>`, root => {
    root.querySelector('#aOk').addEventListener('click', e => busy(e.currentTarget, async () => {
      await u.reload();
      if (!auth.currentUser.emailVerified) { setErr(root, 'L\'adresse n\'est pas encore confirmée. Clique sur le lien reçu par e-mail.'); return; }
      await auth.currentUser.getIdToken(true);
      entrer(auth.currentUser);
    }));
    root.querySelector('#aResend').addEventListener('click', async () => {
      try { await sendEmailVerification(u); setErr(root, ''); root.querySelector('#aResend').textContent = 'E-mail renvoyé'; } catch (x) { setErr(root, errTxt(x)); }
    });
    root.querySelector('#aOut').addEventListener('click', deconnexion);
  });
}
function ecranPasInvite(u) {
  show(`<div class="form">
      <h2 class="auth-t">Pas encore invité</h2>
      <p>L'adresse <b>${escH(u.email)}</b> n'a pas encore accès au carnet. Demande à la gérante de t'inviter avec cette adresse, puis touche « Réessayer ».</p>
      <button class="btn primary" id="aRetry">Réessayer</button>
      <div class="auth-links"><button type="button" class="link" id="aOut">Se déconnecter</button></div>
    </div>`, root => {
    root.querySelector('#aRetry').addEventListener('click', () => entrer(u));
    root.querySelector('#aOut').addEventListener('click', deconnexion);
  });
}

function ecranSouci(u, e) {
  const regles = e && e.code === 'permission-denied';
  show(`<div class="form">
      <h2 class="auth-t">Accès au carnet impossible</h2>
      <p>${regles ? "La base refuse l'accès : les règles d'accès de Firestore ne sont pas encore à jour. Recolle le fichier firestore.rules dans Firebase, onglet Règles, puis touche « Réessayer »." : "Le carnet n'a pas pu joindre la base. Vérifie ta connexion internet, puis touche « Réessayer »."}</p>
      <p class="hint">Code : ${escH((e && e.code) || 'inconnu')}</p>
      <button class="btn primary" id="aRetry">Réessayer</button>
      <div class="auth-links"><button type="button" class="link" id="aOut">Se déconnecter</button></div>
    </div>`, root => {
    root.querySelector('#aRetry').addEventListener('click', () => entrer(u));
    root.querySelector('#aOut').addEventListener('click', deconnexion);
  });
}

/* ---------- Rôles ---------- */
let ROLE = null, ME = null;
async function entrer(u) {
  const mail = (u.email || '').toLowerCase();
  let role = null, souci = null;
  try { const c = JSON.parse(localStorage.getItem(ROLE_KEY) || 'null'); if (c && c.uid === u.uid) role = c.role; } catch (x) { /* rien en cache */ }
  try {
    const m = await getDoc(doc(fs, 'membres', u.uid)).catch(e => (e && e.code === 'permission-denied') ? null : Promise.reject(e));
    if (m && m.exists()) role = m.data().role;
    else {
      let r = mail === GERANTE ? 'gerante' : null;
      if (!r) {
        const inv = await getDoc(doc(fs, 'invitations', mail)).catch(() => null);
        if (inv && inv.exists()) r = inv.data().role;
      }
      if (r) { await setDoc(doc(fs, 'membres', u.uid), { email: mail, role: r, nom: u.displayName || '', depuis: Date.now() }); role = r; }
      else role = null;
    }
  } catch (e) { souci = e; }
  if (!role && souci) { ecranSouci(u, souci); return; }
  if (!role) { ecranPasInvite(u); return; }
  try { localStorage.setItem(ROLE_KEY, JSON.stringify({ uid: u.uid, role })); } catch (x) { /* ignoré */ }
  ROLE = role;
  ME = u;
  window.EQ.email = mail;
  window.EQ.role = role;
  hide();
  window.claude._resolve('user', {
    me: async () => ({ id: u.uid, name: u.displayName || '', email: mail, isOwner: role === 'gerante', canEdit: role !== 'lecture', avatarUrl: '', color: '' }),
    id: async () => u.uid,
    isOwner: async () => role === 'gerante',
    canEdit: async () => role !== 'lecture',
    can: async n => n === 'data.write' ? role !== 'lecture' : false,
    profiles: async ids => Object.fromEntries([].concat(ids).map(i => [i, { id: i, name: '' }]))
  });
  window.claude._resolve('db', db);
}
async function deconnexion() {
  try { ['carnet-ecurie:cache:v1', 'carnet-ecurie:outbox:v1', ROLE_KEY].forEach(k => localStorage.removeItem(k)); } catch (x) { /* ignoré */ }
  await signOut(auth).catch(() => {});
  location.reload();
}

/* ---------- Équipe (gérante) ---------- */
window.EQ = {
  email: '', role: '',
  deconnexion,
  membres: async () => (await getDocs(collection(fs, 'membres'))).docs.map(d => Object.assign({ uid: d.id, moi: ME && d.id === ME.uid }, d.data())),
  invitations: async () => (await getDocs(collection(fs, 'invitations'))).docs.map(d => Object.assign({ email: d.id }, d.data())),
  inviter: (email, role) => setDoc(doc(fs, 'invitations', email.trim().toLowerCase()), { role, par: ME ? ME.uid : null, le: Date.now() }),
  annulerInvitation: email => deleteDoc(doc(fs, 'invitations', email)),
  changerRole: (uid, role) => updateDoc(doc(fs, 'membres', uid), { role }),
  retirerMembre: uid => deleteDoc(doc(fs, 'membres', uid)),
  lien: () => location.origin + location.pathname
};

onAuthStateChanged(auth, u => {
  if (!u) { ecranConnexion(); return; }
  if (!u.emailVerified) { ecranVerification(u); return; }
  entrer(u);
});

/* ---------- Hors ligne : mise en cache de l'appli ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
