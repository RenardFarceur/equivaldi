}
ACT['edit-ration'] = d => formRation(d.hid, d.lid);
ACT.fill = d => { const el = document.getElementById(d.target); if (el) { el.value = d.fill; el.focus(); } };
ACT['copy-ration'] = d => {

    ${(h.ration || []).length ? '<p class="note">La ration actuelle sera remplacée. Tu pourras ensuite ajuster les quantités.</p>' : ''}`, {

};

function formSoin(id, pre = {}) {
  const ex = id ? get('soins', id) : null;
  if (id && !ex) return;
  const hs = chevaux(), all = chevaux(true);
  if (!all.length) { toast("Ajoute d'abord un cheval."); formCheval(null); return; }
  const s = ex ? clone(ex) : { types: pre.type ? [pre.type] : [], date: todayISO() };
  const selH = ex ? [ex.horseId] : pre.hid ? [pre.hid] : (hs.length === 1 ? [hs[0].id] : []);
  const multi = !ex;
  const auto = d => (d > todayISO() ? 'prevu' : 'fait');
  const statut0 = ex ? (ex.statut === 'prevu' ? 'prevu' : 'fait') : auto(s.date);
  const hOpts = horseOpts(ex ? all.filter(h => !h.archive || h.id === ex.horseId) : hs);
  const body = `
    ${grp(multi ? 'Chevaux' : 'Cheval', chips('h', hOpts, selH, { multi }) + (multi && hs.length > 2 ? '<button type="button" class="link" data-act="all-h" style="align-self:flex-start">Tout le monde</button>' : ''))}
    ${grp('Soin', chips('types', SOINS.map(T => ({ v: T.id, html: `${ic(T.icon, 'sm')}<span>${T.short}</span>` })), s.types, { multi: true }), 'Plusieurs choix possibles : grippe + tétanos en une injection, par exemple.')}
    <div id="w_label"${(s.types || []).includes('autre') ? '' : ' hidden'}>${fld('Précision', inp('f_label', s.label, 'placeholder="ex. coproscopie, radio, échographie" autocomplete="off"'))}</div>
    <div class="grid2">${fld('Date', inp('f_date', s.date, 'type="date" required'))}${grp('Statut', chips('statut', [{ v: 'fait', l: 'Fait' }, { v: 'prevu', l: 'Prévu' }], statut0))}</div>
    ${ex && ex.statut === 'prevu' ? `<button type="button" class="btn" id="b_done">${ic('check', 'sm')}Marquer fait aujourd'hui</button>` : ''}
    <div class="grid2">${fld('Praticien', inp('f_prat', s.praticien, 'list="dl-prat" autocomplete="off"'))}${fld('Produit', inp('f_prod', s.produit, 'list="dl-prod" autocomplete="off" placeholder="vaccin, vermifuge…"'))}</div>
    <div class="grid2">${fld('Coût (€)', inp('f_cout', s.cout != null ? String(s.cout).replace('.', ',') : '', numAttr))}${fld('Prochain rappel', inp('f_proch', s.prochain, 'type="date"'), 'Vide : calculé selon les réglages')}</div>
    ${payeField(s.payePar, 'f_cout', Number(s.cout) || 0)}
    ${fld('Notes', area('f_notes', s.notes, 'rows="2"'))}
    ${dlist('dl-prat', historyValues('soins', 'praticien'))}${dlist('dl-prod', historyValues('soins', 'produit'))}`;
  openSheet(ex ? soinLabel(ex) : 'Soin ou rendez-vous', body, {
    onMount: f => {
      let touched = false;
      f.addEventListener('chipchange', e => {
        if (e.detail.name === 'statut') touched = true;
        if (e.detail.name === 'types') $('#w_label').hidden = !chipVals(f, 'types').includes('autre');
      });
      $('#f_date').addEventListener('change', () => { if (!touched && validISO(val('f_date'))) setChips(f, 'statut', [auto(val('f_date'))]); });
      const b = $('#b_done');
      if (b) b.addEventListener('click', () => {
        if (sync.readOnly) { toast(RO_MSG, { danger: true }); return; }
        put('soins', Object.assign({}, ex, { date: todayISO(), statut: 'fait' })); closeSheet(); toast('Soin marqué comme fait');
      });
    },
    onSubmit: f => {
      const hids = chipVals(f, 'h');
      if (!hids.length) return 'Choisis au moins un cheval.';
      const types = chipVals(f, 'types');
      if (!types.length) return 'Choisis le type de soin.';
      const date = val('f_date');
      if (!validISO(date)) return 'Indique la date.';
      const statut = chipVal(f, 'statut') || auto(date);
      if (statut === 'fait' && date > todayISO()) return 'Un soin fait ne peut pas être daté dans le futur : choisis « Prévu ».';
      const coutRaw = val('f_cout'), cout = parseNum(coutRaw);
      if (coutRaw && cout == null) return 'Le coût doit être un nombre, par exemple 45 ou 45,50.';
      const proch = val('f_proch');
      if (proch && proch <= date) return 'Le prochain rappel doit tomber après la date du soin.';
      const base = { types, label: types.includes('autre') ? val('f_label') : '', date, statut, praticien: val('f_prat'), produit: val('f_prod'), cout, payePar: lirePaye(cout), prochain: proch || null, notes: val('f_notes') };
      if (ex) { put('soins', Object.assign({}, ex, base, { horseId: hids[0] })); toast('Soin enregistré'); return; }
      const ids = hids.map(hid => put('soins', Object.assign({ horseId: hid }, base)).id);
      toast(`${statut === 'prevu' ? 'Rendez-vous noté' : 'Soin enregistré'}${ids.length > 1 ? ` pour ${ids.length} chevaux` : ''}`, { undo: () => ids.forEach(i => del('soins', i)) });
    },
    onDelete: ex ? () => { del('soins', ex.id); toast('Soin supprimé'); } : null
  });
}
ACT['edit-soin'] = d => formSoin(d.id);
ACT['all-h'] = () => { const f = $('#sf'); if (f) setChips(f, 'h', chevaux().map(h => h.id)); };

/* ---------- Prés : rotation, repos, entretien ---------- */
function statusPill(s) {
  if (s.occupe) return s.over ? '<span class="pill warn">À changer</span>' : '<span class="pill hay">En pâture</span>';
  if (s.jamais) return '<span class="pill info">Libre</span>';
  return s.pret ? '<span class="pill ok">Prêt</span>' : '<span class="pill">Au repos</span>';
}
function pcard({ p, s }, detail = false) {
  const sub = (p.surface ? `${num(p.surface, 2)} ha` : 'Surface non renseignée')
    + (s.occupe && p.surface ? ` · ${num(s.horses.length / p.surface, 1)} cheval/ha` : '');
  const inner = `<div class="row-main"><div class="row-t">${esc(p.nom)} ${exTag(p)}</div><div class="row-s">${sub}</div></div>${statusPill(s)}`;
  const head = detail ? `<div class="pcard-h">${inner}</div>` : `<button type="button" class="pcard-h" data-act="open-pre" data-id="${p.id}">${inner}</button>`;
  if (s.occupe) {
    const pct = Math.min(100, Math.round(s.days / s.max * 100));
    return `<article class="pcard">${head}
      <div class="pnums"><span class="big">${s.days}</span><span class="unit">${pl(s.days, 'jour')} de pâture · max ${s.max}</span></div>
      <div class="gauge graze${s.over ? ' over' : ''}" role="img" aria-label="${s.days} jours de pâture sur ${s.max}"><i style="width:${pct}%"></i></div>
      <div class="wrap">${s.horses.map(id => hchip(cheval(id))).join('')}</div>
      <button type="button" class="btn small" data-act="move-from" data-id="${p.id}">${ic('move', 'sm')}Déplacer</button></article>`;
  }
  const add = `<button type="button" class="btn small" data-act="move-to" data-id="${p.id}">${ic('plus', 'sm')}Y mettre des chevaux</button>`;
  if (s.jamais) return `<article class="pcard">${head}<p class="note">Pas encore pâturé dans le carnet.</p>${add}</article>`;
  const pct = Math.min(100, Math.round(s.repos / s.cible * 100));
  return `<article class="pcard">${head}
    <div class="pnums"><span class="big">${s.repos}</span><span class="unit">${pl(s.repos, 'jour')} de repos · objectif ${s.cible}</span></div>
    <div class="gauge" role="img" aria-label="${s.repos} jours de repos sur ${s.cible}"><i style="width:${pct}%"></i></div>${add}</article>`;
}
const col = html => `<div style="display:flex;flex-direction:column;gap:12px">${html}</div>`;

VIEWS.pres = () => {
  const ps = pres().map(p => ({ p, s: preStatus(p) }));
  if (!ps.length) return { title: 'Prés', eyebrow: 'Rotation de pâture', html: emptyH('Aucun pré', 'Ajoute tes parcelles avec le bouton +. Le carnet comptera les jours de pâture et de repos de chacune.'), fab: () => formPre(null), fabLabel: 'Nouveau pré' };
  const occ = ps.filter(x => x.s.occupe).sort((a, b) => b.s.days - a.s.days);
  const prets = ps.filter(x => !x.s.occupe && x.s.pret).sort((a, b) => (b.s.repos ?? -1) - (a.s.repos ?? -1));
  const repos = ps.filter(x => !x.s.occupe && !x.s.pret).sort((a, b) => (b.s.repos / b.s.cible) - (a.s.repos / a.s.cible));
  const surf = ps.reduce((a, x) => a + (Number(x.p.surface) || 0), 0);
  let html = `<div class="stats">
    <div class="stat"><b>${occ.length}</b><span>${pl(occ.length, 'pré occupé', 'prés occupés')}</span></div>
    <div class="stat"><b>${prets.length}</b><span>${pl(prets.length, 'prêt', 'prêts')} à pâturer</span></div>
    <div class="stat"><b>${num(surf, 1)}</b><span>ha au total</span></div></div>`;
  if (occ.length) html += section('En pâture', col(occ.map(x => pcard(x)).join('')));
  if (prets.length) html += section('Prêts à pâturer', col(prets.map(x => pcard(x)).join('')));
  if (repos.length) html += section('Au repos', col(repos.map(x => pcard(x)).join('')));
  const box = chevaux().filter(h => !openPlace(h.id));
  if (box.length) html += section('Au box', `<div class="list"><div class="row">${lead('barn')}<div class="row-main"><div class="wrap">${box.map(hchip).join('')}</div></div><button type="button" class="btn small" data-act="new" data-what="move">Placer</button></div></div>`);
  const arch = list('pres').filter(p => p.archive).sort(byName);
  if (arch.length) html += `<div class="sec"><button type="button" class="link" data-act="toggle-arch-pres" style="align-self:flex-start">${ui.showArchPres ? 'Masquer' : 'Afficher'} les prés archivés (${arch.length})</button>${ui.showArchPres ? `<div class="list">${arch.map(p => `<button type="button" class="row" data-act="open-pre" data-id="${p.id}">${lead('fence')}<div class="row-main"><div class="row-t">${esc(p.nom)}</div></div></button>`).join('')}</div>` : ''}</div>`;
  return { title: 'Prés', eyebrow: 'Rotation de pâture', html, fab: menuPres, fabLabel: 'Ajouter' };
};
ACT['toggle-arch-pres'] = () => { ui.showArchPres = !ui.showArchPres; saveUi(); render(); };

VIEWS.pre = p => {
  const pre = get('pres', p.id);
  if (!pre) return { title: 'Pré', html: empty('Pré introuvable', 'Ce pré a été supprimé.') };
  const s = preStatus(pre), t = todayISO(), yr = t.slice(0, 4);
  const segs = segments(pre.id).slice().reverse();
  let html = pcard({ p: pre, s }, true);
  html += `<div class="stats">
    <div class="stat"><b>${joursPatures(pre.id, yr + '-01-01')}</b><span>jours pâturés en ${yr}</span></div>
    <div class="stat"><b>${s.cible}</b><span>jours de repos visés</span></div>
    <div class="stat"><b>${s.max}</b><span>jours de pâture max</span></div></div>`;
  const tks = tachesTriees(tk => tk.preId === pre.id);
  html += section('Tâches', tks.length ? tachesListe(tks) : "<p class=\"note\">Foin, eau, crottins… Ajoute les tâches de ce pré : chacun les coche quand c'est fait.</p>",
    sync.readOnly ? '' : `<button type="button" class="link" data-act="new" data-what="tache" data-pid="${pre.id}">${ic('plus', 'sm')}Ajouter</button>`);
  const ents = list('entretiens').filter(e => e.preId === pre.id).sort((a, b) => b.date.localeCompare(a.date));
  html += section('Entretien', ents.length ? `<div class="list">${ents.map(e =>
    `<button type="button" class="row" data-act="edit-entretien" data-id="${e.id}">${lead('tool')}<div class="row-main"><div class="row-t">${esc(e.type)}</div><div class="row-s">${esc([dFull(e.date), e.notes].filter(Boolean).join(' · '))}</div></div></button>`).join('')}</div>`
    : '<p class="note">Hersage, fauche des refus, amendement, clôtures… Note-les avec le bouton +.</p>',
    `<button type="button" class="link" data-act="new" data-what="entretien" data-pid="${pre.id}">${ic('plus', 'sm')}Ajouter</button>`);
  html += section('Historique de pâture', segs.length ? `<div class="list">${segs.map(g =>
    `<div class="row">${lead(g.open ? 'leaf' : 'clock')}<div class="row-main"><div class="row-t">${dShort(g.a)} → ${g.open ? "aujourd'hui" : dShort(g.b)}</div><div class="row-s">${esc([...g.horses].map(hNom).join(', '))}</div></div><span class="row-end num">${nJ(diffDays(g.a, g.b))}</span></div>`).join('')}</div>`
    : "<p class=\"note\">Aucun passage enregistré pour l'instant.</p>");
  if (pre.notes) html += `<div class="card"><div class="eyebrow">Notes</div><div style="white-space:pre-wrap">${esc(pre.notes)}</div></div>`;
  html += `<div class="btnrow"><button type="button" class="btn" data-act="edit-pre" data-id="${pre.id}">${ic('edit', 'sm')}Modifier le pré</button></div>`;
  const eyebrow = [pre.surface ? `${num(pre.surface, 2)} ha` : '', pre.archive ? 'archivé' : ''].filter(Boolean).join(' · ') || 'Pré';
  return { title: pre.nom, eyebrow, html, fab: () => formEntretien(null, { pid: pre.id }), fabLabel: 'Ajouter un entretien' };
};

function menuPres() {
  const mi = (what, icon, t, s) => `<button type="button" class="row" data-act="new" data-what="${what}">${lead(icon)}<div class="row-main"><div class="row-t">${t}</div><div class="row-s">${s}</div></div></button>`;
  openSheet('Prés', `<div class="list">
    ${mi('move', 'move', 'Déplacer des chevaux', 'Changer de pré ou rentrer au box')}
    ${mi('entretien', 'tool', 'Entretien de pré', 'Hersage, fauche des refus, clôtures…')}
    ${mi('pre', 'fence', 'Nouveau pré', 'Ajouter une parcelle')}</div>`);
}

function formMove(pre = {}) {
  const hs = chevaux(), ps = pres();
  if (!hs.length) { toast("Ajoute d'abord un cheval."); formCheval(null); return; }
  if (!ps.length) { toast("Ajoute d'abord un pré."); formPre(null); return; }
  let dest = pre.to || null, sel = [];
  if (pre.from) {
    sel = list('places').filter(x => x.preId === pre.from && !x.fin).map(x => x.horseId);
    const nx = prePret(pre.from);
    if (!dest && nx) dest = nx.p.id;
  }
  if (pre.hid) sel = [pre.hid];
  const destOpts = ps.filter(p => p.id !== pre.from).map(p => {
    const s = preStatus(p);
    const sub = s.occupe ? `occupé · ${nJ(s.days)}` : s.jamais ? 'libre' : `repos ${nJ(s.repos)}${s.pret ? ' · prêt' : ''}`;
    return { v: p.id, html: `<span class="two"><span>${esc(p.nom)}</span><small>${esc(sub)}</small></span>` };
  });
  destOpts.push({ v: '__box', html: `${ic('barn', 'sm')}<span>Box / écurie</span>` });
  const from = pre.from ? get('pres', pre.from) : null;
  const body = `
    ${from ? `<p class="note">Depuis <b>${esc(from.nom)}</b></p>` : ''}
    ${grp('Vers', chips('dest', destOpts, dest ? [dest] : []))}
    ${grp('Chevaux', chips('h', horseOpts(hs, h => horseWhere(h.id).txt), sel, { multi: true }) + (hs.length > 2 ? '<button type="button" class="link" data-act="all-h" style="align-self:flex-start">Tout le monde</button>' : ''))}
    ${fld('Date', inp('f_date', todayISO(), 'type="date" required'), 'Change la date si le déplacement a eu lieu avant.')}`;
  openSheet('Déplacer des chevaux', body, {
    submit: 'Déplacer',
    onSubmit: f => {
      const d = chipVal(f, 'dest');
      if (!d) return 'Choisis où vont les chevaux.';
      const hids = chipVals(f, 'h');
      if (!hids.length) return 'Choisis au moins un cheval.';
      const date = val('f_date');
      if (!validISO(date)) return 'Indique la date.';
      if (date > todayISO()) return 'La date ne peut pas être dans le futur.';
      const preId = d === '__box' ? null : d;
      const r = moveHorses(hids, preId, date);
      if (r.err) return r.err;
      const destName = preId ? get('pres', preId).nom : 'au box';
      toast(`${hids.length > 1 ? hids.length + ' chevaux' : hNom(hids[0])} → ${destName}`, { undo: r.undo });
    }
  });
}
ACT['move-from'] = d => formMove({ from: d.id });
ACT['move-to'] = d => formMove({ to: d.id });

function formPre(id) {
  const ex = id ? get('pres', id) : null;
  if (id && !ex) return;
  const p = ex ? clone(ex) : { nom: '' };
  const C = cfg();
  const body = `
    ${fld('Nom', inp('f_nom', p.nom, 'required autocomplete="off" autocapitalize="sentences" placeholder="ex. Pré du bas"'))}
    ${fld('Surface (ha)', inp('f_surf', p.surface != null ? String(p.surface).replace('.', ',') : '', numAttr + ' placeholder="ex. 1,5"'))}
    <div class="grid2">${fld('Repos visé (jours)', inp('f_repos', p.repos, `inputmode="numeric" autocomplete="off" placeholder="${C.repos}"`))}${fld('Pâture max (jours)', inp('f_pat', p.paturage, `inputmode="numeric" autocomplete="off" placeholder="${C.paturage}"`))}</div>
    <p class="hint">Laisse vide pour garder les valeurs des réglages : ${C.repos} jours de repos, ${C.paturage} jours de pâture.</p>
    ${fld('Notes', area('f_notes', p.notes, 'rows="3" placeholder="Abreuvoir, abri, type d\'herbe, clôture…"'))}
    ${ex ? `<label class="check"><input type="checkbox" id="f_arch"${p.archive ? ' checked' : ''}> Archiver ce pré</label>` : ''}`;
  openSheet(ex ? 'Modifier le pré' : 'Nouveau pré', body, {
    focus: ex ? null : '#f_nom',
    onSubmit: () => {
      const nom = val('f_nom');
      if (!nom) return 'Indique le nom du pré.';
      const surface = parseNum(val('f_surf'));
      if (val('f_surf') && (surface == null || surface <= 0)) return 'La surface doit être un nombre positif, en hectares.';
      const repos = parseNum(val('f_repos')), pat = parseNum(val('f_pat'));
      if ((val('f_repos') && (repos == null || repos < 1)) || (val('f_pat') && (pat == null || pat < 1))) return "Les durées doivent être d'au moins 1 jour.";
      Object.assign(p, { nom, surface, repos: repos ? Math.round(repos) : null, paturage: pat ? Math.round(pat) : null, notes: val('f_notes') });
      if (ex) p.archive = $('#f_arch').checked;
      put('pres', p);
      toast(ex ? 'Pré enregistré' : `${nom} ajouté`);
    },
    onDelete: ex ? () => deletePre(id) : null,
    delConfirm: 'Supprimer aussi son historique ?'
  });
}
function deletePre(id) {
  const p = get('pres', id);
  ['places', 'entretiens'].forEach(k => list(k).filter(o => o.preId === id).forEach(o => del(k, o.id)));
  list('taches').filter(tk => tk.preId === id).forEach(tk => put('taches', Object.assign({}, tk, { preId: null })));
  del('pres', id);
  const t = topView();
  if (t && t.view === 'pre' && t.id === id) nav.stack.pop();
  render();
  toast(`${p ? p.nom : 'Pré'} supprimé`);
}
ACT['edit-pre'] = d => formPre(d.id);

function formEntretien(id, pre = {}) {
  const ex = id ? get('entretiens', id) : null;
  if (id && !ex) return;
  const ps = pres(true).filter(p => !p.archive || (ex && ex.preId === p.id));
  if (!ps.length) { toast("Ajoute d'abord un pré."); formPre(null); return; }
  const e = ex ? clone(ex) : { preId: pre.pid || (ps.length === 1 ? ps[0].id : null), type: null, date: todayISO() };
  const body = `
    ${grp('Pré', chips('pre', ps.map(p => ({ v: p.id, l: p.nom })), e.preId ? [e.preId] : []))}

function formFoin(id, pre = {}) {
  const ex = id ? get('foin', id) : null;
  if (id && !ex) return;
  const C = cfg();
  const m = ex ? clone(ex) : { sens: pre.sens === 'out' ? 'out' : 'in', balle: pre.balle || C.balles[0].id, nb: 1, date: todayISO() };
  const bOpts = C.balles.map(b => ({ v: b.id, l: b.nom }));
  if (ex && !C.balles.some(b => b.id === ex.balle)) bOpts.push({ v: ex.balle, l: ex.balle });
  const origines = Array.from(new Set([...pres(true).map(p => 'Récolte ' + p.nom), ...historyValues('foin', 'origine')]));
  const defW = b => (C.balles.find(x => x.id === b) || {}).poids || '';

    ${grp('Mouvement', chips('sens', [{ v: 'in', l: 'Entrée : achat, récolte' }, { v: 'out', l: 'Sortie : balle entamée' }], m.sens))}
    ${grp('Type de balle', chips('balle', bOpts, m.balle), 'Types et poids moyens se règlent dans les réglages.')}
    <div class="grid2">${fld('Nombre', inp('f_nb', m.nb, 'inputmode="numeric" autocomplete="off" required'))}${fld('Date', inp('f_date', m.date, 'type="date" required'))}</div>
    <div id="w_in" style="display:flex;flex-direction:column;gap:16px"${m.sens === 'in' ? '' : ' hidden'}>

      ${payeField(m.payePar, 'f_prix', Number(m.prix) || 0)}
      ${fld('Provenance', inp('f_orig', m.origine, `list="dl-orig" autocomplete="off" placeholder="Récolte d'un pré, fournisseur…"`))}

      const nb = parseNum(val('f_nb'));

        if (nb > dispo) return `Il ne reste que ${Math.max(0, dispo)} ${balleNom(balle, 2)} en stock. Enregistre d'abord l'entrée correspondante.`;
      }

    onDelete: ex ? () => { del('foin', id); toast('Mouvement supprimé'); } : null

const plusieursCavaliers = () => new Set(list('concours').map(x => pKey({ uid: x.cavalierUid, nom: x.cavalier })).filter(Boolean)).size > 1;

function formConcours(id, pre = {}) {
  const ex = id ? get('concours', id) : null;
  if (id && !ex) return;
  const hs = chevaux(), all = chevaux(true);
  if (!all.length) { toast("Ajoute d'abord un cheval."); formCheval(null); return; }
  const t = todayISO();
  let c;
  if (ex) c = clone(ex);
  else if (pre.copy) {
    const o = pre.copy;
    c = { date: o.date, dateFin: o.dateFin, lieu: o.lieu, discipline: o.discipline, niveau: o.niveau, epreuve: o.epreuve, cavalier: o.cavalier, cavalierUid: o.cavalierUid || null, statut: 'a_engager', cloture: o.cloture, frais: o.frais, payePar: o.payePar || null };
  } else c = { date: '', discipline: lastUsed('concours', 'discipline') || null, niveau: lastUsed('concours', 'niveau') || null, statut: 'a_engager' };
  const cavRef = c.cavalier || c.cavalierUid ? { uid: c.cavalierUid || null, nom: c.cavalier || '' } : null;
  const selH = ex ? [ex.horseId] : pre.hid ? [pre.hid] : (hs.length === 1 ? [hs[0].id] : []);
  const passe = !!(ex && ex.date <= t);
  const hOpts = horseOpts(ex ? all.filter(h => !h.archive || h.id === ex.horseId) : hs);
  const resultat = `<div class="box" id="w_res"${ex || (validISO(c.date) && c.date <= t) ? '' : ' hidden'}>

    ${grp('Niveau', chips('niv', NIVEAUX.map(n => ({ v: n.id, l: n.label })), c.niveau ? [c.niveau] : [], { optional: true }), 'Sert à vérifier les vaccins exigés.')}
    ${fld('Épreuve', inp('f_epr', c.epreuve, 'list="dl-epr" autocomplete="off" placeholder="ex. Club 2 Grand Prix"'))}
    ${pickPerson('cav', 'Cavalier', cavRef, { moi: !cavRef, def: lastUsed('concours', 'cavalier') })}
    ${grp('Engagement', chips('eng', ENGAGEMENT.map(e => ({ v: e.id, l: e.label })), c.statut || 'a_engager'))}
    <div class="grid2">${fld('Clôture des engagements', inp('f_clot', c.cloture, 'type="date"'))}${fld('Frais (€)', inp('f_frais', c.frais != null ? String(c.frais).replace('.', ',') : '', numAttr))}</div>
    ${payeField(c.payePar, 'f_frais', Number(c.frais) || 0)}
    ${passe ? '' : resultat}
    ${fld('Notes', area('f_notes', c.notes, 'rows="2" placeholder="Horaires, box, transport…"'))}
    ${ex && !passe ? `<button type="button" class="btn" id="b_dup">${ic('copy', 'sm')}Dupliquer pour un autre cheval ou une autre épreuve</button>` : ''}
    ${dlist('dl-lieu', historyValues('concours', 'lieu'))}${dlist('dl-epr', historyValues('concours', 'epreuve'))}`;
  const title = ex ? (passe && !hasResult(ex) ? 'Saisir le résultat' : (ex.lieu || 'Concours')) : 'Nouveau concours';
  openSheet(title, body, {
    onMount: () => {

    },

      if (rang && part && rang > part) return 'Le classement ne peut pas dépasser le nombre de partants.';
      const cav = readPerson('cav');
      const base = {

function doImport(d) {
  const okId = o => o && typeof o === 'object' && typeof o.id === 'string' && /^[A-Za-z0-9_\-~:@+]{1,100}$/.test(o.id);
  restauration = true;
  try {
    COLS.forEach(k => {
      const incoming = (Array.isArray(d[k]) ? d[k] : []).filter(okId);
      const keep = new Set(incoming.map(o => o.id));
      list(k).forEach(o => { if (!keep.has(o.id)) del(k, o.id); });
      incoming.forEach(o => put(k, o));
    });
  } finally { restauration = false; }
  if (d.cfg && typeof d.cfg === 'object') putCfg(d.cfg);
  nav.stack = [];
  render();

/* ---------- Tâches partagées : chacun coche, tout le monde voit ---------- */
function tacheSub(tk, e) {
  const pre = tk.preId ? get('pres', tk.preId) : null, h = tk.horseId ? cheval(tk.horseId) : null;
  const qui = tk.resp && pKey(tk.resp) ? (estMoi(tk.resp) ? 'Pour toi' : 'Pour ' + nomCourt(tk.resp)) : '';
  const where = [qui, pre ? pre.nom : '', h ? h.nom : ''].filter(Boolean).join(' · ');
  let st;
  if (e.done) st = faitTxt(e.last) + (e.n > 1 && e.next ? ` · à refaire ${dRel(e.next)}` : '');
  else if (tk.freq === 'une') st = e.due ? (e.days < 0 ? `En retard de ${nJ(-e.days)}` : `À faire ${dRel(e.due)}`) : 'À faire';
  else if (e.last) st = (e.retard > 0 ? `En retard de ${nJ(e.retard)} · ` : '') + `Dernière fois ${dRel(e.last.d)}${e.last.par ? ', ' + e.last.par : ''}`;
  else st = freqLabel(tk);
  return [where, st].filter(Boolean).join(' · ');
}
function trow(tk) {
  const e = tacheEtat(tk);
  const late = !e.done && e.retard > 0;
  return `<div class="trow${e.done ? ' done' : ''}${late ? ' late' : ''}" data-key="tk-${esc(tk.id)}">
    <button type="button" class="tick" data-act="tick" data-id="${tk.id}" aria-pressed="${e.done}" aria-label="${esc(tk.titre)} : ${e.done ? 'fait, toucher pour annuler' : 'marquer comme fait'}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path pathLength="1" d="M5.5 12.8 10 17.2 18.8 7.2"/></svg></button>
    <button type="button" class="trow-main" data-act="edit-tache" data-id="${tk.id}"><span class="row-t">${esc(tk.titre)}</span><span class="row-s">${esc(tacheSub(tk, e))}</span></button>
  </div>`;
}
function tachesTriees(filter) {
  const xs = taches().filter(filter || (() => true)).map(tk => ({ tk, e: tacheEtat(tk) })).filter(x => x.e.visible);
  // juste après une coche, la liste garde son ordre le temps de l'animation, puis la ligne glisse à sa place
  if (fx.ordre && Date.now() < fx.jusqua) {
    const pos = new Map(fx.ordre.map((id, i) => [id, i]));
    return xs.sort((a, b) => (pos.has(a.tk.id) ? pos.get(a.tk.id) : 999) - (pos.has(b.tk.id) ? pos.get(b.tk.id) : 999));
  }
  return xs.sort((a, b) => (a.e.done - b.e.done)
    || (a.e.done ? ((b.e.last.t || 0) - (a.e.last.t || 0)) : ((b.e.retard || 0) - (a.e.retard || 0)))
    || String(a.tk.titre).localeCompare(String(b.tk.titre), 'fr'));
}
const tachesListe = xs => `<div class="list">${xs.map(x => trow(x.tk)).join('')}</div>`;
function tachesSection() {

  const add = sync.readOnly ? '' : `<button type="button" class="link" data-act="new" data-what="tache">${ic('plus', 'sm')}Ajouter</button>`;

const toutFait = () => { const xs = tachesTriees(); return xs.length > 0 && xs.every(x => x.e.done); };
/* Fige l'ordre des tâches un instant, puis laisse les lignes glisser à leur place */
function figeOrdre() {
  fx.ordre = tachesTriees().map(x => x.tk.id);
  fx.jusqua = Date.now() + 1100;
  setTimeout(rerenderSoon, 1150);
}
ACT.tick = d => {
  const tk = get('taches', d.id);
  if (!tk) return;
  if (tacheEtat(tk).done) {
    const prev = clone(tk);
    figeOrdre();
    put('taches', Object.assign({}, tk, { fait: faitsDe(tk).slice(1) }));
    toast('Coche retirée', { undo: () => put('taches', prev) });
    return;
  }
  withName(nom => {
    const cur = get('taches', d.id);
    if (!cur) return;
    const prev = clone(cur), avant = toutFait();
    const f = { d: todayISO(), t: Date.now(), par: nom, uid: me.uid || null };
    figeOrdre();
    put('taches', Object.assign({}, cur, { fait: [f, ...faitsDe(cur)].slice(0, 30) }));
    render();
    // la coche se dessine, rebondit et lâche une gerbe de crins
    $$(`.tick[data-id="${CSS.escape(cur.id)}"]`).forEach(el => { fxOnce(el, 'fx-coche', 700); confettis(el); });
    vibre(12);
    if (!avant && toutFait()) {
      setTimeout(galop, 350);
      toast("Tout est fait pour aujourd'hui, bravo !", { fete: true, undo: () => put('taches', prev) });
    } else toast(`${cur.titre} : fait`, { undo: () => put('taches', prev) });
  });
};
ACT['add-sugg'] = () => {

/* ---------- Entraînement : séances faites ou prévues ---------- */
function seanceRow(s, showHorse = false) {
  const t = todayISO(), h = cheval(s.horseId), prevu = s.statut === 'prevu';
  const title = [s.type || 'Séance', durTxt(s.duree)].filter(Boolean).join(' · ');
  const cav = nomDe({ uid: s.cavalierUid, nom: s.cavalier });
  const who = [prevu && s.heure ? heureTxt(s.heure) : '', s.coach ? `Coach : ${s.coach}` : '', cav ? `Cavalier : ${cav}` : '', s.lieu].filter(Boolean).join(' · ');
  const pills = [
    prevu ? (s.date < t ? '<span class="pill warn">À confirmer</span>' : '<span class="pill info">Prévue</span>') : '',
    s.intensite ? `<span class="pill">${esc(intLabel(s.intensite))}</span>` : '',
    !prevu && s.ressenti ? `<span class="pill ${s.ressenti === 'difficile' ? 'warn' : s.ressenti === 'moyen' ? '' : 'ok'}">${esc(resLabel(s.ressenti))}</span>` : '',
    showHorse && h ? hchip(h) : ''
  ].join('');
  return `<button type="button" class="ccard" data-act="edit-seance" data-id="${s.id}">

    <span class="row-main"><span class="row-t">${esc(title)}</span>${who ? `<span class="row-s">${esc(who)}</span>` : ''}${s.notes ? `<span class="row-s clamp2">${esc(s.notes)}</span>` : ''}${pills ? `<span class="wrap" style="margin-top:4px">${pills}</span>` : ''}</span>

function entrainementHtml(h) {
  const t = todayISO(), st = statsSeances(h.id), ss = seancesDe(h.id);
  if (!ss.length) return emptyH('Aucune séance', "Note le travail du jour ou prévois un cours avec ton coach : type, durée, intensité, cavalier, coach, ressenti.")
    + (sync.readOnly ? '' : `<button type="button" class="btn primary" data-act="new" data-what="seance" data-hid="${h.id}">${ic('plus', 'sm')}Ajouter une séance</button>`);
  const repos = st.last ? diffDays(st.last.date, t) : null;
  const stats = `<div class="stats">
    <div class="stat"><b>${st.n7}</b><span>${pl(st.n7, 'séance')} sur 7 jours</span></div>
    <div class="stat"><b>${st.min7 ? durTxt(st.min7) : '0'}</b><span>de travail sur 7 jours</span></div>
    <div class="stat"><b>${repos == null ? '–' : repos + ' j'}</b><span>${repos == null ? 'pas encore de séance faite' : 'depuis la dernière séance'}</span></div></div>`;
  const up = ss.filter(s => s.statut === 'prevu').sort((a, b) => a.date.localeCompare(b.date) || String(a.heure || '').localeCompare(String(b.heure || '')));
  const past = ss.filter(s => s.statut !== 'prevu').sort((a, b) => b.date.localeCompare(a.date) || (b.maj || 0) - (a.maj || 0));
  return stats
    + (up.length ? section('Prévues', `<div class="list">${up.map(s => seanceRow(s)).join('')}</div>`) : '')

    <div class="wrap">${DUREES.map(m => `<button type="button" class="chip" data-act="fill" data-target="f_duree" data-fill="${m}">${durTxt(m)}</button>`).join('')}</div>
    ${grp('Intensité', chips('int', INTENSITES.map(x => ({ v: x.id, l: x.label })), s.intensite ? [s.intensite] : [], { optional: true }))}

    ${pickPerson('cav', 'Cavalier', ex && (s.cavalier || s.cavalierUid) ? { uid: s.cavalierUid || null, nom: s.cavalier || '' } : null, { moi: !ex, def: lastUsed('seances', 'cavalier') })}

    onDelete: ex ? () => { const prev = clone(ex); del('seances', ex.id); toast('Séance supprimée', { undo: () => put('seances', prev) }); } : null
  });
}
ACT['edit-seance'] = d => formSeance(d.id);

/* ---------- Équipe : qui fait quoi, dépenses, fiches personnelles, contacts utiles ---------- */
const eurRond = v => num(Math.round(Number(v) || 0), 0) + ' €';
const perSeg = () => segCtl('eqPer', [['mois', 'Ce mois'], ['annee', 'Cette année'], ['tout', 'Tout']], periode(ui.eqPer).id);
const debutT = P => P.from ? new Date(P.from + 'T00:00:00').getTime() : 0;
const estGerante = () => !!(window.EQ_MODE && window.EQ && EQ.role === 'gerante');

function chevauxDe(k) {
  const own = chevaux(true).filter(h => pKey(propRef(h)) === k);
  const dps = [];
  chevaux(true).forEach(h => dpsDe(h).forEach(x => { if (pKey(x.qui) === k) dps.push({ h, x }); }));
  return { own, dps };
}
function resumeBilan(a) {
  const parts = [];
  if (a && a.taches) parts.push(`${a.taches} ${pl(a.taches, 'tâche')}`);
  if (a && a.seances) parts.push(`${a.seances} ${pl(a.seances, 'séance')}`);
  if (a && a.dep) parts.push(eur(a.dep));
  return parts.join(' · ') || 'Rien sur la période';
}
function rowPersonne(p, a) {
  const { own, dps } = chevauxDe(p.k);
  const enCours = dps.filter(d => dpActive(d.x));
  const chev = [own.length ? `Propriétaire : ${own.map(h => h.nom).join(', ')}` : '', enCours.length ? `Demi-pension : ${enCours.map(d => d.h.nom).join(', ')}` : ''].filter(Boolean).join(' · ');
  const role = p.m && p.m.role !== 'equipe' ? `<span class="pill${p.m.role === 'gerante' ? ' ok' : ''}">${esc(ROLE_LABEL[p.m.role] || '')}</span>` : '';
  const moi = estMoi(p.k) ? '<span class="pill ok">Toi</span>' : '';
  return `<button type="button" class="row" data-act="open-membre" data-k="${esc(p.k)}">${pav(p, 'm')}<div class="row-main">
    <div class="row-t">${esc(p.nom)} ${moi}${role}</div><div class="row-s">${esc(resumeBilan(a))}</div>${chev ? `<div class="row-s">${esc(chev)}</div>` : ''}
  </div><span class="row-end">${ic('next', 'sm')}</span></button>`;
}
function rowDep(e, sansPayeur = false) {
  const qui = pKey(e.qui) ? nomCourt(e.qui) : 'Payeur à indiquer';
  const sub = [dShort(e.d), e.hid ? hNom(e.hid) : '', sansPayeur ? '' : qui].filter(Boolean).join(' · ');
  return `<button type="button" class="row" data-act="${ACT_DEP[e.coll]}" data-id="${esc(e.id)}">${lead(catDe(e.cat).icon)}<div class="row-main"><div class="row-t">${esc(e.label)}</div><div class="row-s">${esc(sub)}</div></div><span class="row-end num">${eur(e.v)}</span></button>`;
}
/* Fil de l'équipe : la personne, puis ce qu'elle a fait ; dans une fiche, l'objet puis l'action */
function rowFil(it, dansFiche = false) {
  const inner = dansFiche
    ? `${lead(it.icon)}<div class="row-main"><div class="row-t">${esc(it.objet)}</div><div class="row-s">${esc(it.quoi)} · ${esc(quandTxt(it.t))}</div></div>`

  return it.act ? `<button type="button" class="row" ${it.act}>${inner}</button>` : `<div class="row">${inner}</div>`;
}

VIEWS.equipe = () => {
  const P = periode(ui.eqPer), B = bilan(P.from), ms = membres();
  let html = perSeg();
  html += `<div class="stats">
    <div class="stat"><b>${B.taches}</b><span>${pl(B.taches, 'tâche cochée', 'tâches cochées')}</span></div>
    <div class="stat"><b>${B.seances}</b><span>${pl(B.seances, 'séance', 'séances')} de travail</span></div>
    <div class="stat"><b>${eurRond(B.total)}</b><span>de dépenses</span></div></div>`;
  // les membres, puis les personnes hors équipe qui apparaissent dans le carnet (demi-pension, cavalier, payeur…)
  const keys = new Set(ms.map(m => 'u:' + m.id)), autres = new Set();
  const voir = k => { if (k && k !== '_' && !keys.has(k)) autres.add(k); };
  B.by.forEach((a, k) => voir(k));
  chevaux(true).forEach(h => { voir(pKey(propRef(h))); dpsDe(h).forEach(x => voir(pKey(x.qui))); });
  if (!ms.length) voir(kMoi());
  const na = B.by.get('_');
  const naRow = na && na.dep > 0 ? `<button type="button" class="row sev-warn" data-act="dep-na">${lead('euro')}<div class="row-main"><div class="row-t">${eur(na.dep)} sans payeur</div><div class="row-s">${na.items.length} ${pl(na.items.length, 'dépense')} ${P.label} : touche pour indiquer qui a payé</div></div><span class="row-end">${ic('next', 'sm')}</span></button>` : '';
  const ext = [...autres].map(personne).filter(Boolean).sort(byName).map(p => rowPersonne(p, B.by.get(p.k)));
  if (ms.length) {
    html += section(`L'équipe <span class="count">${ms.length}</span>`, `<div class="list">${ms.map(m => rowPersonne(personne('u:' + m.id), B.by.get('u:' + m.id))).join('')}${naRow}</div>`);

  } else {
    html += section('Les personnes', ext.length || naRow ? `<div class="list">${ext.join('')}${naRow}</div>`
      : emptyH('Personne pour l\'instant', "Les prénoms apparaissent dès qu'une tâche est cochée, qu'une séance est notée ou qu'un propriétaire est indiqué."));
  }
  const fil = filEquipe(debutT(P), 25);
  html += section("Ce qui s'est passé", fil.length ? `<div class="list">${fil.map(it => rowFil(it)).join('')}</div>`
    : '<p class="note">Les tâches cochées, les soins, les séances, le foin et les déplacements notés par chacun apparaîtront ici.</p>');
  const cs = contacts();
  html += section('Contacts utiles', cs.length ? `<div class="list">${cs.map(rowContact).join('')}</div>`
    : '<p class="note">Vétérinaire, maréchal, dentiste, coach… Garde leurs numéros ici pour les appeler en un geste.</p>',
    sync.readOnly ? '' : `<button type="button" class="link" data-act="new-contact">${ic('plus', 'sm')}Ajouter</button>`);
  if (estGerante()) html += `<button type="button" class="btn" data-act="equipe">${ic('users', 'sm')}Inviter, gérer les accès</button>`;
  return { title: 'Équipe', eyebrow: ms.length ? `${ms.length} ${pl(ms.length, 'personne')}` : 'Qui fait quoi', html, fab: menuEquipe, fabLabel: 'Ajouter' };
};

VIEWS.membre = p => {
  const P = periode(ui.eqPer), B = bilan(P.from), pe = personne(p.k);
  if (!pe) return { title: 'Équipe', html: empty('Fiche introuvable', "Cette personne ne fait plus partie de l'équipe.") };
  const m = pe.m, a = B.by.get(pe.k), moi = estMoi(pe.k);

  show(`<div class="form">
      <h2 class="auth-t">Accès au carnet impossible</h2>
      <p>${regles ? "La base refuse l'accès : les règles d'accès de Firestore ne sont pas encore à jour. Recolle le fichier firestore.rules dans Firebase, onglet Règles, puis touche « Réessayer »." : "Le carnet n'a pas pu joindre la base. Vérifie ta connexion internet, puis touche « Réessayer »."}</p>
      <p class="hint">Code : ${escH((e && e.code) || 'inconnu')}</p>
      <button class="btn primary" id="aRetry">Réessayer</button>
      <div class="auth-links"><button type="button" class="link" id="aOut">Se déconnecter</button></div>
    </div>`, root => {
    root.querySelector('#aRetry').addEventListener('click', () => entrer(u));
    root.querySelector('#aOut').addEventListener('click', deconnexion);
  });
}

/* ---------- Rôles ---------- */
let ROLE = null, ME = null;
async function entrer(u) {
  const mail = (u.email || '').toLowerCase();
  let role = null, souci = null;
  try { const c = JSON.parse(localStorage.getItem(ROLE_KEY) || 'null'); if (c && c.uid === u.uid) role = c.role; } catch (x) { /* rien en cache */ }
  try {
    const m = await getDoc(doc(fs, 'membres', u.uid)).catch(e => (e && e.code === 'permission-denied') ? null : Promise.reject(e));
    if (m && m.exists()) role = m.data().role;
    else {
      let r = mail === GERANTE ? 'gerante' : null;
      if (!r) {
        const inv = await getDoc(doc(fs, 'invitations', mail)).catch(() => null);
        if (inv && inv.exists()) r = inv.data().role;
      }
      if (r) { await setDoc(doc(fs, 'membres', u.uid), { email: mail, role: r, nom: u.displayName || '', depuis: Date.now() }); role = r; }
      else role = null;
    }
  } catch (e) { souci = e; }
  if (!role && souci) { ecranSouci(u, souci); return; }
  if (!role) { ecranPasInvite(u); return; }
  try { localStorage.setItem(ROLE_KEY, JSON.stringify({ uid: u.uid, role })); } catch (x) { /* ignoré */ }
  ROLE = role;
  ME = u;
  window.EQ.email = mail;
  window.EQ.role = role;
  hide();
  window.claude._resolve('user', {
    me: async () => ({ id: u.uid, name: u.displayName || '', email: mail, isOwner: role === 'gerante', canEdit: role !== 'lecture', avatarUrl: '', color: '' }),
    id: async () => u.uid,
    isOwner: async () => role === 'gerante',
    canEdit: async () => role !== 'lecture',
    can: async n => n === 'data.write' ? role !== 'lecture' : false,
    profiles: async ids => Object.fromEntries([].concat(ids).map(i => [i, { id: i, name: '' }]))
  });
  window.claude._resolve('db', db);
}
async function deconnexion() {
  try { ['carnet-ecurie:cache:v1', 'carnet-ecurie:outbox:v1', ROLE_KEY].forEach(k => localStorage.removeItem(k)); } catch (x) { /* ignoré */ }
  await signOut(auth).catch(() => {});
  location.reload();
}

/* ---------- Équipe (gérante) ---------- */
window.EQ = {
  email: '', role: '',
  deconnexion,
  membres: async () => (await getDocs(collection(fs, 'membres'))).docs.map(d => Object.assign({ uid: d.id, moi: ME && d.id === ME.uid }, d.data())),
  invitations: async () => (await getDocs(collection(fs, 'invitations'))).docs.map(d => Object.assign({ email: d.id }, d.data())),
  inviter: (email, role) => setDoc(doc(fs, 'invitations', email.trim().toLowerCase()), { role, par: ME ? ME.uid : null, le: Date.now() }),
  annulerInvitation: email => deleteDoc(doc(fs, 'invitations', email)),
  changerRole: (uid, role) => updateDoc(doc(fs, 'membres', uid), { role }),
  // retirer quelqu'un supprime aussi son invitation, pour qu'il ne puisse pas revenir seul
  retirerMembre: async uid => {
    const m = await getDoc(doc(fs, 'membres', uid));
    const mail = m.exists() ? String(m.data().email || '').toLowerCase() : '';
    await deleteDoc(doc(fs, 'membres', uid));
    if (mail) await deleteDoc(doc(fs, 'invitations', mail)).catch(() => {});
  },
  lien: () => location.origin + location.pathname
};

onAuthStateChanged(auth, u => {
  if (!u) { ecranConnexion(); return; }
  if (!u.emailVerified) { ecranVerification(u); return; }
  entrer(u);
});

/* ---------- Hors ligne : mise en cache de l'appli ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
