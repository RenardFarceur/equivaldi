ACT['clear-ex'] = () => {
  crotSilence = true;
  setTimeout(() => { crotSilence = false; }, 0);
  let n = 0;
  COLS.forEach(k => list(k).filter(o => o.ex).forEach(o => { del(k, o.id); n++; }));
  // ce qui avait été saisi sur les chevaux, prés ou balles d'exemple part avec eux
  ['soins', 'places', 'concours'].forEach(k => list(k).filter(o => !cheval(o.horseId)).forEach(o => del(k, o.id)));
  ['places', 'entretiens'].forEach(k => list(k).filter(o => !get('pres', o.preId)).forEach(o => del(k, o.id)));
  Object.values(stock().by).forEach(x => {
    let manque = -x.n;
    list('foin').filter(m => m.sens === 'out' && m.balle === x.b.id).sort((a, b) => (b.maj || 0) - (a.maj || 0))
      .forEach(m => { if (manque > 0) { manque -= m.nb; del('foin', m.id); } });
  });
  nav.stack = [];
  render();
  toast(`${n} exemples effacés. À toi de jouer !`);
};

/* ---------- Chevaux : liste, rations du jour, fiche ---------- */
function urgentPill(hid) {
  const r = rappels(hid).filter(x => !x.planned)[0];
  if (!r) return '';
  if (r.days < 0) return `<span class="pill danger">${r.type.short} : retard ${nJ(-r.days)}</span>`;
  if (r.days <= cfg().alerte) return `<span class="pill warn">${r.type.short} ${dRel(r.due)}</span>`;
  return '';
}
/* Étiquettes de propriété : propriétaire (sauf la gérante) et demi-pensions en cours */
function proprioPills(h) {
  const pr = propRef(h);
  const prop = pr && !proprioGerante(h) ? `<span class="pill info">${ic('user')}Propriétaire · ${esc(nomCourt(pr).slice(0, 22))}</span>` : '';
  return prop + dpsDe(h).filter(x => dpActive(x)).map(x => `<span class="pill">${ic('card')}Demi-pension · ${esc(nomCourt(x.qui).slice(0, 22))}</span>`).join('');
}
function rowCheval(h) {
  const w = horseWhere(h.id);
  const sub = [ageTxt(h.naissance), h.sexe, h.race].filter(Boolean).join(' · ');
  return `<button type="button" class="row" data-act="open-cheval" data-id="${h.id}">${av(h, 'm')}<div class="row-main">
    <div class="row-t">${esc(h.nom)} ${exTag(h)}${h.archive ? '<span class="pill">Archivé</span>' : ''}</div>
    <div class="row-s trunc">${esc(sub || 'Fiche à compléter')}</div>
    <div class="wrap" style="margin-top:4px"><span class="pill">${ic(w.pre ? 'fence' : 'barn')}${esc(w.txt)}</span>${proprioPills(h)}${urgentPill(h.id)}</div>
  </div><span class="row-end">${ic('next', 'sm')}</span></button>`;
}

function rationsDuJour() {
  const hs = chevaux();
  const meals = REPAS.map(r => ({
    r, items: hs.map(h => ({ h, lines: (h.ration || []).filter(l => (l.repas || []).includes(r.id)) })).filter(x => x.lines.length)
  })).filter(m => m.items.length);
  if (!meals.length) return empty('Aucune ration saisie', "Ouvre la fiche d'un cheval, onglet Ration, pour indiquer ce qu'il mange à chaque repas.");
  const hay = consoRations();
  const head = hay ? `<p class="note">Foin distribué : <b>${num(hay)} kg par jour</b> pour ${hs.length} ${pl(hs.length, 'cheval', 'chevaux')}.</p>` : '';
  return `<div style="display:flex;flex-direction:column;gap:12px">${head}${meals.map(m => `<div class="meal"><div class="meal-h">${m.r.label}<span>${m.items.length} ${pl(m.items.length, 'cheval', 'chevaux')}</span></div>${m.items.map(x =>
    `<button type="button" class="feed" data-act="open-cheval" data-id="${x.h.id}" data-sub="ration">${av(x.h)}<div class="row-main"><div class="row-t">${esc(x.h.nom)}</div><ul>${x.lines.map(l =>
      `<li>${esc(l.aliment)}${l.qte != null ? ` <b>${num(l.qte, 2)} ${esc(l.unite || '')}</b>` : ''}</li>`).join('')}</ul></div></button>`).join('')}</div>`).join('')}</div>`;
}

VIEWS.cheval = p => {
  const h = cheval(p.id);
  if (!h) return { title: 'Cheval', html: empty('Fiche introuvable', 'Ce cheval a été supprimé.') };
  // Entraînement et Concours suivent les rubriques gardées par la gérante (66-rubriques.js)
  const subs = [['fiche', 'Fiche'], ['ration', 'Ration'], ['soins', 'Soins'], ['entrainement', 'Entraînement'], ['concours', 'Concours']]
    .filter(([k]) => (k !== 'entrainement' || rub('seances')) && (k !== 'concours' || rub('concours')));
  const sub = subs.some(([k]) => k === p.sub) ? p.sub : 'fiche';
  let html = segCtl('sub', subs, sub, 'scroll');
  let fab = () => formSoin(null, { hid: h.id }), fabLabel = 'Ajouter un soin';
  if (sub === 'fiche') html += ficheHtml(h);

/* Dépenses de l'année pour ce cheval, et qui les a payées */
function depensesChevalHtml(h) {
  const yr = todayISO().slice(0, 4);
  const es = depenses(yr + '-01-01').filter(e => e.hid === h.id);
  if (!es.length) return '';
  const tot = es.reduce((s, e) => s + e.v, 0);
  const cats = CATS.map(c => ({ c, v: es.filter(e => e.cat === c.id).reduce((s, e) => s + e.v, 0) })).filter(x => x.v > 0);
  const by = new Map();
  es.forEach(e => { const k = pKey(e.qui) || '_'; if (!by.has(k)) by.set(k, { v: 0, cats: {} }); const b = by.get(k); b.v += e.v; b.cats[e.cat] = (b.cats[e.cat] || 0) + e.v; });
  const rows = [...by.entries()].sort((a, b) => (a[0] === '_') - (b[0] === '_') || b[1].v - a[1].v).map(([k, b]) => {
    const p = personne(k), det = CATS.filter(c => b.cats[c.id]).map(c => `${c.label} ${eur(b.cats[c.id])}`).join(' · ');
    return p
      ? `<button type="button" class="row" data-act="open-membre" data-k="${esc(k)}">${pav(p)}<div class="row-main"><div class="row-t">${esc(p.nom)}</div><div class="row-s">${esc(det)}</div></div><span class="row-end num">${eur(b.v)}</span></button>`
      : `<button type="button" class="row sev-warn" data-act="dep-cheval" data-id="${h.id}">${lead('euro')}<div class="row-main"><div class="row-t">Payeur à indiquer</div><div class="row-s">${esc(det)}</div></div><span class="row-end num">${eur(b.v)}</span></button>`;
  }).join('');
  return section(`Dépenses ${yr}`, `<div class="card"><div class="pnums"><span class="big">${eur(tot)}</span><span class="unit">${esc(cats.map(x => `${x.c.label.toLowerCase()} ${eur(x.v)}`).join(' · '))}</span></div></div><div class="list">${rows}</div>`,
    `<button type="button" class="link" data-act="dep-cheval" data-id="${h.id}">Détail ${ic('next', 'sm')}</button>`);
}

function rationHtml(h) {

  if (!lines.length) return emptyH('Pas encore de ration', 'Ajoute chaque aliment avec sa quantité et les repas où il est donné : il apparaîtra dans les rations du jour.') + actions;
  const rows = lines.map(l => {
    const repas = (l.repas || []).map(id => (REPAS.find(r => r.id === id) || {}).label).filter(Boolean).join(', ').toLowerCase();

function soinsHtml(h) {

function concoursCheval(h) {

  const stats = `<div class="stats"><div class="stat"><b>${st.sorties}</b><span>${pl(st.sorties, 'sortie')}</span></div><div class="stat"><b>${st.podiums}</b><span>${pl(st.podiums, 'podium')}</span></div><div class="stat"><b>${st.best ? ordinal(st.best) : '–'}</b><span>meilleure place</span></div></div>`;

function deleteHorse(id) {
  const h = cheval(id);
  if (!h) return;
  ['soins', 'places', 'concours', 'seances'].forEach(k => list(k).filter(o => o.horseId === id).forEach(o => del(k, o.id)));
  list('taches').filter(tk => tk.horseId === id).forEach(tk => put('taches', Object.assign({}, tk, { horseId: null })));
  del('chevaux', id);
  const t = topView();
  if (t && t.view === 'cheval' && t.id === id) nav.stack.pop();

}

    ${grp('Unité', chips('unite', UNITES.map(u => ({ v: u, l: u })), l.unite || 'kg'))}
    ${grp('Repas', chips('repas', REPAS.map(r => ({ v: r.id, l: r.label })), l.repas || [], { multi: true }), 'La quantité est donnée à chaque repas choisi.')}
    ${dlist('dl-alim', Array.from(new Set([...used, ...ALIMENTS])))}`;

function formSoin(id, pre = {}) {
  const ex = id ? get('soins', id) : null;
  if (id && !ex) return;
  const hs = chevaux(), all = chevaux(true);
  if (!all.length) { toast("Ajoute d'abord un cheval."); formCheval(null); return; }
  const s = ex ? clone(ex) : { types: pre.type ? [pre.type] : [], date: todayISO() };
  const selH = ex ? [ex.horseId] : pre.hid ? [pre.hid] : (hs.length === 1 ? [hs[0].id] : []);
  const multi = !ex;
  const auto = d => (d > todayISO() ? 'prevu' : 'fait');
  const statut0 = ex ? (ex.statut === 'prevu' ? 'prevu' : 'fait') : auto(s.date);
  const hOpts = horseOpts(ex ? all.filter(h => !h.archive || h.id === ex.horseId) : hs);
  const body = `
    ${grp(multi ? 'Chevaux' : 'Cheval', chips('h', hOpts, selH, { multi }) + (multi && hs.length > 2 ? '<button type="button" class="link" data-act="all-h" style="align-self:flex-start">Tout le monde</button>' : ''))}
    ${grp('Soin', chips('types', SOINS.map(T => ({ v: T.id, html: `${ic(T.icon, 'sm')}<span>${T.short}</span>` })), s.types, { multi: true }), 'Plusieurs choix possibles : grippe + tétanos en une injection, par exemple.')}
    <div id="w_label"${(s.types || []).includes('autre') ? '' : ' hidden'}>${fld('Précision', inp('f_label', s.label, 'placeholder="ex. coproscopie, radio, échographie" autocomplete="off"'))}</div>
    <div class="grid2">${fld('Date', inp('f_date', s.date, 'type="date" required'))}${grp('Statut', chips('statut', [{ v: 'fait', l: 'Fait' }, { v: 'prevu', l: 'Prévu' }], statut0))}</div>
    ${ex && ex.statut === 'prevu' ? `<button type="button" class="btn" id="b_done">${ic('check', 'sm')}Marquer fait aujourd'hui</button>` : ''}
    <div id="w_gere"${statut0 === 'fait' ? '' : ' hidden'}>${membres().length === 1 ? '' : pickPerson('gere', 'Géré par', s.gerePar || null, { moi: true, hint: 'La personne présente au rendez-vous ou qui a fait le soin.' })}<p class="note crot-note" id="w_gpts"></p></div>
    <div class="grid2">${fld('Praticien', inp('f_prat', s.praticien, 'list="dl-prat" autocomplete="off"'))}${fld('Produit', inp('f_prod', s.produit, 'list="dl-prod" autocomplete="off" placeholder="vaccin, vermifuge…"'))}</div>
    <div class="grid2">${fld('Coût (€)', inp('f_cout', s.cout != null ? String(s.cout).replace('.', ',') : '', numAttr))}${fld('Prochain rappel', inp('f_proch', s.prochain, 'type="date"'), 'Vide : calculé selon les réglages')}</div>
    ${payeField(s.payePar, 'f_cout', Number(s.cout) || 0)}
    ${fld('Notes', area('f_notes', s.notes, 'rows="2"'))}
    ${dlist('dl-prat', historyValues('soins', 'praticien'))}${dlist('dl-prod', historyValues('soins', 'produit'))}`;
  openSheet(ex ? soinLabel(ex) : 'Soin ou rendez-vous', body, {
    onMount: f => {
      let touched = false;
      // « Géré par » et les crottins qu'il rapporte, dès que le soin est fait
      const majGere = () => {
        const fait = (chipVal(f, 'statut') || auto(val('f_date'))) === 'fait', ts = chipVals(f, 'types');
        $('#w_gere').hidden = !fait;
        $('#w_gpts').innerHTML = ts.length && crottinsActifs() ? `${crottinSvg('s')}Rapporte <b>${ptsSoin({ types: ts, planifie: !!(ex && (ex.planifie || ex.statut === 'prevu')) })} crottins</b> à la personne qui l'a géré.` : '';
      };
      f.addEventListener('chipchange', e => {
        if (e.detail.name === 'statut') touched = true;
        if (e.detail.name === 'types') $('#w_label').hidden = !chipVals(f, 'types').includes('autre');
        majGere();
      });
      $('#f_date').addEventListener('change', () => { if (!touched && validISO(val('f_date'))) setChips(f, 'statut', [auto(val('f_date'))]); majGere(); });
      majGere();
      const b = $('#b_done');
      if (b) b.addEventListener('click', () => {
        if (sync.readOnly) { toast(roMsg(), { danger: true }); return; }
        const g = (hasPerson('gere') && readPerson('gere')) || moiRef();
        put('soins', Object.assign({}, ex, { date: todayISO(), statut: 'fait', gerePar: g, faitLe: Date.now(), planifie: true }));
        closeSheet(); toast('Rendez-vous honoré');
      });
    },
    onSubmit: f => {
      const hids = chipVals(f, 'h');
      if (!hids.length) return 'Choisis au moins un cheval.';
      const types = chipVals(f, 'types');
      if (!types.length) return 'Choisis le type de soin.';
      const date = val('f_date');
      if (!validISO(date)) return 'Indique la date.';
      const statut = chipVal(f, 'statut') || auto(date);
      if (statut === 'fait' && date > todayISO()) return 'Un soin fait ne peut pas être daté dans le futur : choisis « Prévu ».';
      const coutRaw = val('f_cout'), cout = parseNum(coutRaw);
      if (coutRaw && cout == null) return 'Le coût doit être un nombre, par exemple 45 ou 45,50.';
      const proch = val('f_proch');
      if (proch && proch <= date) return 'Le prochain rappel doit tomber après la date du soin.';
      // qui a géré le soin (pour les crottins), quand il a été marqué fait, et s'il avait été prévu
      const gerePar = statut === 'fait' ? ((hasPerson('gere') && readPerson('gere')) || moiRef()) : null;
      const faitLe = statut === 'fait' ? (ex && ex.statut === 'fait' ? (ex.faitLe || null) : Date.now()) : null;
      const planifie = statut === 'prevu' || !!(ex && (ex.planifie || ex.statut === 'prevu'));
      const base = { types, label: types.includes('autre') ? val('f_label') : '', date, statut, praticien: val('f_prat'), produit: val('f_prod'), cout, payePar: lirePaye(cout), gerePar, faitLe, planifie, prochain: proch || null, notes: val('f_notes') };
      if (ex) { put('soins', Object.assign({}, ex, base, { horseId: hids[0] })); toast('Soin enregistré'); return; }
      const ids = hids.map(hid => put('soins', Object.assign({ horseId: hid }, base)).id);
      toast(`${statut === 'prevu' ? 'Rendez-vous noté' : 'Soin enregistré'}${ids.length > 1 ? ` pour ${ids.length} chevaux` : ''}`, { undo: () => ids.forEach(i => del('soins', i)) });
    },
    onDelete: ex ? () => { del('soins', ex.id); toast('Soin supprimé'); } : null
  });
}
ACT['edit-soin'] = d => formSoin(d.id);
ACT['all-h'] = () => { const f = $('#sf'); if (f) setChips(f, 'h', chevaux().map(h => h.id)); };

/* ---------- Prés : rotation, repos, entretien ---------- */
function statusPill(s) {
  if (s.sansRotation) return `<span class="pill sable">${s.occupe ? 'Occupée' : 'Libre'}</span>`;
  if (s.occupe) return s.over ? '<span class="pill warn">À changer</span>' : '<span class="pill hay">En pâture</span>';
  if (s.jamais) return '<span class="pill info">Libre</span>';
  return s.pret ? '<span class="pill ok">Prêt</span>' : '<span class="pill">Au repos</span>';
}
function pcard({ p, s }, detail = false) {
  const sub = s.sansRotation ? [typeEspace(p).label, p.surface ? `${num(p.surface, 2)} ha` : ''].filter(Boolean).join(' · ')
    : (p.surface ? `${num(p.surface, 2)} ha` : 'Surface non renseignée') + (s.occupe && p.surface ? ` · ${num(s.horses.length / p.surface, 1)} cheval/ha` : '');
  const inner = `<div class="row-main"><div class="row-t">${esc(p.nom)} ${exTag(p)}</div><div class="row-s">${sub}</div></div>${statusPill(s)}`;
  const head = detail ? `<div class="pcard-h">${inner}</div>` : `<button type="button" class="pcard-h" data-act="open-pre" data-id="${p.id}">${inner}</button>`;
  if (s.sansRotation) {
    // piste, carrière : on suit seulement qui y est, sans repos ni durée de pâture
    if (s.occupe) return `<article class="pcard">${head}
      <div class="pnums"><span class="big">${s.days}</span><span class="unit">${pl(s.days, 'jour')} ${p.type === 'piste' ? 'sur la piste' : 'en carrière'}</span></div>
      <div class="wrap">${s.horses.map(id => hchip(cheval(id))).join('')}</div>
      <button type="button" class="btn small" data-act="move-from" data-id="${p.id}">${ic('move', 'sm')}Déplacer</button></article>`;
    return `<article class="pcard">${head}<p class="note">Pas de temps de repos ni de pâture à suivre ici.</p>
      <button type="button" class="btn small" data-act="move-to" data-id="${p.id}">${ic('plus', 'sm')}Y mettre des chevaux</button></article>`;
  }
  if (s.occupe) {
    const pct = Math.min(100, Math.round(s.days / s.max * 100));
    return `<article class="pcard">${head}
      <div class="pnums"><span class="big">${s.days}</span><span class="unit">${pl(s.days, 'jour')} de pâture · max ${s.max}</span></div>
      <div class="gauge graze${s.over ? ' over' : ''}" role="img" aria-label="${s.days} jours de pâture sur ${s.max}"><i style="width:${pct}%"></i></div>
      <div class="wrap">${s.horses.map(id => hchip(cheval(id))).join('')}</div>
      <button type="button" class="btn small" data-act="move-from" data-id="${p.id}">${ic('move', 'sm')}Déplacer</button></article>`;
  }
  const add = `<button type="button" class="btn small" data-act="move-to" data-id="${p.id}">${ic('plus', 'sm')}Y mettre des chevaux</button>`;
  if (s.jamais) return `<article class="pcard">${head}<p class="note">Pas encore pâturé dans le carnet.</p>${add}</article>`;
  const pct = Math.min(100, Math.round(s.repos / s.cible * 100));
  return `<article class="pcard">${head}
    <div class="pnums"><span class="big">${s.repos}</span><span class="unit">${pl(s.repos, 'jour')} de repos · objectif ${s.cible}</span></div>
    <div class="gauge" role="img" aria-label="${s.repos} jours de repos sur ${s.cible}"><i style="width:${pct}%"></i></div>${add}</article>`;
}
const col = html => `<div style="display:flex;flex-direction:column;gap:12px">${html}</div>`;

VIEWS.pres = () => {
  // la carte du plan (3D ou vue de dessus), ou la liste des prés
  const vue = (ui.presVue || (window.EQ_MODE && premium() ? 'carte' : 'liste')) === 'carte' ? 'carte' : 'liste';
  const seg = segCtl('presVue', [['carte', premium() ? 'Carte' : `${ic('lock', 'sm')}Carte`], ['liste', 'Liste']], vue);
  // la carte est réservée aux écuries abonnées : sinon, aperçu flouté et de quoi s'abonner
  // une écurie sans carte (elle se crée à partir d'un plan) voit l'invitation à la créer
  if (vue === 'carte') return { title: 'Prés', eyebrow: 'Carte des prés', html: seg + (!premium() ? carteVerrouHtml() : prepPlan('ecurie') ? carteHtml() : carteAFaireHtml()), fab: menuPres, fabLabel: 'Ajouter' };
  if (!pres().length) return { title: 'Prés', eyebrow: 'Rotation de pâture', html: seg + emptyH('Aucun pré', 'Ajoute tes parcelles avec le bouton +, ou relie-les depuis la carte. Le carnet comptera les jours de pâture et de repos de chacune.'), fab: () => formPre(null), fabLabel: 'Nouveau pré' };
  return { title: 'Prés', eyebrow: 'Rotation de pâture', html: seg + presListe(), fab: menuPres, fabLabel: 'Ajouter' };
};
/* La liste : prés en rotation (pâture, prêts, repos), puis piste et carrière, puis le box */
function presListe() {
  const ps = paturages().map(p => ({ p, s: preStatus(p) }));
  const esp = pres().filter(sansRotation).map(p => ({ p, s: preStatus(p) }));
  const occ = ps.filter(x => x.s.occupe).sort((a, b) => b.s.days - a.s.days);
  const prets = ps.filter(x => !x.s.occupe && x.s.pret).sort((a, b) => (b.s.repos ?? -1) - (a.s.repos ?? -1));
  const repos = ps.filter(x => !x.s.occupe && !x.s.pret).sort((a, b) => (b.s.repos / b.s.cible) - (a.s.repos / a.s.cible));
  const surf = ps.reduce((a, x) => a + (Number(x.p.surface) || 0), 0);
  let html = `<div class="stats">
    <div class="stat"><b>${occ.length}</b><span>${pl(occ.length, 'pré occupé', 'prés occupés')}</span></div>
    <div class="stat"><b>${prets.length}</b><span>${pl(prets.length, 'prêt', 'prêts')} à pâturer</span></div>
    <div class="stat"><b>${num(surf, 1)}</b><span>ha au total</span></div></div>`;
  if (occ.length) html += section('En pâture', col(occ.map(x => pcard(x)).join('')));
  if (prets.length) html += section('Prêts à pâturer', col(prets.map(x => pcard(x)).join('')));
  if (repos.length) html += section('Au repos', col(repos.map(x => pcard(x)).join('')));
  if (esp.length) {
    const types = new Set(esp.map(x => x.p.type));
    html += section(types.size > 1 ? 'Piste et carrière' : typeEspace(esp[0].p).label, col(esp.map(x => pcard(x)).join('')));
  }
  const box = chevaux().filter(h => !openPlace(h.id));
  if (box.length) html += section('Au box', `<div class="list"><div class="row">${lead('barn')}<div class="row-main"><div class="wrap">${box.map(hchip).join('')}</div></div><button type="button" class="btn small" data-act="new" data-what="move">Placer</button></div></div>`);
  const arch = list('pres').filter(p => p.archive).sort(byName);
  if (arch.length) html += `<div class="sec"><button type="button" class="link" data-act="toggle-arch-pres" style="align-self:flex-start">${ui.showArchPres ? 'Masquer' : 'Afficher'} les prés archivés (${arch.length})</button>${ui.showArchPres ? `<div class="list">${arch.map(p => `<button type="button" class="row" data-act="open-pre" data-id="${p.id}">${lead('fence')}<div class="row-main"><div class="row-t">${esc(p.nom)}</div></div></button>`).join('')}</div>` : ''}</div>`;
  return html;
}
ACT['toggle-arch-pres'] = () => { ui.showArchPres = !ui.showArchPres; saveUi(); render(); };

  return { title: pre.nom, eyebrow, html, fab: () => formEntretien(null, { pid: pre.id }), fabLabel: 'Ajouter un entretien' };

function formMove(pre = {}) {
  const hs = chevaux(), ps = pres();
  if (!hs.length) { toast("Ajoute d'abord un cheval."); formCheval(null); return; }
  if (!ps.length) { toast("Ajoute d'abord un pré."); formPre(null); return; }
  let dest = pre.to || null, sel = [];
  if (pre.from) {
    sel = list('places').filter(x => x.preId === pre.from && !x.fin).map(x => x.horseId);
    const nx = prePret(pre.from);
    if (!dest && nx) dest = nx.p.id;
  }
  if (pre.hid) sel = [pre.hid];
  const destOpts = ps.filter(p => p.id !== pre.from).map(p => {
    const s = preStatus(p);
    const sub = s.sansRotation ? `${typeEspace(p).label.toLowerCase()} · ${s.occupe ? 'occupée' : 'libre'}`
      : s.occupe ? `occupé · ${nJ(s.days)}` : s.jamais ? 'libre' : `repos ${nJ(s.repos)}${s.pret ? ' · prêt' : ''}`;
    return { v: p.id, html: `<span class="two"><span>${esc(p.nom)}</span><small>${esc(sub)}</small></span>` };
  });
  destOpts.push({ v: '__box', html: `${ic('barn', 'sm')}<span>Box / écurie</span>` });
  const from = pre.from ? get('pres', pre.from) : null;
  const body = `
    ${from ? `<p class="note">Depuis <b>${esc(from.nom)}</b></p>` : ''}
    ${grp('Vers', chips('dest', destOpts, dest ? [dest] : []))}
    ${grp('Chevaux', chips('h', horseOpts(hs, h => horseWhere(h.id).txt), sel, { multi: true }) + (hs.length > 2 ? '<button type="button" class="link" data-act="all-h" style="align-self:flex-start">Tout le monde</button>' : ''))}
    ${fld('Date', inp('f_date', todayISO(), 'type="date" required'), 'Change la date si le déplacement a eu lieu avant.')}`;
  openSheet('Déplacer des chevaux', body, {
    submit: 'Déplacer',
    onSubmit: f => {

function tacheSub(tk, e) {

  let st;
  if (e.done) st = faitTxt(e.last) + (e.n > 1 && e.next ? ` · à refaire ${dRel(e.next)}` : '');
  else if (tk.freq === 'une') st = e.due ? (e.days < 0 ? `En retard de ${nJ(-e.days)}` : `À faire ${dRel(e.due)}`) : 'À faire';
  else if (e.last) st = (e.retard > 0 ? `En retard de ${nJ(e.retard)} · ` : '') + `Dernière fois ${dRel(e.last.d)}${nomsFait(e.last) ? ', ' + nomsFait(e.last) : ''}`;
  else st = freqLabel(tk);
  return [where, st].filter(Boolean).join(' · ');
}

function tachesTriees(filter) {

  // juste après une coche, la liste garde son ordre le temps de l'animation, puis la ligne glisse à sa place
  if (fx.ordre && Date.now() < fx.jusqua) {
    const pos = new Map(fx.ordre.map((id, i) => [id, i]));
    return xs.sort((a, b) => (pos.has(a.tk.id) ? pos.get(a.tk.id) : 999) - (pos.has(b.tk.id) ? pos.get(b.tk.id) : 999));

const toutFait = () => { const xs = tachesTriees(); return xs.length > 0 && xs.every(x => x.e.done); };

const aN = n => ({ 2: 'deux', 3: 'trois', 4: 'quatre', 5: 'cinq', 6: 'six' })[n] || String(n);
/* Cocher : par défaut au nom de la personne du téléphone ; « qui » quand la tâche a été faite à plusieurs
   (la première personne est enregistrée dans par/uid, les autres dans avec) */
function cocher(id, qui = null) {
  const go = refs => {
    const cur = get('taches', id);
    if (!cur || !refs.length) return;
    const prev = clone(cur), avant = toutFait();
    const f = { d: todayISO(), t: Date.now(), par: refs[0].nom, uid: refs[0].uid || null, pts: ptsTache(cur) };
    if (refs.length > 1) f.avec = refs.slice(1).map(r => ({ uid: r.uid || null, nom: r.nom }));
    figeOrdre();
    put('taches', Object.assign({}, cur, garderFaits(cur, [f, ...faitsDe(cur)])));
    render();

    $$(`.tick[data-id="${CSS.escape(cur.id)}"]`).forEach(el => { fxOnce(el, 'fx-coche', 700); confettis(el); });
    vibre(12);
    if (!avant && toutFait()) {

      setTimeout(galop, ui.crotAnim === 'discret' || !mouvementOk() ? 350 : 2900);
      toast("Tout est fait pour aujourd'hui, bravo !", { fete: true, undo: () => put('taches', prev) });
    } else toast(refs.length > 1 ? `${cur.titre} : fait à ${aN(refs.length)}` : `${cur.titre} : fait`, { undo: () => put('taches', prev) });

document.addEventListener('pointerdown', ev => {

  if (!b || ev.button > 0 || sync.readOnly) return;

/* « Qui l'a faite ? » : avant de cocher (appui long) ou après coup (bouton à droite de la tâche faite) */
function formQui(id) {
  const tk = get('taches', id);
  if (!tk) return;
  if (sync.readOnly) { toast(roMsg(), { danger: true }); return; }
  const e = tacheEtat(tk), f0 = e.done ? e.last : null;
  const moi = { uid: me.uid || null, nom: moiNom() };
  const qui0 = f0 ? faitPar(f0) : (pKey(moi) ? [moi] : []);
  const pot = f0 && Number.isFinite(f0.pts) ? f0.pts : ptsTache(tk);
  // les personnes proposées : l'équipe (ou les prénoms déjà connus), plus celles déjà notées sur la coche
  const opts = [], vus = new Set();
  const ajoute = r => { const k = pKey(r); if (k && !vus.has(k)) { vus.add(k); opts.push({ k, r }); } };
  const ms = membres();
  if (ms.length) ms.forEach(m => ajoute({ uid: m.id, nom: mNom(m) })); else nomsConnus().forEach(n => ajoute({ uid: null, nom: n }));
  qui0.forEach(ajoute);
  const body = `<div class="bq-confirm"><span class="qa-ic menthe">${ic('avec')}</span><p><b>${esc(tk.titre)}</b><br><small>${esc(f0 ? faitTxt(f0) : freqLabel(tk))}</small></p></div>
    ${grp('Qui l’a faite ?', chips('qui', opts.map(o => ({ v: o.k, html: `${pav(o.r, 's')}<span>${esc(nomCourt(o.r))}</span>` })), qui0.map(r => pKey(r)), { multi: true })
      + `<div class="qui-autre">${inp('f_qui_autre', '', 'autocomplete="off" autocapitalize="words" placeholder="Quelqu’un d’autre ? Son prénom" aria-label="Ajouter une autre personne"')}</div>`)}
    <p class="note crot-note" id="w_part"></p>
    ${f0 ? '<p class="note">Astuce : un appui long sur la case permet de choisir qui l’a faite avant de cocher.</p>' : ''}`;
  const lire = f => {
    const ks = new Set(chipVals(f, 'qui')), refs = [];
    const prend = r => { const k = pKey(r); if (k && ks.has(k) && !refs.some(x => pKey(x) === k)) refs.push(r); };
    qui0.forEach(prend);              // ceux déjà notés gardent leur place (la personne qui a coché en tête)
    opts.forEach(o => prend(o.r));
    const autre = val('f_qui_autre').replace(/\s+/g, ' ').trim();
    if (autre) {
      const m = refMembre({ nom: autre }), r = m ? { uid: m.id, nom: mNom(m) } : { uid: null, nom: autre };
      if (!refs.some(x => pKey(x) === pKey(r))) refs.push(r);
    }
    return refs;
  };
  openSheet(f0 ? 'Qui l’a faite ?' : 'Cocher à plusieurs', body, {
    submit: f0 ? 'Enregistrer' : 'C’est fait', local: true,
    onMount: f => {
      const maj = () => {
        const n = lire(f).length;
        $('#w_part').innerHTML = !n ? 'Choisis au moins une personne.'
          : !crottinsActifs() ? ''
          : n === 1 ? `${crottinSvg('s')}<b>${pot} ${pl(pot, 'crottin')}</b> pour cette personne.`
          : `${crottinSvg('s')}Les ${pot} crottins se partagent : <b>${partTache(pot, n)} chacun</b>.`;
      };
      f.addEventListener('chipchange', maj);
      $('#f_qui_autre').addEventListener('input', maj);
      maj();
    },
    onSubmit: f => {
      const refs = lire(f);
      if (!refs.length) return 'Choisis au moins une personne.';
      if (!f0) { setTimeout(() => cocher(id, refs), 0); return; }
      if (refs.map(r => pKey(r)).join('|') === qui0.map(r => pKey(r)).join('|')) return;
      const cur = get('taches', id), fs = cur ? faitsDe(cur) : [];
      const i = fs.findIndex(x => x.d === f0.d && (x.t || 0) === (f0.t || 0));
      if (i < 0) return 'Cette coche a changé entre-temps : rouvre la tâche.';
      const nf = Object.assign({}, fs[i], { par: refs[0].nom, uid: refs[0].uid || null });
      if (refs.length > 1) nf.avec = refs.slice(1).map(r => ({ uid: r.uid || null, nom: r.nom })); else delete nf.avec;
      const prev = clone(cur), nfs = fs.slice();
      nfs[i] = nf;
      // déjà compté pour moi : on ajuste en douceur ; si je me rajoute, c'est un vrai gain
      const dedans = rs => rs.some(r => estMoi(r));
      crotDoux = dedans(qui0);
      put('taches', Object.assign({}, cur, { fait: nfs }));
      toast(refs.length > 1 ? `${cur.titre} : fait à ${aN(refs.length)}, ${partTache(pot, refs.length)} crottins chacun` : `${cur.titre} : fait par ${nomCourt(refs[0])}`,
        { undo: () => { crotDoux = dedans(refs); put('taches', prev); } });
    }
  });
}

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) { sheetErr('Indique une adresse e-mail valide.'); return; }
  const role = chipVal(document, 'invrole') || 'equipe', e = ecurieOuverte() || {};
  if (el) el.disabled = true;
  try {
    await EQ.inviter(mail, role);
    demInvite();
    equipeSheet(`${mail} est invité. En se connectant avec cette adresse, la personne trouvera l'invitation.`, `Rejoins l'écurie ${e.nom || ''} sur EquiValdi : ${EQ.lien()} (crée ton compte avec ${mail}).`);
  } catch (err) {
    if (el && el.isConnected) el.disabled = false;
    sheetErr(eqMsg(err, "L'invitation n'a pas pu être enregistrée : vérifie ta connexion."));
  }
};
// Partage du téléphone, sinon copie
async function partager(txt) {
  if (navigator.share) {
    try { await navigator.share({ text: txt }); return 'partage'; }
    catch (e) { if (e && e.name === 'AbortError') return 'annule'; }
  }
  try { await navigator.clipboard.writeText(txt); return 'copie'; } catch (e) { return null; }
}
ACT['eq-lien'] = async (d, el) => {
  const role = chipVal(document, 'invrole') || 'equipe';
  if (el) el.disabled = true;
  let r;
  try { r = await EQ.inviterLien(role); }
  catch (e) { if (el && el.isConnected) el.disabled = false; sheetErr(eqMsg(e, "Le lien n'a pas pu être créé : vérifie ta connexion.")); return; }
  demInvite();
  const ec = ecurieOuverte() || {}, txt = `Rejoins l'écurie ${ec.nom || ''} sur EquiValdi : ${r.url}`;
  openSheet('Invitation prête', `<div class="inv-code"><span class="flabel">Code d'invitation</span><b id="invCode">${esc(EQ.code(r.code))}</b><span class="small muted">${esc(ROLE_LABEL[role] || '')} · valable 7 jours, une seule fois</span></div>
    <div class="btnrow"><button type="button" class="btn primary" data-act="eq-partager" data-txt="${esc(txt)}">${ic('partage', 'sm')}Partager le lien</button><button type="button" class="btn" data-act="eq-copier" data-txt="${esc(txt)}">${ic('copy', 'sm')}Copier</button></div>
    <p class="note">La personne ouvre le lien, crée son compte et rejoint ${esc(ec.nom || "l'écurie")}. Si elle a déjà installé l'appli sur iPhone, elle tape ce code dans « J'ai un code d'invitation ».</p>
    <button type="button" class="link" data-act="equipe" style="align-self:flex-start">${ic('users', 'sm')}Retour à l'équipe</button>`);
  partager(txt).then(res => { if (res === 'copie') toast('Lien copié : colle-le dans un message.'); });
};
ACT['eq-partager'] = d => partager(d.txt).then(res => { if (res === 'copie') toast('Lien copié : colle-le dans un message.'); else if (!res) toast(d.txt); });
ACT['eq-copier'] = d => {
  try { navigator.clipboard.writeText(d.txt).then(() => toast('Copié : colle-le dans un message.'), () => toast(d.txt)); } catch (e) { toast(d.txt); }
};

/* ---------- Réglages › Crottins : interrupteur et boutique de l'écurie (gérante) ---------- */
function crotSection() {
  if (window.EQ_MODE && !premium()) return section('Crottins', `<div class="verrou-ligne">${verrouHtml('crottins')}</div>`);
  const actifs = crottinsActifs(), g = estGerante();
  let h = '';
  if (g) h += `<div class="list"><button type="button" class="row sw-row" role="switch" aria-checked="${actifs}" data-act="crot-onoff">
      <div class="row-main"><div class="row-t">Points crottins dans cette écurie</div><div class="row-s">${actifs ? 'Compteur, boutique, animations et classement' : 'Coupés : ni compteur, ni boutique, ni classement'}</div></div>
      <span class="sw-t" aria-hidden="true"><i></i></span></button></div>`;
  if (actifs) h += `${segCtl('crotAnim', [['grand', 'Grande animation'], ['discret', 'Discrète']], ui.crotAnim === 'discret' ? 'discret' : 'grand')}
    <p class="note">Ce que montre l'appli quand tu gagnes des crottins, sur ce téléphone.</p>

ACT['crot-onoff'] = () => {
  if (!estGerante()) return;
  const on = !crottinsActifs();

  regle(on);
  toast(on ? 'Points crottins activés' : 'Points crottins coupés dans cette écurie', { undo: () => regle(!on) });
};

const BQ_COULEURS = { paille: 'Paille', ciel: 'Ciel', menthe: 'Menthe', prairie: 'Prairie' };

ACT['bq-edit'] = () => {
  if (!estGerante()) return;

  openSheet('Récompenses', `<p class="note">${e.nom ? `<b>${esc(e.nom)}</b> : ` : ''}ce que l'équipe s'offre avec ses crottins. Les bons déjà pris gardent leur nom et leur prix.</p>
    <div class="bq-tete small muted"><span>Récompense</span><span>Prix</span></div>
    <div class="bq-eds" id="bqEds">${boutique().map(bqLigne).join('')}</div>
    <div class="btnrow"><button type="button" class="link" data-act="bq-add">${ic('plus', 'sm')}Ajouter une récompense</button>
      <button type="button" class="link" data-act="bq-reset" data-confirm="Confirmer : liste de départ">Remettre la liste de départ</button></div>`, {
    submit: 'Enregistrer la boutique', local: true,
    onMount: f => f.addEventListener('chipchange', ev => {
      const row = ev.target.closest('[data-bq]');
      if (!row || !/^bq[it]-/.test(ev.detail.name)) return;
      const look = $('.bq-look', row), icv = chipVal(row, 'bqi-' + row.dataset.bq) || 'particulier', tv = chipVal(row, 'bqt-' + row.dataset.bq) || 'paille';

        id: r.dataset.bq, nom: $('.bq-nom', r).value.replace(/\s+/g, ' ').trim().slice(0, 40), prix: parseNum($('.bq-prix', r).value),
        ic: chipVal(r, 'bqi-' + r.dataset.bq) || 'particulier', tint: chipVal(r, 'bqt-' + r.dataset.bq) || 'paille'
      }));

      if (items.some(i => !(Number.isInteger(i.prix) && i.prix >= 1 && i.prix <= 100000))) return 'Les prix sont des nombres entiers de crottins, de 1 à 100 000.';

ACT['bq-look'] = (d, el) => {

  el.setAttribute('aria-expanded', String(!p.hidden));

ACT['bq-add'] = () => {

  box.insertAdjacentHTML('beforeend', bqLigne({ id: uid(), nom: '', prix: '', ic: 'particulier', tint: 'menthe' }));

ACT['bq-del'] = (d, el) => { const row = el.closest('[data-bq]'); if (row) row.remove(); };
ACT['bq-reset'] = () => {
  if (!estGerante()) return;
  const c = Object.assign({}, S.cfg || {});
  delete c.boutique;
  putCfg(c);

/* ---------- Équipe : qui fait quoi, dépenses, fiches personnelles, contacts utiles ---------- */
const eurRond = v => num(Math.round(Number(v) || 0), 0) + ' €';
const perSeg = () => segCtl('eqPer', [['mois', 'Ce mois'], ['annee', 'Cette année'], ['tout', 'Tout']], periode(ui.eqPer).id);
const debutT = P => P.from ? new Date(P.from + 'T00:00:00').getTime() : 0;
const estGerante = () => !!(window.EQ_MODE && window.EQ && EQ.role === 'gerante');

function chevauxDe(k) {
  const own = chevaux(true).filter(h => pKey(propRef(h)) === k);
  const dps = [];
  chevaux(true).forEach(h => dpsDe(h).forEach(x => { if (pKey(x.qui) === k) dps.push({ h, x }); }));
  return { own, dps };
}
function resumeBilan(a) {
  const parts = [];
  if (a && a.taches) parts.push(`${a.taches} ${pl(a.taches, 'tâche')}`);
  if (a && a.seances) parts.push(`${a.seances} ${pl(a.seances, 'séance')}`);
  if (a && a.dep) parts.push(eur(a.dep));
  return parts.join(' · ') || 'Rien sur la période';
}
function rowPersonne(p, a) {
  const { own, dps } = chevauxDe(p.k);
  const enCours = dps.filter(d => dpActive(d.x));
  const chev = [own.length ? `Propriétaire : ${own.map(h => h.nom).join(', ')}` : '', enCours.length ? `Demi-pension : ${enCours.map(d => d.h.nom).join(', ')}` : ''].filter(Boolean).join(' · ');
  const role = p.m && p.m.role !== 'equipe' ? `<span class="pill${p.m.role === 'gerante' ? ' ok' : ''}">${esc(ROLE_LABEL[p.m.role] || '')}</span>` : '';
  const moi = estMoi(p.k) ? '<span class="pill ok">Toi</span>' : '';
  return `<button type="button" class="row" data-act="open-membre" data-k="${esc(p.k)}">${pav(p, 'm')}<div class="row-main">
    <div class="row-t">${esc(p.nom)} ${moi}${role}</div><div class="row-s">${esc(resumeBilan(a))}</div>${chev ? `<div class="row-s">${esc(chev)}</div>` : ''}
  </div><span class="row-end">${ic('next', 'sm')}</span></button>`;
}
function rowDep(e, sansPayeur = false) {
  const qui = pKey(e.qui) ? nomCourt(e.qui) : 'Payeur à indiquer';
  const sub = [dShort(e.d), e.hid ? hNom(e.hid) : '', sansPayeur ? '' : qui].filter(Boolean).join(' · ');
  return `<button type="button" class="row" data-act="${ACT_DEP[e.coll]}" data-id="${esc(e.id)}">${lead(catDe(e.cat).icon)}<div class="row-main"><div class="row-t">${esc(e.label)}</div><div class="row-s">${esc(sub)}</div></div><span class="row-end num">${eur(e.v)}</span></button>`;
}
/* Fil de l'équipe : la personne, puis ce qu'elle a fait ; dans une fiche, l'objet puis l'action */
function rowFil(it, dansFiche = false) {
  const inner = dansFiche
    ? `${lead(it.icon)}<div class="row-main"><div class="row-t">${esc(it.objet)}</div><div class="row-s">${esc(it.quoi)} · ${esc(quandTxt(it.t))}</div></div>`
    : `${pav(it.r)}<div class="row-main"><div class="row-t">${esc(nomDe(it.r) || "Quelqu'un")}</div><div class="row-s">${esc(it.quoi)} : ${esc(it.objet)} · ${esc(quandTxt(it.t))}</div></div>`;
  return it.act ? `<button type="button" class="row" ${it.act}>${inner}</button>` : `<div class="row">${inner}</div>`;
}

VIEWS.equipe = () => {
  const P = periode(ui.eqPer), B = bilan(P.from), ms = membres();
  let html = perSeg();
  html += `<div class="stats${rub('seances') ? '' : ' deux'}">
    <div class="stat"><b>${B.taches}</b><span>${pl(B.taches, 'tâche cochée', 'tâches cochées')}</span></div>
    ${rub('seances') ? `<div class="stat"><b>${B.seances}</b><span>${pl(B.seances, 'séance', 'séances')} de travail</span></div>` : ''}
    <div class="stat"><b>${eurRond(B.total)}</b><span>de dépenses</span></div></div>`;
  if (crottinsActifs()) html += section(`Crottins ${P.label}`, classementCrottins(P), `<button type="button" class="link" data-act="boutique">Boutique ${ic('next', 'sm')}</button>`);
  // les membres, puis les personnes hors équipe qui apparaissent dans le carnet (demi-pension, cavalier, payeur…)
  const keys = new Set(ms.map(m => 'u:' + m.id)), autres = new Set();
  const voir = k => { if (k && k !== '_' && !keys.has(k)) autres.add(k); };
  B.by.forEach((a, k) => voir(k));
  chevaux(true).forEach(h => { voir(pKey(propRef(h))); dpsDe(h).forEach(x => voir(pKey(x.qui))); });
  if (!ms.length) voir(kMoi());
  const na = B.by.get('_');
  const naRow = na && na.dep > 0 ? `<button type="button" class="row sev-warn" data-act="dep-na">${lead('euro')}<div class="row-main"><div class="row-t">${eur(na.dep)} sans payeur</div><div class="row-s">${na.items.length} ${pl(na.items.length, 'dépense')} ${P.label} : touche pour indiquer qui a payé</div></div><span class="row-end">${ic('next', 'sm')}</span></button>` : '';
  const ext = [...autres].map(personne).filter(Boolean).sort(byName).map(p => rowPersonne(p, B.by.get(p.k)));
  if (ms.length) {
    html += section(`L'équipe <span class="count">${ms.length}</span>`, `<div class="list">${ms.map(m => rowPersonne(personne('u:' + m.id), B.by.get('u:' + m.id))).join('')}${naRow}</div>`);
    if (ext.length) html += section('Hors équipe', `<div class="list">${ext.join('')}</div>`);
  } else {
    html += section('Les personnes', ext.length || naRow ? `<div class="list">${ext.join('')}${naRow}</div>`
      : emptyH('Personne pour l\'instant', "Les prénoms apparaissent dès qu'une tâche est cochée, qu'une séance est notée ou qu'un propriétaire est indiqué."));
  }
  const fil = filEquipe(debutT(P), 25);
  html += section("Ce qui s'est passé", fil.length ? `<div class="list">${fil.map(it => rowFil(it)).join('')}</div>`
    : '<p class="note">Les tâches cochées, les soins, les séances, le foin et les déplacements notés par chacun apparaîtront ici.</p>');
  const cs = contacts();
  html += section('Contacts utiles', cs.length ? `<div class="list">${cs.map(rowContact).join('')}</div>`
    : '<p class="note">Vétérinaire, maréchal, dentiste, coach… Garde leurs numéros ici pour les appeler en un geste.</p>',
    sync.readOnly ? '' : `<button type="button" class="link" data-act="new-contact">${ic('plus', 'sm')}Ajouter</button>`);
  if (estGerante()) html += `<button type="button" class="btn" data-act="equipe">${ic('users', 'sm')}Inviter, gérer les accès</button>`;
  return { title: 'Équipe', eyebrow: ms.length ? `${ms.length} ${pl(ms.length, 'personne')}` : 'Qui fait quoi', html, fab: menuEquipe, fabLabel: 'Ajouter' };
};

VIEWS.membre = p => {
  const P = periode(ui.eqPer), B = bilan(P.from), pe = personne(p.k);
  if (!pe) return { title: 'Équipe', html: empty('Fiche introuvable', "Cette personne ne fait plus partie de l'équipe.") };
  const m = pe.m, a = B.by.get(pe.k), moi = estMoi(pe.k);
  const modif = !!(m && (m.id === me.uid || estGerante()));
  const dispo = m && Array.isArray(m.dispo) && m.dispo.length ? joursTxt(m.dispo) : '';
  const btns = [m && m.tel ? `<a class="btn small" href="${esc(telHref(m.tel))}">${ic('phone', 'sm')}${esc(m.tel)}</a>` : '',
    modif ? `<button type="button" class="btn small" data-act="edit-profil" data-uid="${esc(m.id)}">${ic('edit', 'sm')}${moi ? 'Modifier ma fiche' : 'Modifier'}</button>` : ''].join('');
  let html = `<div class="card phead">${pav(pe, 'xl')}<div class="row-main">
    <div class="row-t">${esc(pe.nom)}${moi ? ' <span class="pill ok">Toi</span>' : ''}</div>
    <div class="row-s">${esc(m ? (ROLE_LABEL[m.role] || '') : 'Hors équipe')}</div>
    ${m && m.email ? `<div class="row-s trunc">${esc(m.email)}</div>` : ''}
    ${dispo ? `<div class="row-s">Jours de présence : ${esc(dispo)}</div>` : ''}
    ${!crottinsActifs() ? '' : `<div class="wrap crot-ligne">${crottinSvg('s')}<b>${num(soldeDe(pe.k), 0)}</b><span class="small muted">${pl(soldeDe(pe.k), 'crottin')} · ${esc(rangDe(crottinsDe(pe.k).gagnes).r.nom)}</span></div>`}
    ${btns ? `<div class="btnrow">${btns}</div>` : ''}</div></div>`;
  html += perSeg();
  html += `<div class="stats${rub('seances') ? '' : ' deux'}">
    <div class="stat"><b>${a ? a.taches : 0}</b><span>${pl(a ? a.taches : 0, 'tâche cochée', 'tâches cochées')}</span></div>
    ${rub('seances') ? `<div class="stat"><b>${a ? a.seances : 0}</b><span>${pl(a ? a.seances : 0, 'séance')}${a && a.minutes ? ' · ' + durTxt(a.minutes) : ''}</span></div>` : ''}
    <div class="stat"><b>${eurRond(a ? a.dep : 0)}</b><span>de dépenses</span></div></div>`;
  const { own, dps } = chevauxDe(pe.k);
  const rowH = (h, sub) => `<button type="button" class="row" data-act="open-cheval" data-id="${h.id}">${av(h)}<div class="row-main"><div class="row-t">${esc(h.nom)}</div><div class="row-s">${esc(sub)}</div></div><span class="row-end">${ic('next', 'sm')}</span></button>`;
  if (own.length || dps.length) html += section('Chevaux', `<div class="list">${[
    ...own.map(h => rowH(h, 'Propriétaire')),
    ...dps.map(({ h, x }) => rowH(h, ['Demi-pension', joursTxt(x.jours), Number(x.part) > 0 ? eur(x.part) + ' / mois' : '', dpActive(x) ? '' : (validISO(x.fin) && x.fin < todayISO() ? 'terminée' : 'à venir')].filter(Boolean).join(' · ')))
  ].join('')}</div>`);
  if (a && a.items.length) {
    const cats = CATS.filter(c => a.cats[c.id]).map(c => `<span class="pill">${ic(c.icon)}${c.label} ${eur(a.cats[c.id])}</span>`).join('');
    html += section(`Dépenses ${P.label}`, `<div class="wrap">${cats}</div><div class="list">${a.items.slice(0, 40).map(e => rowDep(e, true)).join('')}</div>`);
  }
  const resp = tachesTriees(tk => pKey(tk.resp) === pe.k);
  if (resp.length) html += section(moi ? 'Mes tâches' : 'Ses tâches', tachesListe(resp));
  const fil = filEquipe(debutT(P), 20, pe.k);
  if (fil.length) html += section(`Activité ${P.label}`, `<div class="list">${fil.map(it => rowFil(it, true)).join('')}</div>`);
  const ss = list('seances').filter(s => s.statut !== 'prevu' && validISO(s.date) && (!P.from || s.date >= P.from) && pKey({ uid: s.cavalierUid, nom: s.cavalier }) === pe.k)
    .sort((x, y) => y.date.localeCompare(x.date));
  if (ss.length) html += section(`Séances ${P.label}`, `<div class="list">${ss.slice(0, 10).map(s => seanceRow(s, true)).join('')}</div>`);
  if (m && (m.materiel || m.notes)) html += section('Matériel et infos', `<div class="card">${m.materiel ? `<div><div class="eyebrow">Matériel</div><div style="white-space:pre-wrap">${esc(m.materiel)}</div></div>` : ''}${m.notes ? `<div><div class="eyebrow">Notes</div><div style="white-space:pre-wrap">${esc(m.notes)}</div></div>` : ''}</div>`);
  else if (modif && moi) html += '<p class="note">Ajoute ton téléphone, tes jours de présence et ton matériel avec « Modifier ma fiche » : toute l\'équipe les verra.</p>';
  return { title: pe.nom, eyebrow: moi ? 'Ma fiche' : (m ? 'Équipe' : 'Hors équipe'), html, fab: null };
};

/* Fiche personnelle : chacun tient la sienne, la gérante peut toutes les corriger */
function formProfil(uidM) {
  const m = get('membres', uidM);
  if (!m || !m.role) { toast("La fiche n'est pas encore chargée : réessaie dans un instant."); return; }
  const moi = uidM === me.uid;
  const coul = Number.isInteger(m.couleur) ? m.couleur : hashCol(normNom(mNom(m)));
  const body = `
    ${fld('Prénom', inp('f_pnom', mNom(m), 'required autocomplete="given-name" autocapitalize="words"'))}
    ${fld('Téléphone', inp('f_tel', m.tel || '', 'type="tel" inputmode="tel" autocomplete="tel" placeholder="06 12 34 56 78"'), "Visible par toute l'équipe, pour s'appeler en un geste.")}
    ${grp('Jours de présence', chips('dispo', JOURS.map(j => ({ v: String(j.id), l: j.l })), (Array.isArray(m.dispo) ? m.dispo : []).map(String), { multi: true }), "Les jours où tu passes à l'écurie : ils s'affichent sur l'accueil le jour venu.")}
    ${fld('Matériel personnel', area('f_mat', m.materiel || '', 'rows="3" placeholder="Selle, filet, tapis, couvertures, bombe…"'))}
    ${fld('Notes', area('f_pnotes', m.notes || '', 'rows="2" placeholder="Personne à prévenir, préférences, véhicule…"'))}
    ${grp('Pastille', chips('pcoul', Array.from({ length: NB_COULEURS }, (_, i) => ({ v: String(i), html: `<span class="sw hc${i}"></span>`, cls: 'col', aria: `Couleur ${i + 1}` })), String(coul)))}`;
  openSheet(moi ? 'Ma fiche' : `Fiche de ${mNom(m)}`, body, {
    local: moi,   // chacun peut tenir sa fiche à jour, même en lecture seule
    onSubmit: f => {
      const nom = val('f_pnom').replace(/\s+/g, ' ');
      if (!nom) return 'Indique le prénom.';
      if (nom.length > 40) return 'Un prénom court suffit.';
      const tel = val('f_tel');
      if (tel && tel.replace(/[^\d]/g, '').length < 6) return 'Ce numéro de téléphone semble incomplet.';
      const cur = get('membres', uidM);
      if (!cur || !cur.role) return "La fiche n'est pas encore chargée : réessaie dans un instant.";
      put('membres', Object.assign({}, cur, {
        nom, tel, dispo: chipVals(f, 'dispo').map(Number), materiel: val('f_mat'), notes: val('f_pnotes'),
        couleur: parseInt(chipVal(f, 'pcoul') || String(coul), 10)
      }));
      if (moi) setMoi(nom);
      toast('Fiche enregistrée');
    }
  });
}
ACT['edit-profil'] = d => formProfil(d.uid);
ACT['edit-profil-moi'] = () => formProfil(me.uid);

/* Contacts utiles : gardés dans les réglages communs du carnet */
const METIER_IC = { 'Vétérinaire': 'stetho', 'Maréchal': 'shoe', 'Dentiste': 'tooth', 'Ostéopathe': 'hands', 'Coach': 'timer', 'Fourrage': 'bale', 'Sellerie': 'tool', 'Transport': 'move' };
function contacts() {
  const cs = (S.cfg && Array.isArray(S.cfg.contacts) ? S.cfg.contacts : []).filter(c => c && c.id && c.nom);
  const ord = c => { const i = METIERS.indexOf(c.metier); return i < 0 ? 99 : i; };
  return cs.slice().sort((a, b) => ord(a) - ord(b) || byName(a, b));
}
const rowContact = c => crow(`data-act="edit-contact" data-id="${esc(c.id)}"`,
  `${lead(METIER_IC[c.metier] || 'user')}<span class="row-main"><span class="row-t">${esc(c.nom)}</span><span class="row-s">${esc([c.metier, c.tel].filter(Boolean).join(' · ') || 'Touche pour compléter')}</span>${c.notes ? `<span class="row-s clamp2">${esc(c.notes)}</span>` : ''}</span>`, c.tel, c.nom);
function formContact(id) {
  const ex = id ? contacts().find(c => c.id === id) : null;
  if (id && !ex) return;
  const c = ex ? clone(ex) : { id: 'c' + uid(), nom: '', metier: null, tel: '', notes: '' };
  const noms = Array.from(new Set([...historyValues('soins', 'praticien'), ...historyValues('seances', 'coach')]));
  const body = `
    ${fld('Nom', inp('f_cnom', c.nom, 'required autocomplete="off" autocapitalize="words" list="dl-cnom" placeholder="ex. Dr Martin, clinique vétérinaire"'))}
    ${grp('Métier', chips('metier', METIERS.map(x => ({ v: x, l: x })), c.metier ? [c.metier] : [], { optional: true }))}
    ${fld('Téléphone', inp('f_ctel', c.tel, 'type="tel" inputmode="tel" autocomplete="off"'))}
    ${fld('Notes', area('f_cnotes', c.notes, 'rows="2" placeholder="Urgences, horaires, adresse…"'))}
    ${dlist('dl-cnom', noms)}`;
  openSheet(ex ? ex.nom : 'Contact utile', body, {
    focus: ex ? null : '#f_cnom',
    onSubmit: f => {
      const nom = val('f_cnom');
      if (!nom) return 'Indique le nom.';
      Object.assign(c, { nom, metier: chipVal(f, 'metier'), tel: val('f_ctel'), notes: val('f_cnotes') });
      putCfg(Object.assign({}, S.cfg || {}, { contacts: [...contacts().filter(x => x.id !== c.id), c] }));
      toast(ex ? 'Contact enregistré' : `${nom} ajouté aux contacts`);
    },
    onDelete: ex ? () => { const prev = clone(S.cfg || {}); putCfg(Object.assign({}, S.cfg || {}, { contacts: contacts().filter(x => x.id !== id) })); toast('Contact supprimé', { undo: () => putCfg(prev) }); } : null
  });
}
ACT['edit-contact'] = d => formContact(d.id);
ACT['new-contact'] = () => formContact(null);

  const P = periode(ui.eqPer);

    <div class="list">${es.map(e => rowDep(e, true)).join('')}</div>
    ${pickPerson('attrib', 'Tout attribuer à', null, { moi: true, autre: false })}`, {
    submit: 'Attribuer',

/* ---------- Abonnement de l'écurie (version installable) ----------
   Essai gratuit de 2 mois, sans carte. Pendant l'essai : tout le carnet, 2 chevaux au plus ; la carte des prés
   et les points crottins sont réservés aux écuries abonnées. Après l'essai sans abonnement : lecture seule
   (tout reste consultable et exportable). Abonnement : 10 €/mois ou 100 €/an, payé par la gérante
   (paiement fictif en attendant Shine ou Tebex). Écuries créées avant le 6 novembre 2026 à 12 h : abonnées à vie. */
const ABO = { mois: 10, an: 100, chevaux: 2, aVieAvant: 1793962800000, rappel: 14 };
// « 6 janvier », avec l'année quand la date est loin (« 20 février 2028 »)
const dJour = ms => fmt(isoOf(new Date(ms)), Math.abs(ms - Date.now()) > 300 * 86400000 ? { day: 'numeric', month: 'long', year: 'numeric' } : { day: 'numeric', month: 'long' });

/* État d'une écurie : a_vie, abonnee, essai, expiree (inconnu tant que rien n'est chargé : on ne bloque rien) */
function aboEtat(e) {
  if (e === undefined) e = ecurieOuverte();
  if (!window.EQ_MODE) return { code: 'a_vie' };          // carnet partagé sur claude.ai : rien ne change
  if (!e || (!e.abonnement && !e.creeLe)) return { code: 'inconnu' };
  const a = e.abonnement || {}, now = Date.now();
  if (a.statut === 'fondatrice' || a.statut === 'a_vie' || (e.creeLe && e.creeLe < ABO.aVieAvant)) return { code: 'a_vie' };
  if (a.statut === 'abonnee' && a.fin > now) return { code: 'abonnee', formule: a.formule, fin: a.fin, paiement: a.paiement || null };
  if (a.finEssai > now) return { code: 'essai', fin: a.finEssai, jours: Math.max(1, Math.ceil((a.finEssai - now) / 86400000)) };
  return { code: 'expiree', fin: Math.max(a.finEssai || 0, a.fin || 0) };
}
/* L'administration EquiValdi n'est limitée par rien */
function premium() {
  const e = ecurieOuverte();
  if (e && e.fantome) return true;
  const c = aboEtat(e).code;
  return c !== 'essai' && c !== 'expiree';
}
function ecurieFigee() {
  const e = ecurieOuverte();
  return !!e && !e.fantome && aboEtat(e).code === 'expiree';
}
function chevalPossible() { return premium() || chevaux().filter(h => !h.ex).length < ABO.chevaux; }
function figeeMsg() {
  const e = ecurieOuverte() || {};
  return e.role === 'gerante' ? "L'essai gratuit est terminé : abonne l'écurie pour continuer à noter. Tout reste consultable."
    : "L'essai gratuit de l'écurie est terminé : la gérante peut l'abonner pour continuer à noter. Tout reste consultable.";
}
function aboResume(st) {
  if (st.code === 'a_vie') return { titre: 'Abonnée à vie', detail: 'Toutes les fonctions, pour toujours.', ic: 'rosette', ton: 'ok' };
  if (st.code === 'abonnee') return {
    titre: `Abonnée · formule ${st.formule === 'an' ? 'annuelle' : 'mensuelle'}`, ic: 'check', ton: 'ok',
    detail: `Payée jusqu'au ${dJour(st.fin)}${st.paiement && st.paiement.fournisseur === 'fictif' ? ' (paiement de démonstration)' : ''}.`
  };
  if (st.code === 'essai') return {
    titre: `Essai gratuit · encore ${st.jours} ${pl(st.jours, 'jour')}`, ic: 'clock', ton: st.jours <= ABO.rappel ? 'warn' : '',
    detail: `Jusqu'au ${dJour(st.fin)}, sans carte. ${ABO.chevaux} chevaux au plus ; la carte des prés et les points crottins viennent avec l'abonnement.`
  };
  if (st.code === 'expiree') return { titre: 'Essai terminé · lecture seule', detail: `Depuis le ${dJour(st.fin)}. Tout reste consultable et exportable.`, ic: 'lock', ton: 'danger' };
  return null;
}
const RAISONS = {
  chevaux: { t: 'Plus de 2 chevaux', p: "Pendant l'essai, l'écurie compte 2 chevaux au plus. Abonnée, elle en accueille autant que tu veux." },
  carte: { t: 'La carte des prés', p: "La carte en 3D, l'état des prés en couleur et les chevaux à faire glisser sont réservés aux écuries abonnées." },
  crottins: { t: 'Les points crottins', p: "Les crottins, la boutique et le classement de l'équipe sont réservés aux écuries abonnées." },
  fin: { t: 'Essai terminé', p: "Abonne l'écurie pour continuer à noter. Tout reste consultable en attendant." }
};

/* Réglages › Mon écurie : l'état de l'abonnement */
function aboHtml() {
  const e = ecurieOuverte();
  if (!window.EQ_MODE || !e) return '';

    : g && st.code === 'abonnee' ? `<button type="button" class="btn small" data-act="abonner">Prolonger</button>` : '';
  return `<div class="abo-etat ${r.ton}">${ic(r.ic)}<div class="row-main"><b>${esc(r.titre)}</b><span class="small">${esc(r.detail)}</span>${!g && !e.fantome && ouvert ? `<span class="small">Seule la gérante peut abonner l'écurie.</span>` : ''}</div>${btn}</div>`;
}
/* Accueil : mode administrateur, fin d'essai proche (gérante), essai terminé (tout le monde) */
function bandeauAbo() {

/* S'abonner : la formule, puis le paiement (fictif pour l'instant) */
ACT.abonner = d => {
  const e = ecurieOuverte();
  if (!window.EQ || !e) return;
  if (e.fantome) { ACT['adm-ecurie']({ sid: idEcurie(e) }); return; }
  const r = RAISONS[d && d.raison] || null, st = aboEtat(e);
  const intro = r ? `<p class="note" style="color:var(--ink)">${esc(r.p)}</p>` : '';
  if (e.role !== 'gerante') {
    openSheet(r ? r.t : 'Abonnement', `${intro}<p class="note">Seule la gérante de ${esc(e.nom || "l'écurie")} peut l'abonner : ${ABO.mois} € par mois ou ${ABO.an} € par an.</p>`);
    return;
  }
  const plan = (v, prix, per, plus) => ({ v, html: `<b>${prix} €</b><span>${per}</span><small>${plus}</small>`, aria: `${prix} euros ${per}` });
  openSheet(st.code === 'abonnee' ? "Prolonger l'abonnement" : "Abonner l'écurie", `${intro}
    <div class="abo-plans">${chips('formule', [plan('mois', ABO.mois, 'par mois', 'Sans engagement'), plan('an', ABO.an, 'par an', '2 mois offerts')], 'an')}</div>
    <ul class="abo-plus">${['Chevaux sans limite', 'Carte des prés en 3D', 'Points crottins et boutique', "Toute l'équipe, en direct"].map(x => `<li>${ic('check', 'sm')}${x}</li>`).join('')}</ul>
    ${st.code === 'abonnee' ? `<p class="note">Payée jusqu'au ${dJour(st.fin)} : la nouvelle période s'ajoute à la suite.</p>` : ''}`, {
    submit: 'Continuer vers le paiement', local: true,
    onSubmit: f => { const fo = chipVal(f, 'formule'); if (!fo) return 'Choisis une formule.'; feuillePaiement(fo); return false; }
  });
};
// même calcul que l'enregistrement : la période payée vient à la suite de l'essai ou de l'abonnement en cours
function finPrevue(e, fo) {
  const a = (e && e.abonnement) || {}, now = Date.now();
  const d = new Date(Math.max(now, a.finEssai || 0, a.statut === 'abonnee' ? a.fin || 0 : 0)), j = d.getDate();
  d.setMonth(d.getMonth() + (fo === 'an' ? 12 : 1)); if (d.getDate() < j) d.setDate(0);
  return d.getTime();
}
function feuillePaiement(fo) {
  const e = ecurieOuverte() || {}, m = ABO[fo], st = aboEtat(e);
  const suite = st.code === 'essai' ? `<p class="note">Tout se débloque tout de suite, et ton essai n'est pas perdu : ${fo === 'an' ? "l'année payée commence" : 'le mois payé commence'} le ${dJour(st.fin)}, à la fin de l'essai.</p>`
    : st.code === 'abonnee' ? `<p class="note">${fo === 'an' ? "L'année s'ajoute" : "Le mois s'ajoute"} à la suite de l'abonnement en cours (jusqu'au ${dJour(st.fin)}).</p>` : '';
  openSheet('Paiement', `<div class="abo-demo"><span class="pill warn">Démo</span><p class="note" style="color:var(--ink)">Paiement fictif : aucun argent n'est débité. Le vrai paiement passera par Shine ou Tebex.</p></div>
    <div class="abo-recap"><div class="row-main"><b>${esc(e.nom || 'Écurie')}</b><span class="small muted">Abonnement ${fo === 'an' ? 'annuel' : 'mensuel'}</span><span class="small muted">jusqu'au ${dJour(finPrevue(e, fo))}</span></div><b class="abo-prix">${m} €</b></div>${suite}
    <p class="note">${m} € TTC, TVA non applicable (article 293 B du CGI). Pas de renouvellement automatique : à la fin de la période, l'écurie repasse en lecture seule jusqu'au paiement suivant.</p>
    <label class="check"><input type="checkbox" id="f_cgv"><span>J'ai lu et j'accepte les <a href="${esc(EQ.legal ? EQ.legal.conditions : './legal/conditions.html')}" target="_blank" rel="noopener">conditions de vente</a>.</span></label>`, {
    submit: `Payer ${m} € (démo)`, local: true,
    onSubmit: () => !$('#f_cgv').checked ? 'Coche la case pour accepter les conditions de vente.' : envoi(EQ.payerFictif(fo), a => {
      closeSheet();
      toast(`Merci ! ${e.nom || "L'écurie"} est abonnée jusqu'au ${dJour(a.fin)}.`, { fete: true });
      render();
    }, "Le paiement n'a pas pu être enregistré : vérifie ta connexion.")
  });
}

/* ---------- Barème ---------- */
function ptsTache(tk) {
  const ef = (EFFORTS.find(e => e.id === tk.effort) || EFFORTS[1]).x;

  const jourT = ms => isoOf(new Date(ms));
  const recent = (o, d, j) => !!(o.creePar && o.creePar.t) && diffDays(d, jourT(o.creePar.t)) <= j;
  const auteur = o => o.creePar ? { uid: o.creePar.uid || null, nom: o.creePar.nom || '' } : null;
  const parT = (a, b) => ((a.creePar && a.creePar.t) || 0) - ((b.creePar && b.creePar.t) || 0);
  const add = (r, e) => {
    if (!(e.pts > 0)) return;
    const k = pKey(r);
    if (!k) return;
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(e);
  };
  // tâches cochées : la valeur est fixée au moment de la coche et partagée entre ceux qui l'ont faite,
  // dans la limite du plafond du jour de chacun
  const coches = [], plafond = new Map();
  toutesTaches().forEach(tk => faitsDe(tk).forEach(f => { if (f.d >= D) coches.push({ tk, f, t: f.t || toUTC(f.d) }); }));
  coches.sort((a, b) => a.t - b.t).forEach(({ tk, f, t: T }) => {
    const qui = faitPar(f);

    const part = partTache(Number.isFinite(f.pts) ? f.pts : ptsTache(tk), qui.length);

    vus.add(u);

function classementCrottins(P) {
  const rows = [];
  crottinsEntrees().forEach((es, k) => {
    const p = personne(k);
    if (!p) return;
    const pts = es.filter(e => !P.from || e.d >= P.from).reduce((s, e) => s + e.pts, 0);
    if (pts > 0) rows.push({ p, pts, tot: es.reduce((s, e) => s + e.pts, 0) });
  });
  rows.sort((a, b) => b.pts - a.pts || byName(a.p, b.p));
  if (!rows.length) return `<p class="note">Personne n’a encore gagné de crottins ${P.label}. Coche une tâche pour ouvrir le bal !</p>`;
  const max = rows[0].pts;
  return `<div class="list">${rows.map((x, i) => `<button type="button" class="row" data-act="open-membre" data-k="${esc(x.p.k)}">
    <span class="podium p${i < 3 ? i + 1 : 0}">${i + 1}</span>${pav(x.p)}
    <div class="row-main"><div class="row-t">${esc(x.p.nom)}${estMoi(x.p.k) ? ' <span class="pill ok">Toi</span>' : ''}</div><div class="row-s">${esc(rangDe(x.tot).r.nom)}</div>

}

    const bx = boite(z.pts), lx = bx.x1 - bx.x0, ly = bx.y1 - bx.y0;

    const long = lx >= ly;

      const x = long ? bx.x0 + lx * f : (bx.x0 + bx.x1) / 2, y = long ? (bx.y0 + bx.y1) / 2 : bx.y0 + ly * f;

  const pts = [];
  zones.forEach(z => z.pts.forEach(q => pts.push(q)));
  abris.forEach(a => { pts.push([a.c[0] - a.w / 2, a.c[1] - a.h / 2], [a.c[0] + a.w / 2, a.c[1] + a.h / 2], [a.c[0] - a.w / 2, a.c[1] + a.h / 2], [a.c[0] + a.w / 2, a.c[1] - a.h / 2]); });

}

// le tracé lu dans la base, remis au propre (identifiants, nombres, types connus)

  const els = tr.els.slice(0, 400).map(e => {
    if (!e || !ED_T[e.type] || typeof e.id !== 'string' || !/^[a-z0-9]{1,24}$/.test(e.id)) return null;
    const o = { id: e.id, type: e.type, pts: ptsOk(e.pts, 2000) };
    if (!o.pts.length) return null;
    if (e.type === 'pre') o.n = nbOk(e.n) ? Math.max(1, Math.min(999, Math.round(e.n))) : 1;
    if (e.type === 'piste') { o.larg = nbOk(e.larg) ? Math.max(1, Math.min(30, e.larg)) : 4; o.ferme = e.ferme === true; }
    const nom = texteOk(e.nom, 40);

  const E = tr.ech && typeof tr.ech === 'object' ? { a: ptOk(tr.ech.a), b: ptOk(tr.ech.b), m: nbOk(tr.ech.m) && tr.ech.m > 0 ? tr.ech.m : 50, ok: tr.ech.ok === true } : null;

/* ---------- Le plan : choisi, réduit, envoyé (ou relu) ---------- */
async function edReduire(f) {
  const d = await decodeImage(f);
  let max = 2000;
  for (let essai = 0; essai < 6; essai++) {
    const r = Math.min(1, max / Math.max(d.w, d.h)), w = Math.round(d.w * r), h = Math.round(d.h * r);
    const c = newCanvas(w, h), x = ctx2d(c);
    x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
    x.drawImage(d.img, 0, 0, w, h);
    for (const q of [.82, .72, .62]) { const src = c.toDataURL('image/jpeg', q); if (src.length <= 880000) return { src, w, h }; }
    max = Math.round(max * .8);

}
async function edFichier(f) {

    edEnvoyerPlan();

    ED.imgEtat = ED.img ? 'ok' : '';

}
function edEnvoyerPlan() {

  conc('ex-ulysse', 'hugo', -39, { lieu: 'Haras de la Forêt', discipline: 'Dressage', niveau: 'amateur', epreuve: 'Amateur 3 Grand Prix', frais: 30, payePar: paye('hugo'), rang: 5, partants: 12, score: '64,2 %' });

  tache({ titre: 'Ramasser les crottins au pré', freq: 'jours', n: 7, effort: 'leger', preId: P.p6 }, [[-5, 'lea', 11, ['hugo']], [-12, 'hugo', 11], [-19, 'lea', 11], [-26, 'camille', 11]]);
  tache({ titre: 'Graisser les sabots de Joker', freq: 'jours', n: 2, effort: 'leger', horseId: 'ex-joker' }, jours(-21, -1, 2).map(a => [a, 'hugo', 18]));

/* ---------- Compte et EquiValdi (version installable) ----------
   « Une idée, un souci ? » (message à EquiValdi, réponse lue dans les réglages), les pages légales,
   l'acceptation des conditions par les comptes créés avant elles, mes données et la suppression du compte. */
const RETOUR_TYPES = [{ v: 'idee', l: 'Une idée', ic: 'leaf' }, { v: 'souci', l: 'Un souci', ic: 'alert' }, { v: 'question', l: 'Une question', ic: 'info' }];
const RETOUR_BROUILLON = 'equivaldi:retour-brouillon';
const compteOk = () => !!(window.EQ_MODE && window.EQ && !estExemple() && ecurieOuverte());
let RET = null, retEnCours = null;   // mes messages, chargés à l'ouverture des réglages
function chargerRetours(forcer = false) {
  if (!compteOk() || (!forcer && (RET || retEnCours))) return retEnCours;
  retEnCours = EQ.mesRetours().then(l => { RET = { t: Date.now(), liste: l }; }, () => { RET = RET || { t: Date.now(), liste: [], erreur: true }; })
    .then(() => { retEnCours = null; rerenderSoon(); });
  return retEnCours;
}
const jourHeure = ms => `${dShort(isoOf(new Date(ms)))} à ${hTxt(ms)}`;

/* Réglages › Une idée, un souci ? */
function retoursHtml() {
  if (!compteOk() || ecurieOuverte().fantome) return '';
  if (!RET) chargerRetours();
  const l = RET ? RET.liste : [];
  const rows = l.slice(0, 6).map(r => {
    const T = RETOUR_TYPES.find(x => x.v === r.type) || RETOUR_TYPES[0], nouv = !!(r.reponse && !r.vuLe);
    return `<button type="button" class="row" data-act="retour-voir" data-id="${esc(r.id)}">${lead(T.ic)}<div class="row-main"><div class="row-t trunc">${esc(r.texte)}</div><div class="row-s">${esc(r.reponse ? `Réponse d'EquiValdi · ${dShort(isoOf(new Date(r.reponse.le)))}` : `Envoyé le ${dShort(isoOf(new Date(r.le)))}`)}</div></div>${nouv ? '<span class="pill ok">Nouveau</span>' : `<span class="row-end">${ic('next', 'sm')}</span>`}</button>`;
  }).join('');
  return section('Une idée, un souci ?', `<p class="note" style="color:var(--ink)">Une fonction qui manque, quelque chose qui coince, une question : écris directement à EquiValdi. La réponse arrive ici.</p>
    <button type="button" class="btn" data-act="retour-ecrire" style="align-self:flex-start">${ic('edit', 'sm')}Écrire à EquiValdi</button>
    ${rows ? `<div class="list">${rows}</div>` : ''}`);
}
ACT['retour-ecrire'] = d => {
  if (!compteOk()) return;
  let b = null;
  try { b = JSON.parse(localStorage.getItem(RETOUR_BROUILLON) || 'null'); } catch (e) { b = null; }
  const type = (d && d.type) || (b && b.type) || 'idee';
  openSheet('Écrire à EquiValdi', `
    ${grp('C\'est…', chips('rtype', RETOUR_TYPES.map(x => ({ v: x.v, html: `${ic(x.ic, 'sm')}<span>${x.l}</span>` })), type))}
    ${fld('Ton message', area('f_rtexte', (b && b.texte) || '', 'rows="6" maxlength="2000" placeholder="Ce que tu aimerais, ce qui ne marche pas, sur quel écran…"'))}
    <p class="note">Partent avec ton message : ton prénom, ton adresse e-mail, le nom de l'écurie, ton rôle et le modèle de ton téléphone, pour qu'on puisse t'aider. Voir la ${`<a href="${esc(EQ.legal.confidentialite)}" target="_blank" rel="noopener">politique de confidentialité</a>`}.</p>`, {
    submit: 'Envoyer', local: true, focus: '#f_rtexte',
    onSubmit: f => {
      const texte = val('f_rtexte'), rtype = chipVal(f, 'rtype') || 'idee';
      if (texte.length < 3) return 'Écris quelques mots.';
      const garde = () => { try { localStorage.setItem(RETOUR_BROUILLON, JSON.stringify({ type: rtype, texte })); } catch (e) { /* rien */ } };
      garde();
      return envoi(EQ.envoyerRetour({ type: rtype, texte }), () => {
        try { localStorage.removeItem(RETOUR_BROUILLON); } catch (e) { /* rien */ }
        closeSheet();
        toast('Merci ! Ton message est parti chez EquiValdi.', { fete: true });
        chargerRetours(true);
      }, "Pas de réseau : ton message est gardé sur ce téléphone. Réessaie dès que tu as du réseau.");
    }
  });
};
ACT['retour-voir'] = d => {
  const r = RET && RET.liste.find(x => x.id === d.id);
  if (!r) return;
  const T = RETOUR_TYPES.find(x => x.v === r.type) || RETOUR_TYPES[0];
  openSheet(T.l, `<div class="box"><p class="small muted">Envoyé le ${esc(jourHeure(r.le))}</p><p class="msg-texte">${esc(r.texte)}</p></div>
    ${r.reponse ? `<div class="box ok"><p class="small muted">Réponse d'EquiValdi · ${esc(jourHeure(r.reponse.le))}</p><p class="msg-texte">${esc(r.reponse.texte)}</p></div>` : '<p class="note">Pas encore de réponse : elle arrivera ici.</p>'}
    <button type="button" class="link" data-act="retour-ecrire" style="align-self:flex-start">${ic('edit', 'sm')}Écrire un autre message</button>`);
  if (r.reponse && !r.vuLe) {
    r.vuLe = Date.now();
    EQ.retourVu(r.id).catch(() => { delete r.vuLe; });
    rerenderSoon();
  }
};

/* Réglages › À propos : version et pages légales */
function aProposHtml() {

/* Accueil : les comptes créés avant les conditions d'utilisation les acceptent une fois */

    <button type="button" class="btn small primary" data-act="cgu-ok">J'ai lu et j'accepte</button></div>`;
}
ACT['cgu-ok'] = (d, el) => {
  if (el) el.disabled = true;
  EQ.accepterConditions().then(() => { toast('Merci !'); render(); }, () => { if (el && el.isConnected) el.disabled = false; toast("Ça n'a pas marché : vérifie ta connexion.", { danger: true }); });
};

/* Réglages › Ton compte : mes données, supprimer mon compte */
ACT['mes-donnees'] = async (d, el) => {
  if (!compteOk()) return;
  if (el) el.disabled = true;
  try {
    const data = await EQ.mesDonnees(), dl = await window.claude.use('downloads');
    await dl.save({ filename: `equivaldi-mes-donnees-${todayISO()}.json`, data: JSON.stringify(data, null, 1) });
    toast('Tes données sont téléchargées. Le carnet de l\'écurie s\'exporte dans « Sauvegarde ».');
  } catch (e) { toast(eqMsg(e, 'Le téléchargement n\'a pas pu se faire : vérifie ta connexion.'), { danger: true }); }
  finally { if (el && el.isConnected) el.disabled = false; }
};
ACT['supprimer-compte'] = async () => {
  if (!compteOk()) return;
  let a;
  toast('Vérification de tes écuries…');
  try { a = await EQ.analyseSuppression(); }
  catch (e) { toast(eqMsg(e, 'Impossible de vérifier tes écuries : vérifie ta connexion.'), { danger: true }); return; }
  const noms = l => l.map(x => `<b>${esc(x.nom)}</b>`).join(', ');
  if (a.bloquees.length) {
    openSheet('Supprimer mon compte', `<p class="note" style="color:var(--ink)">Tu gères ${noms(a.bloquees)} avec une équipe. Passe d'abord la gérance à une personne qui a le droit « Peut modifier » (Réglages › Mon écurie › Passer la gérance), puis reviens ici.</p>`);
    return;
  }
  let arme = false;
  openSheet('Supprimer mon compte', `<div class="box danger"><div class="issue danger">${ic('alert', 'sm')}<span>C'est définitif : ton compte et ton adresse e-mail sont effacés d'EquiValdi.</span></div></div>
    ${a.supprimees.length ? `<p class="note" style="color:var(--ink)">Tu es seule ou seul dans ${noms(a.supprimees)} : ${a.supprimees.length > 1 ? 'ces écuries sont supprimées' : 'cette écurie est supprimée'} avec tout ${a.supprimees.length > 1 ? 'leur' : 'son'} carnet. Pense à l'exporter avant (Réglages › Sauvegarde).</p>` : ''}
    ${a.quittees.length ? `<p class="note" style="color:var(--ink)">Tu quittes ${noms(a.quittees)}. Ce que tu y as noté reste dans leur carnet, à ton prénom.</p>` : ''}
    <p class="note">Tes messages à EquiValdi sont effacés aussi. Pour récupérer une copie avant, touche « Télécharger mes données ».</p>
    ${fld('Ton mot de passe', inp('f_mdp', '', 'type="password" autocomplete="current-password"'), 'Pour confirmer que c\'est bien toi.')}`, {
    submit: 'Supprimer mon compte', local: true, focus: '#f_mdp',
    onSubmit: () => {
      const b = $('#sfOk');
      if (!val('f_mdp')) return 'Indique ton mot de passe.';
      if (!arme) { arme = true; b.textContent = 'Confirmer : tout supprimer'; b.classList.add('armed'); return false; }
      return envoi(EQ.supprimerCompte(val('f_mdp')), () => {}, "La suppression n'a pas pu se faire : vérifie ta connexion, puis réessaie.");
    }
  });
};

/* ---------- Démarrage ---------- */
loadCache();
if (window.EQ_MODE) {
  // après « Dessiner la carte » dans l'administration : l'éditeur de la carte de l'écurie ouverte
  try {
    const apres = JSON.parse(localStorage.getItem('equivaldi:apres') || 'null');

    if (apres === 'carte') { nav.tab = 'pres'; ui.presVue = 'carte'; nav.stack = [{ view: 'carteEd' }]; }
  } catch (e) { /* stockage indisponible */ }
}
render();
connect();
let lastDay = todayISO();
setInterval(() => { if (todayISO() !== lastDay) { lastDay = todayISO(); render(); } }, 60000);
</script>

/* ---------- Codes d'invitation : 8 caractères faciles à lire et à dicter ---------- */
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const normCode = s => String(s || '').toUpperCase().replace(/[\s\-‐-—_.]/g, '');
const codeOk = c => /^[A-HJ-NP-Z2-9]{8}$/.test(c);
const joli = c => c.slice(0, 4) + '-' + c.slice(4);
function tireCode() {
  const a = new Uint32Array(8);
  crypto.getRandomValues(a);
  return Array.from(a, n => ALPHA[n % ALPHA.length]).join('');   // 32 symboles : tirage sans biais
}

/* ---------- Adaptateur : la base de l'écurie ouverte, sous la forme attendue par le carnet ---------- */
const code = e => ({ 'permission-denied': 'invalid_argument', 'invalid-argument': 'invalid_argument', 'resource-exhausted': 'quota_exceeded', 'unauthenticated': 'revoked' }[e && e.code] || 'unavailable');
const fail = e => { throw { code: code(e), message: e && e.message }; };
const clean = d => JSON.parse(JSON.stringify(d));
const snapDoc = s => ({ id: s.id, exists: s.exists(), data: () => s.data(), metadata: { fromCache: s.metadata.fromCache, hasPendingWrites: s.metadata.hasPendingWrites } });
// Les fiches de l'équipe sont fusionnées, jamais remplacées, et sans le rôle ni l'adresse :
// ceux-là ne changent que par la gérante (changerRole), même si la copie locale est ancienne.
const fiche = d => { const o = clean(d); delete o.role; delete o.email; return o; };
function adaptateur(sid) {
  const base = 'structures/' + sid;
  const refus = e => { if (estRefus(e)) verifierAccesBientot(); };
  const docApi = r => ({
    id: r.id, path: r.path,
    set: d => (String(r.path).startsWith(base + '/membres/') ? setDoc(r, fiche(d), { merge: true }) : setDoc(r, clean(d))).catch(fail),
    delete: () => deleteDoc(r).catch(fail),
    get: () => getDoc(r).then(snapDoc, fail),
    onSnapshot: (next, err) => onSnapshot(r, { includeMetadataChanges: true }, s => next(snapDoc(s)), e => { refus(e); if (err) err({ code: code(e), message: e.message }); })
  });
  return {
    sid,
    doc: path => docApi(doc(fs, base + '/' + path)),
    collection: c => ({
      path: c,
      doc: id => docApi(id ? doc(fs, base + '/' + c, id) : doc(collection(fs, base + '/' + c))),
      onSnapshot: (next, err) => onSnapshot(collection(fs, base + '/' + c), { includeMetadataChanges: true },
        q => next({ docs: q.docs.map(snapDoc), size: q.size, empty: q.empty, metadata: { fromCache: q.metadata.fromCache, hasPendingWrites: q.metadata.hasPendingWrites } }),
        e => { refus(e); if (err) err({ code: code(e), message: e.message }); })
    })
  };
}

async function lireIndex(u) {
  const s = await getDoc(doc(fs, 'utilisateurs', u.uid));
  const base = { nom: nomDe(u), email: adresse(u) };
  // conditions acceptées à la création du compte (case cochée sur ce téléphone) : notées avec l'index
  const cgu = lis(CGU_LOCAL), acceptees = cgu && cgu.version === CONDITIONS ? { version: CONDITIONS, le: cgu.le || Date.now() } : null;
  if (!s.exists()) {
    const v = Object.assign({ ecuries: {} }, base, acceptees ? { conditions: acceptees } : {});
    setDoc(doc(fs, 'utilisateurs', u.uid), v, { merge: true }).then(() => ecris(CGU_LOCAL, null)).catch(() => {});
    return Object.assign({ derniere: null }, v);
  }
  const d = s.data() || {}, maj = {};
  if (d.email !== base.email || !d.nom) Object.assign(maj, { email: base.email, nom: d.nom || base.nom });
  if (acceptees && !(d.conditions && d.conditions.version === CONDITIONS)) { maj.conditions = acceptees; d.conditions = acceptees; }
  if (Object.keys(maj).length) setDoc(doc(fs, 'utilisateurs', u.uid), maj, { merge: true }).then(() => { if (maj.conditions) ecris(CGU_LOCAL, null); }).catch(() => {});
  return Object.assign({}, d, { ecuries: (d.ecuries && typeof d.ecuries === 'object') ? Object.assign({}, d.ecuries) : {} });
}

    if (!s.exists() || !f.exists()) {

      return { perdu: true };

/* ---------- Parcours à la connexion ---------- */
async function entrer(u) {
  U = u; MAIL = adresse(u); ADMIN = MAIL === ADMIN_MAIL;
  const local = lis(K.ecurie);
  // un autre compte s'est servi de ce téléphone : ses écuries n'ont rien à faire ici
  if (local && local.uid && local.uid !== u.uid) { purgerEcuries(); location.reload(); return; }
  if (!window.EQ_SID) attente();
  try { await parcours(u, local && local.uid === u.uid ? local : null); }
  catch (e) {
    console.error(e);
    // sans réseau : l'écurie de ce téléphone s'ouvre avec ses données et son rôle gardés
    if (!estRefus(e) && local && ouvrirHorsLigne(u, local)) return;
    ecranSouci(u, e);

function ouvrirHorsLigne(u, local) {

async function parcours(u, local) {
  // lectures lancées ensemble, pour ouvrir vite
  const preLocal = local && local.sid ? tente(acces(local.sid, { fantome: !!local.fantome })) : null;
  const preMails = tente(invitationsMail());
  // 1. Index personnel (un refus ici veut dire que les nouvelles règles ne sont pas encore publiées)
  let idx;
  try { idx = await lireIndex(u); }
  catch (e) {
    if (!estRefus(e)) throw e;
    await u.getIdToken(true).catch(() => {});   // adresse confirmée depuis peu : jeton à rafraîchir
    try { idx = await lireIndex(u); }
    catch (e2) { if (estRefus(e2)) { await reglesAnciennes(u, e2); return; } throw e2; }
  }
  IDX = idx;
  CGU_A_FAIRE = !(idx.conditions && idx.conditions.version === CONDITIONS);
  // Administration : l'écurie ouverte depuis « Toutes les écuries », sans en être membre
  if (ADMIN && local && local.fantome && preLocal) {
    const x = await preLocal;
    if (x.v && x.v.ok) { demarrer(u, x.v.e); return; }
    if (x.e && !estRefus(x.e) && ouvrirHorsLigne(u, local)) return;
    ecris(K.ecurie, null);
    local = null;
  }
  // 2. Invitation en attente (lien ouvert ou code tapé)
  const c = lis(K.invitation);
  if (c && !VUS.has(c)) await proposerCode(u, c);
  // 3. Invitations reçues à son adresse, une à la fois
  const m = await preMails;
  for (const inv of (m.v || [])) if (!VUS.has(inv.code) && !IDX.ecuries[inv.structure]) await proposer(u, inv);
  // 5. Ouvrir la dernière écurie si elle est encore accessible, sinon celle de ce téléphone, sinon la première
  const ordre = [IDX.derniere, local && local.sid, ...listeEcuries().map(x => x.id)].filter((s, i, a) => s && a.indexOf(s) === i);
  const perdues = [];
  for (const sid of ordre) {
    let r;
    try {
      if (preLocal && local && sid === local.sid) { const x = await preLocal; if (x.e) throw x.e; r = x.v; }
      else r = await acces(sid);
    } catch (e) {
      if (!estRefus(e) && local && sid === local.sid && ouvrirHorsLigne(u, local)) return;
      throw e;
    }
    if (r.perdu) { perdues.push({ sid, nom: (IDX.ecuries[sid] && IDX.ecuries[sid].nom) || (local && local.sid === sid && local.nom) || '' }); continue; }
    retirerDeLIndex(perdues.map(p => p.sid));
    perdues.forEach(p => { oublierEcurie(p.sid); avis(plusAcces(p.nom)); });
    const recharger = await rangerAnciennesCles(r.e.id);
    demarrer(u, r.e, { recharger });
    return;
  }
  retirerDeLIndex(perdues.map(p => p.sid));
  perdues.forEach(p => oublierEcurie(p.sid));
  const note = perdues.map(p => plusAcces(p.nom)).join(' ');
  // 4. Ancien carnet : mise à jour par la gérante, ou écurie déjà mise à jour à rejoindre
  if (await ancienCarnet(u)) return;
  // 6. Aucune écurie
  ecranAccueil(u, note);
}
