<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EquiValdi</title>
<meta name="description" content="Carnet d'écurie EquiValdi : chevaux, rations, soins, entraînement, prés, foin, concours et tâches partagées.">
<meta name="theme-color" content="#EEF1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1611" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EquiValdi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Mise en page : carnet EquiValdi — en-tête au symbole Cheval-feuille, sections empilées, onglets au pouce, bouton + flottant.
   Charte « Logo EquiValdi » : Vert écurie, Vert pousse, Menthe, Brume, Blanc ; Outfit pour le texte, Barlow Condensed SemiBold pour les titres. */
:root{
  --bg:#EEF1EB;            /* Brume : fond de l'appli */
  --surface:#FFFFFF;       /* Blanc */
  --surface-2:#E4EAE2;
  --ink:#16211A; --ink-2:#4C5850; --line:#D2D9CD; --ctl:#7D8A80;
  --accent:#2B6340;        /* Vert écurie */
  --accent-strong:#1E4A30; --accent-ink:#FFFFFF; --accent-soft:#D9E8DC;
  --pousse:#5DB075;        /* Vert pousse */
  --menthe:#9FD6AE;        /* Menthe */
  --logo-ink:#2B6340; --logo-leaf:#5DB075;
  --hay:#B07D22; --hay-ink:#7A5410; --hay-soft:#F2E6CB;
  --danger:#A33A26; --danger-soft:#F5DDD6; --warn:#8C5106; --warn-soft:#F7E6CA; --info:#2D5A86; --info-soft:#DCE6F0;
  --h0:#2B6340; --h1:#7A4A2B; --h2:#A0522D; --h3:#56636B; --h4:#2F6E6B; --h5:#6B5A2A; --h6:#3F7F52; --h7:#3A3430; --on-h:#FFFFFF;
  --float:0 1px 2px rgba(22,33,26,.08),0 10px 24px rgba(22,33,26,.12);
  --scrim:rgba(10,16,12,.46);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px; --r-sm:14px; --bw:1.5px; --tab-h:68px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1611; --surface:#15211A; --surface-2:#1F2E25; --ink:#E8EFE9; --ink-2:#A7B5AB; --line:#2B3C31; --ctl:#6E8274;
  --accent:#9FD6AE; --accent-strong:#C2E8CD; --accent-ink:#0D1611; --accent-soft:#1E3828;
  --pousse:#5DB075; --menthe:#9FD6AE; --logo-ink:#FFFFFF; --logo-leaf:#9FD6AE;
  --hay:#DDB45C; --hay-ink:#E7C67C; --hay-soft:#33291A;
  --danger:#F28C76; --danger-soft:#3B1F19; --warn:#F0B45C; --warn-soft:#382A15; --info:#90BAE6; --info-soft:#1A2938;
  --h0:#3F8A5A; --h1:#9A6440; --h2:#B8693F; --h3:#6E7C85; --h4:#3F918C; --h5:#8A7638; --h6:#4E9A66; --h7:#5A524C; --on-h:#FFFFFF;
  --float:0 1px 2px rgba(0,0,0,.5),0 8px 20px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.62); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1611; --surface:#15211A; --surface-2:#1F2E25; --ink:#E8EFE9; --ink-2:#A7B5AB; --line:#2B3C31; --ctl:#6E8274;
  --accent:#9FD6AE; --accent-strong:#C2E8CD; --accent-ink:#0D1611; --accent-soft:#1E3828;
  --pousse:#5DB075; --menthe:#9FD6AE; --logo-ink:#FFFFFF; --logo-leaf:#9FD6AE;
  --hay:#DDB45C; --hay-ink:#E7C67C; --hay-soft:#33291A;
  --danger:#F28C76; --danger-soft:#3B1F19; --warn:#F0B45C; --warn-soft:#382A15; --info:#90BAE6; --info-soft:#1A2938;
  --h0:#3F8A5A; --h1:#9A6440; --h2:#B8693F; --h3:#6E7C85; --h4:#3F918C; --h5:#8A7638; --h6:#4E9A66; --h7:#5A524C; --on-h:#FFFFFF;
  --float:0 1px 2px rgba(0,0,0,.5),0 8px 20px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.62); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
b,strong{font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance}
sup{font-size:.6em;line-height:0}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:18px;height:18px}
.ic.solid{fill:currentColor;stroke:none}
.ic.solid .i-leaf{opacity:.55}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.note{font-size:14px;color:var(--ink-2);margin:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* Logo Cheval-feuille : couleurs portées par le thème */
.lg-ink{fill:var(--logo-ink)}
.lg-leaf{fill:var(--logo-leaf)}
.brand-mark{display:block;height:34px;width:auto}
.brand-logo{display:block;height:auto;max-width:100%}
.brand{width:44px;height:48px;display:grid;place-items:center;border:0;background:transparent;border-radius:12px;flex:none;margin-left:-6px;padding:0}
.brand:active{background:var(--surface-2)}
.loading,.welcome,.about{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.loading{padding:48px 0 0}
.loading .brand-logo,.welcome .brand-logo{width:min(250px,72%)}
.welcome{padding:10px 0 2px}
.about{padding:20px 0 4px}
.about .brand-logo{width:min(200px,60%)}

/* Barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto}
.top-title{flex:1;min-width:0}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);line-height:1.3}
.top h1{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1.05;margin:0;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:12px;color:var(--ink);flex:none;transition:background .12s}
.iconbtn:active{background:var(--surface-2)}
.sync{width:40px;height:44px;display:grid;place-items:center;border:0;background:transparent;flex:none;border-radius:12px}
.sync i{width:10px;height:10px;border-radius:50%;background:var(--ink-2);display:block}
.sync.ok i{background:var(--pousse)}
.sync.wait i{background:var(--warn)}
.sync.local i{background:transparent;border:2px solid var(--ink-2)}

/* Contenu */
.view{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(var(--tab-h) + 100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:24px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:28px}
.sec-h h2{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0}
.link{font-size:15px;color:var(--accent);background:none;border:0;font-weight:600;min-height:44px;padding:0 4px;display:inline-flex;align-items:center;gap:6px}

/* Surfaces : blanc bordé, sans ombre, comme la charte */
.list,.card,.pcard,.hero,.meal,.dl,.empty,.qa{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r)}
.list,.meal,.dl{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:58px;width:100%;text-align:left;border:0;background:transparent;border-top:1px solid var(--line);color:var(--ink);transition:background .12s}
.row:first-child{border-top:0}
button.row:active{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-t{font-weight:600;line-height:1.25;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-s{font-size:14px;color:var(--ink-2);line-height:1.3}
.row-end{display:flex;align-items:center;gap:8px;flex:none;color:var(--ink-2)}
.row .lead{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--accent)}
.row .lead.in{background:var(--accent-soft);color:var(--accent-strong)}
.row .lead.out{background:var(--hay-soft);color:var(--hay-ink)}
.row.sev-danger{box-shadow:inset 4px 0 0 var(--danger)}
.row.sev-warn{box-shadow:inset 4px 0 0 var(--warn)}
.row.sev-info{box-shadow:inset 4px 0 0 var(--info)}
.row.sev-danger .lead{background:var(--danger-soft);color:var(--danger)}
.row.sev-warn .lead{background:var(--warn-soft);color:var(--warn)}
.row.sev-info .lead{background:var(--info-soft);color:var(--info)}
.card{padding:14px;display:flex;flex-direction:column;gap:10px}

/* Pastilles : Barlow Condensed en capitales, comme l'étiquette « Retenue » de la charte */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;line-height:1.4;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill .ic{width:15px;height:15px}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--accent-soft);color:var(--accent-strong)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.hay{background:var(--hay-soft);color:var(--hay-ink)}
.tag-ex{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--info);border:1.5px solid currentColor;border-radius:6px;padding:0 5px;line-height:1.5}
.count{font-family:var(--f-display);font-size:14px;font-weight:600;letter-spacing:.06em;background:var(--accent-soft);color:var(--accent-strong);border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:1px}

/* Chevaux : avatars aux teintes de robes et de prés */
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--on-h);font-family:var(--f-display);font-weight:600;font-size:20px;flex:none;background:var(--h0);letter-spacing:.02em}
.av.s{width:26px;height:26px;border-radius:8px;font-size:14px}
.av.m{width:48px;height:48px;border-radius:14px;font-size:23px}
.av.xl{width:96px;height:96px;border-radius:24px;font-size:42px}
.av.photo{background-color:var(--surface-2);background-size:cover;background-position:center;background-repeat:no-repeat}
.hc0{background:var(--h0)}.hc1{background:var(--h1)}.hc2{background:var(--h2)}.hc3{background:var(--h3)}.hc4{background:var(--h4)}.hc5{background:var(--h5)}.hc6{background:var(--h6)}.hc7{background:var(--h7)}
.hchip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--ink);max-width:100%}
.hhead{flex-direction:row;align-items:center;gap:16px}
.hhead-main{gap:4px}
.hhead-main .row-t .ic{color:var(--accent)}
.hhead-main .btn{align-self:flex-start;margin-top:6px}
.avbtn{position:relative;flex:none;border:0;padding:0;background:transparent;border-radius:24px;color:var(--ink)}
.avbtn .cam{position:absolute;right:-6px;bottom:-6px;width:34px;height:34px;border-radius:50%;background:var(--surface);border:var(--bw) solid var(--line);display:grid;place-items:center;color:var(--accent)}
.avbtn .cam .ic{width:18px;height:18px}
.avbtn:active .av{filter:brightness(.92)}

/* Photo : choix et cadrage */
.pf{display:flex;gap:16px;align-items:center}
.pf-frame{position:relative;width:132px;max-width:100%;aspect-ratio:1/1;border-radius:24px;overflow:hidden;background:var(--surface-2);flex:none}
.pf-frame canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.pf-frame canvas:active{cursor:grabbing}
.pf-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;border:var(--bw) solid var(--line);border-radius:24px;color:var(--accent);font-size:14px;font-weight:600;text-align:center;cursor:pointer}
.pf-empty .ic{width:30px;height:30px}
.pf-side{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0;flex:1}
.pf.lg{flex-direction:column;align-items:stretch}
.pf.lg .pf-frame{width:min(280px,100%);align-self:center}
.pf.lg .pf-side{flex-direction:row;flex-wrap:wrap;justify-content:center}
.pf-zoom{display:flex;flex-direction:column;gap:2px}
.range,.field input.range{width:100%;min-height:44px;padding:0;border:0;border-radius:0;background:transparent;accent-color:var(--accent);margin:0}
label.btn{cursor:pointer}

/* Tâches partagées */
.trow{display:flex;align-items:center;border-top:1px solid var(--line);min-height:62px}
.trow:first-child{border-top:0}
.tick{width:56px;align-self:stretch;flex:none;display:grid;place-items:center;border:0;background:transparent;padding:0 0 0 6px}
.tick .ic{width:30px;height:30px;padding:4px;border-radius:9px;border:2px solid var(--ctl);color:transparent;stroke-width:3;transition:background .12s,border-color .12s,color .12s}
.tick:hover .ic{border-color:var(--accent)}
.tick[aria-pressed="true"] .ic{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tick:active .ic{transform:scale(.92)}
.trow.late .tick .ic{border-color:var(--warn)}
.trow-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;border:0;background:transparent;color:var(--ink);padding:10px 14px 10px 6px;min-height:62px}
.trow-main:active{background:var(--surface-2)}
.trow.done .row-t{color:var(--ink-2)}
.trow.late .row-s{color:var(--warn)}
.sugg .chips{justify-content:center;margin:14px 0 12px}
.empty .btn{margin:0 auto}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Accueil */
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa{display:flex;align-items:center;gap:10px;min-height:68px;padding:12px;text-align:left;font-weight:600;line-height:1.2;color:var(--ink);transition:background .12s,border-color .12s}
.qa .ic{color:var(--accent)}
.qa small{display:block;font-weight:400;font-size:13px;color:var(--ink-2);margin-top:2px}
.qa:active{background:var(--surface-2)}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--info-soft);color:var(--ink)}
.banner .ic{color:var(--info)}
.banner.ro{background:var(--warn-soft)}
.banner.ro .ic{color:var(--warn)}
.tl-day{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding:6px 2px 0}

/* Jauges et chiffres : la repousse en Vert pousse, la pâture en paille */
.gauge{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.gauge>i{display:block;height:100%;border-radius:99px;background:var(--pousse)}
.gauge.graze>i{background:var(--hay)}
.gauge.over>i{background:var(--danger)}
.big{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.unit{font-size:15px;color:var(--ink-2);font-family:var(--f-body)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:27px;line-height:1.05;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
.stat span{font-size:13px;color:var(--ink-2);line-height:1.2;display:block}

/* Prés */
.pcard{display:flex;flex-direction:column;gap:10px;padding:14px}
.pcard-h{display:flex;align-items:flex-start;gap:10px;border:0;background:transparent;padding:0;text-align:left;width:100%;color:var(--ink)}
.pcard-h .row-t{font-family:var(--f-display);font-size:23px;font-weight:600}
.pnums{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pcard .btn{align-self:flex-start}

/* Rations */
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:var(--hay-soft);color:var(--hay-ink);font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.12em;text-transform:uppercase}
.meal-h span{font-family:var(--f-display);font-size:14px;letter-spacing:.06em;font-weight:600}
.feed{display:flex;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);align-items:flex-start;width:100%;text-align:left;background:transparent;color:var(--ink)}
.feed:first-of-type{border-top:0}
.feed ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.feed li{background:var(--surface-2);border-radius:8px;padding:3px 9px;font-size:15px}
.feed li b{font-variant-numeric:tabular-nums}

/* Fiche */
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);margin:0}
.dl dt,.dl dd{margin:0;padding:11px 14px;border-top:1px solid var(--line)}
.dl dt{color:var(--ink-2);font-size:14px}
.dl dd{font-weight:600;text-align:right;overflow-wrap:anywhere}
.dl dt:first-of-type,.dl dt:first-of-type+dd{border-top:0}

/* Concours et séances */
.ccard{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;color:var(--ink)}
.ccard:first-child{border-top:0}
.ccard:active{background:var(--surface-2)}
.dblock{width:54px;flex:none;text-align:center;border-radius:12px;background:var(--accent-soft);color:var(--accent-strong);padding:6px 0 7px;display:flex;flex-direction:column;align-items:center}
.dblock b{font-family:var(--f-display);font-size:27px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.dblock span{font-family:var(--f-display);font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.rank{font-family:var(--f-display);font-weight:600;font-size:27px;line-height:1;color:var(--accent)}
.rank small{font-family:var(--f-body);font-size:13px;color:var(--ink-2);font-weight:400}

/* Foin */
.hero{padding:16px;display:flex;flex-direction:column;gap:6px}
.hero .big{font-size:48px;color:var(--accent)}
.bale-row{display:flex;align-items:center;gap:10px;padding-top:10px;margin-top:4px;border-top:1px solid var(--line)}
.bale-row .big{font-size:30px;min-width:2ch;text-align:right;color:var(--ink)}
.stepbtn{width:48px;height:48px;border-radius:14px;border:var(--bw) solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--accent);flex:none;transition:background .12s}
.stepbtn.out{background:var(--hay-soft);border-color:transparent;color:var(--hay-ink)}
.stepbtn:active{filter:brightness(.94)}

/* Boutons et commandes */
.btn{min-height:48px;padding:0 18px;border-radius:var(--r-sm);border:var(--bw) solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink);transition:background .12s,filter .12s}
.btn .ic{color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary .ic{color:inherit}
.btn.danger,.btn.armed{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn.danger .ic,.btn.armed .ic{color:inherit}
.btn.small{min-height:44px;padding:0 14px;font-size:15px}
.btn:active{filter:brightness(.94)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border:0;border-radius:11px;background:transparent;font-weight:500;color:var(--ink-2);font-size:15px;padding:0 6px;min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.seg.scroll{position:relative;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.seg.scroll::-webkit-scrollbar{display:none}
.seg.scroll button{flex:0 0 auto;padding:0 12px;font-size:14.5px}
.empty{padding:20px 18px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:17px;font-weight:600}
.menu{display:flex;flex-direction:column;gap:8px}

/* Onglets : pastille Menthe sous l'icône active */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{height:var(--tab-h);border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-2);font-size:12px;font-weight:500;min-width:0}
.tab-ic{display:grid;place-items:center;width:54px;height:30px;border-radius:999px;transition:background .15s}
.tabs button[aria-current="page"]{color:var(--accent-strong);font-weight:600}
.tabs button[aria-current="page"] .tab-ic{background:var(--accent-soft)}
.tabs button[aria-current="page"] .ic{stroke-width:2.4}
.tabs button[aria-current="page"] .ic.solid .i-leaf{opacity:1;fill:var(--logo-leaf)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));z-index:24;width:60px;height:60px;border-radius:var(--r);border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--float);transition:transform .12s}
.fab .ic{width:30px;height:30px;stroke-width:2.4}
.fab:active{transform:scale(.95)}

/* Feuille (formulaires) */
.sheet-root{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
.sheet::before{content:"";width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center;margin-top:8px;flex:none}
.sheet-root.open .scrim{opacity:1}
.sheet-root.open .sheet{transform:none}
.sheet-h{display:flex;align-items:center;gap:8px;padding:4px max(10px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));flex:none}
.sheet-h h2{flex:1;margin:0;font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1}
.sheet-b{overflow:auto;overscroll-behavior:contain;padding:6px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));flex:1;min-height:0}
.sheet-f{display:flex;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg);flex:none}
.sheet-f .btn{flex:1}
.sheet-f .btn.ghost{flex:0 1 auto;background:transparent;border-color:transparent;color:var(--danger);padding:0 10px}
.sheet-f .btn.ghost .ic{color:inherit}
.sheet-f .btn.ghost.armed{background:var(--danger-soft);flex:1}

/* Formulaires */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.flabel{font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:var(--r-sm);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;min-width:0}
.field input[type="date"],.field input[type="time"]{-webkit-appearance:none;appearance:none;display:block}
.field textarea{min-height:84px;resize:vertical;line-height:1.4}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.hint{font-size:13px;color:var(--ink-2);line-height:1.35}
.err{color:var(--danger);font-size:15px;font-weight:600;margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:var(--bw) solid var(--line);background:var(--surface);font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-align:left;transition:background .12s,border-color .12s}
.chip .ic{color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip[aria-pressed="true"] .ic{color:inherit}
.chip small{display:block;font-weight:400;font-size:12px;opacity:.85;line-height:1.15}
.chip .two{display:flex;flex-direction:column;line-height:1.15;padding:5px 0}
.chip .av.s{margin-left:-9px}
.chip.col{width:46px;padding:0;justify-content:center}
.chip.col[aria-pressed="true"]{background:var(--surface);border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.sw{width:24px;height:24px;border-radius:8px;display:block}
.box{background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.box.danger{background:var(--danger-soft)}
.box.warn{background:var(--warn-soft)}
.box.ok{background:var(--accent-soft)}
.issue{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.35}
.issue .ic{margin-top:1px}
.issue.danger .ic{color:var(--danger)} .issue.warn .ic{color:var(--warn)} .issue.ok .ic{color:var(--accent)} .issue.info .ic{color:var(--info)}
.code{width:100%;min-height:160px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border-radius:var(--r-sm);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:10px}
.rinput{width:84px;min-height:44px;padding:8px 10px;border-radius:12px;border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;text-align:right;flex:none;min-width:0}
.rinput:focus{outline:none;border-color:var(--accent)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* Message bref */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 90px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:var(--r-sm);display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--float);font-weight:600;font-size:15px;min-height:48px}
.toast.danger{background:var(--danger);color:var(--surface)}
.toast button{background:transparent;border:0;color:inherit;text-decoration:underline;font-weight:600;min-height:40px;padding:0 10px;flex:none}
body.lock .toast{top:calc(env(safe-area-inset-top,0px) + 10px);bottom:auto}

@media (max-width:350px){.quick,.grid2{grid-template-columns:minmax(0,1fr)}.stat{padding:8px}.stat b{font-size:21px}.top h1{font-size:28px}.tab-ic{width:46px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Version installable : marges des barres système et écran de connexion */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
.auth{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 32px) calc(env(safe-area-inset-bottom,0px) + 32px)}
.auth-in{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.auth-in .brand-logo{width:min(250px,72%);align-self:center}
.auth-t{font-family:var(--f-display);font-weight:600;font-size:28px;margin:0}
.auth p{margin:0}
.auth-links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.auth .btn[disabled]{opacity:.6}
</style>

</head>

<script>/* Pont hors Claude : même interface que window.claude, servie par Firebase (voir firebase.js) */
window.EQ_MODE = true;
window.claude = (() => {
  const waits = {};
  const SERVED = ['db', 'user', 'downloads'];
  const slot = n => waits[n] || (waits[n] = (() => { let r; const p = new Promise(res => { r = res; }); p._r = r; return p; })());
  return {
    use: n => SERVED.includes(n) ? slot(n) : Promise.resolve(null),
    _resolve: (n, v) => slot(n)._r(v)
  };
})();
/* Téléchargement direct d'un fichier (sauvegarde) */
window.claude._resolve('downloads', {
  save: ({ filename, data }) => new Promise(res => {
    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    res({ status: 'saved' });
  })
});
</script>

  if (!validISO(iso)) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const [ty, tm, td] = todayISO().split('-').map(Number);
  const months = (ty - y) * 12 + (tm - m) - (td < d ? 1 : 0);
  if (months < 0) return '';
  if (months < 24) return `${months} mois`;
  return `${Math.floor(months / 12)} ans`;
}

/* Symbole seul (en-tête) ; couleurs portées par le thème : --logo-ink et --logo-leaf */
const brandMark = (cls = '') => `<svg class="brand-mark ${cls}" viewBox="${BRAND.markVB}" aria-hidden="true" focusable="false"><path class="lg-leaf" d="${BRAND.markLeaf}"/><path class="lg-ink" d="${BRAND.markHorse}"/></svg>`;
/* Logo complet : symbole, EquiValdi, Carnet d'écurie */
const brandLogo = (cls = '') => `<svg class="brand-logo ${cls}" viewBox="${BRAND.logoVB}" role="img" aria-label="EquiValdi, carnet d'écurie" focusable="false">${BRAND.logo.map(([k, d]) => `<path class="lg-${k}" d="${d}"/>`).join('')}</svg>`;
/* Icône d'onglet « Chevaux » tirée du symbole */
ICONS.horse = `<path class="i-leaf" d="${BRAND.markLeaf}"/><path d="${BRAND.markHorse}"/>`;
ICON_VB.horse = BRAND.markVB;

/* ---------- Données : copie locale + base de l'artifact ---------- */
const COLS = ['chevaux', 'soins', 'pres', 'places', 'entretiens', 'foin', 'concours', 'seances', 'taches'];
const S = { chevaux: {}, soins: {}, pres: {}, places: {}, entretiens: {}, foin: {}, concours: {}, seances: {}, taches: {}, cfg: null };
const CACHE_KEY = 'carnet-ecurie:cache:v1';
const OUTBOX_KEY = 'carnet-ecurie:outbox:v1';
const UI_KEY = 'carnet-ecurie:ui:v1';
let outbox = [];
let DB = null;
const sync = { mode: 'loading', error: null, loaded: new Set(), readOnly: false };

/* Qui utilise le carnet (partage à plusieurs) */
const me = { uid: null, owner: null, platformName: '' };
const MOI_KEY = 'carnet-ecurie:moi:v1';
let moiMem = '';
function getMoi() {
  try { const v = JSON.parse(localStorage.getItem(MOI_KEY) || 'null'); if (v && typeof v.nom === 'string' && v.nom) return v.nom; } catch (e) { /* stockage indisponible */ }
  return moiMem;
}
function setMoi(n) { moiMem = n; try { localStorage.setItem(MOI_KEY, JSON.stringify({ nom: n })); } catch (e) { /* gardé pour cette visite */ } }
const RO_MSG = window.EQ_MODE
  ? "Tu as un accès en lecture seule. Demande à la gérante du carnet de te passer en « Peut modifier »."
  : "Tu as un accès en lecture seule. Demande à la personne qui gère le carnet de te donner le droit « Peut modifier ».";
function setReadOnly() { if (sync.readOnly) return; sync.readOnly = true; rerenderSoon(); }
async function connectUser() {
  let u = null;
  try { u = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('user') : null; } catch (e) { u = null; }
  if (!u) return;
  try { const m = await u.me(); me.uid = m.id || null; me.platformName = m.name || ''; me.owner = !!m.isOwner; } catch (e) { /* inconnu */ }
  try { if ((await u.can('data.write')) === false && !me.owner) setReadOnly(); } catch (e) { /* inconnu : on laisse les écritures décider */ }
  rerenderSoon();
}
/* Recharge un document depuis le carnet en ligne (après un refus d'écriture) */
async function resync(op) {
  if (!DB) return;
  try {
    if (op.coll === 'config') { const s = await DB.doc('config/reglages').get(); S.cfg = s.exists ? clone(s.data()) : null; }
    else {
      const s = await DB.collection(op.coll).doc(op.id).get();
      if (s.exists) { const o = clone(s.data()); o.id = s.id; S[op.coll][op.id] = o; } else delete S[op.coll][op.id];
    }
    saveCache();
    rerenderSoon();
  } catch (e) { /* on réessaiera au prochain chargement */ }
}

function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }

function loadCache() {
  const c = lsGet(CACHE_KEY);
  if (c && typeof c === 'object') {
    COLS.forEach(k => { S[k] = (c[k] && typeof c[k] === 'object') ? c[k] : {}; });
    S.cfg = c.cfg || null;
  }
  const o = lsGet(OUTBOX_KEY);
  outbox = Array.isArray(o) ? o : [];
  // les modifications pas encore envoyées restent prioritaires
  outbox.forEach(applyOp);
}
let cacheTimer = null;
function saveCache() {
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    const o = { cfg: S.cfg };
    COLS.forEach(k => { o[k] = S[k]; });
    lsSet(CACHE_KEY, o);
  }, 200);
}
const saveOutbox = () => lsSet(OUTBOX_KEY, outbox);

function applyOp(o) {
  if (o.coll === 'config') { S.cfg = o.op === 'set' ? o.data : null; return; }
  if (!S[o.coll]) return;
  if (o.op === 'set') S[o.coll][o.id] = o.data; else delete S[o.coll][o.id];
}

/* Lecture */
const list = coll => Object.values(S[coll] || {});
const get = (coll, id) => (S[coll] || {})[id];

/* Écriture : immédiate en local, envoyée ensuite dans l'ordre */
function put(coll, obj) {
  const o = clone(obj);
  if (!o.id) o.id = uid();
  o.maj = Date.now();
  S[coll][o.id] = o;
  queue(coll, o.id, 'set', o);
  return o;
}
function del(coll, id) {
  if (!S[coll][id]) return;
  delete S[coll][id];
  queue(coll, id, 'del', null);
}

}
function queue(coll, id, op, data) {
  const k = coll + '/' + id;
  outbox = outbox.filter(o => o.k !== k);
  outbox.push({ k, coll, id, op, data: data ? clone(data) : null });
  saveOutbox();

  updateSync();

}

let flushing = false, flushTimer = null, backoff = 2000;
function flushSoon(ms = 300) {
  if (!DB) return;
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, ms);
}
async function flush() {
  if (!DB || flushing) return;
  flushing = true;
  try {
    while (outbox.length && DB) {
      const op = outbox[0];
      try {
        const ref = DB.collection(op.coll).doc(op.id);
        if (op.op === 'set') await ref.set(op.data); else await ref.delete();
        outbox = outbox.filter(o => o !== op);
        saveOutbox();
        backoff = 2000;
        sync.error = null;
      } catch (e) {
        const code = e && e.code;
        if (code === 'invalid_argument' || code === 'quota_exceeded' || code === 'transform_error') {
          outbox = outbox.filter(o => o !== op);
          saveOutbox();
          resync(op);
          if (code === 'invalid_argument' && !me.owner) {
            setReadOnly();
            sync.error = RO_MSG;
          } else {
            sync.error = code === 'quota_exceeded'
              ? "Stockage plein : supprime d'anciens mouvements pour continuer."
              : "Une modification n'a pas pu être enregistrée en ligne.";
          }
          toast(sync.error, { danger: true });
        } else if (['revoked', 'not_granted', 'capability_disabled', 'capability_removed'].includes(code)) {
          DB = null;
          sync.mode = 'local';
          break;
        } else {
          clearTimeout(flushTimer);
          flushTimer = setTimeout(flush, backoff);
          backoff = Math.min(backoff * 2, 60000);
          break;
        }
      }
    }
  } finally {
    flushing = false;
    updateSync();
  }
}

function onSnap(coll, snap) {
  const partial = snap.metadata && snap.metadata.fromCache;
  const next = partial ? Object.assign({}, S[coll]) : {};
  snap.docs.forEach(d => { if (d.exists) { const o = clone(d.data()); o.id = d.id; next[d.id] = o; } });
  S[coll] = next;
  outbox.filter(o => o.coll === coll).forEach(applyOp);
  if (!partial) sync.loaded.add(coll);
  saveCache();
  rerenderSoon();
}
function onSnapErr(make, err) {
  const code = err && err.code;
  if (code === 'revoked') { DB = null; sync.mode = 'local'; updateSync(); return; }
  if (code === 'unavailable') setTimeout(make, 5000);
}
function subscribe(coll) {
  const make = () => {
    if (!DB) return;
    try { DB.collection(coll).onSnapshot(s => onSnap(coll, s), e => onSnapErr(make, e)); } catch (e) { /* ignoré */ }
  };
  make();
}
function subscribeCfg() {
  const make = () => {
    if (!DB) return;
    try {
      DB.doc('config/reglages').onSnapshot(snap => {
        if (outbox.some(o => o.k === 'config/reglages')) return;
        if (snap.exists) S.cfg = clone(snap.data());
        else if (!(snap.metadata && snap.metadata.fromCache)) S.cfg = null;
        saveCache();
        rerenderSoon();
      }, e => onSnapErr(make, e));
    } catch (e) { /* ignoré */ }
  };
  make();
}
async function connect() {
  let db = null;
  try { db = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { sync.mode = 'local'; updateSync(); rerenderSoon(); return; }
  DB = db;
  connectUser();
  sync.mode = 'cloud';
  COLS.forEach(subscribe);
  subscribeCfg();
  flushSoon(50);
  updateSync();
}
window.addEventListener('online', () => flushSoon(100));
document.addEventListener('visibilitychange', () => { if (!document.hidden) { flushSoon(100); rerenderSoon(); } });

function updateSync() {

/* ---------- Soins & rappels ---------- */

/* Un rappel n'apparaît qu'à partir du premier soin enregistré de ce type */
function rappels(hid) {
  const R = cfg().rappels, t = todayISO(), out = [];
  const hs = hid ? [cheval(hid)].filter(Boolean) : chevaux();
  for (const h of hs) {
    const ss = soinsDe(h.id);
    for (const T of SOINS) {
      const iv = R[T.id];
      if (!iv) continue;
      const faits = ss.filter(s => s.statut !== 'prevu' && soinTypes(s).includes(T.id)).sort((a, b) => b.date.localeCompare(a.date));
      const last = faits[0];
      if (!last) continue;
      const due = validISO(last.prochain) ? last.prochain : addDays(last.date, iv);
      const planned = ss.filter(s => s.statut === 'prevu' && soinTypes(s).includes(T.id) && s.date >= last.date)
        .sort((a, b) => a.date.localeCompare(b.date))[0] || null;
      out.push({ h, type: T, last, due, planned, days: diffDays(t, due) });
    }
  }

}
function rappelPill(r) {

  if (r.planned) return `<span class="pill info">${ic('cal')}RDV ${dShort(r.planned.date)}</span>`;

  if (r.days <= A) return `<span class="pill warn">${r.days === 0 ? "Aujourd'hui" : 'Dans ' + nJ(r.days)}</span>`;

}

/* ---------- Prés & rotation ---------- */
const pres = (all = false) => list('pres').filter(p => all || !p.archive).sort(byName);
const openPlace = hid => list('places').find(p => p.horseId === hid && !p.fin) || null;
function horseWhere(hid) {
  const o = openPlace(hid);
  if (!o) return { txt: 'Au box', pre: null, place: null };
  const p = get('pres', o.preId);
  return { txt: p ? p.nom : 'Pré supprimé', pre: p || null, place: o };
}
/* Périodes d'occupation continues d'un pré (fusion des séjours de chaque cheval) */
function segments(preId) {
  const t = todayISO();
  const recs = list('places').filter(p => p.preId === preId && validISO(p.debut))
    .map(p => ({ a: p.debut, b: p.fin || t, open: !p.fin, h: p.horseId }))
    .sort((x, y) => x.a.localeCompare(y.a));
  const segs = [];
  for (const r of recs) {
    const last = segs[segs.length - 1];
    if (last && r.a <= last.b) {
      if (r.b > last.b) last.b = r.b;
      last.open = last.open || r.open;
      last.horses.add(r.h);
    } else segs.push({ a: r.a, b: r.b, open: r.open, horses: new Set([r.h]) });
  }
  return segs;
}
function preStatus(p) {
  const C = cfg(), t = todayISO();
  const cible = p.repos || C.repos, max = p.paturage || C.paturage;
  const segs = segments(p.id);
  const last = segs[segs.length - 1];
  if (last && last.open) {
    const horses = list('places').filter(x => x.preId === p.id && !x.fin).map(x => x.horseId);
    const days = diffDays(last.a, t);
    return { occupe: true, depuis: last.a, days, horses, max, cible, over: days > max };
  }
  if (!last) return { occupe: false, jamais: true, pret: true, repos: null, cible, max };
  const repos = diffDays(last.b, t);
  return { occupe: false, depuis: last.b, repos, cible, max, pret: repos >= cible };
}
function joursPatures(preId, depuis) {
  return segments(preId).reduce((acc, g) => {
    const a = g.a < depuis ? depuis : g.a;
    return acc + Math.max(0, diffDays(a, g.b));
  }, 0);
}
/* Pré conseillé : le plus reposé, de préférence ayant atteint sa cible */
function prePret(exclude) {
  const c = pres().filter(p => p.id !== exclude).map(p => ({ p, s: preStatus(p) })).filter(x => !x.s.occupe);
  c.sort((a, b) => (b.s.pret - a.s.pret) || ((b.s.repos ?? 9999) - (a.s.repos ?? 9999)));
  return c[0] || null;
}
/* Déplacer des chevaux (preId null = au box). Renvoie un message d'erreur ou une fonction d'annulation */
function moveHorses(hids, preId, date) {
  for (const hid of hids) {
    const o = openPlace(hid);
    if (o && o.debut > date) return { err: `${hNom(hid)} est arrivé dans son pré le ${dFull(o.debut)}, après cette date.` };
  }
  const before = [], created = [];
  for (const hid of hids) {
    const o = openPlace(hid);
    if (o && o.preId === preId) continue;
    if (o) {
      before.push(clone(o));
      if (o.debut === date) del('places', o.id); else put('places', Object.assign({}, o, { fin: date }));
    }
    if (preId) created.push(put('places', { horseId: hid, preId, debut: date, fin: null }).id);
  }
  return {
    n: before.length + created.length ? hids.length : 0,
    undo: () => { created.forEach(id => del('places', id)); before.forEach(o => put('places', o)); }
  };
}

/* ---------- Foin ---------- */
function stock() {
  const C = cfg(), by = {};
  C.balles.forEach(b => { by[b.id] = { b, n: 0, kgIn: 0, nIn: 0 }; });
  list('foin').forEach(m => {
    let x = by[m.balle];
    if (!x) x = by[m.balle] = { b: { id: m.balle, nom: m.balle || 'Balle', poids: m.poids || 0 }, n: 0, kgIn: 0, nIn: 0, orphan: true };
    const nb = Number(m.nb) || 0;
    if (m.sens === 'in') { x.n += nb; x.nIn += nb; x.kgIn += nb * (m.poids || x.b.poids || 0); } else x.n -= nb;
  });
  let kg = 0;
  Object.values(by).forEach(x => {
    x.poidsMoy = x.nIn ? x.kgIn / x.nIn : (x.b.poids || 0);
    x.kg = Math.max(0, x.n) * x.poidsMoy;
    kg += x.kg;
  });
  return { by, kg };
}
const estFoin = l => /foin/i.test(l.aliment || '');
function kgLigne(l) {
  const q = Number(l.qte);
  if (!Number.isFinite(q)) return null;
  if (l.unite === 'kg') return q;
  if (l.unite === 'g') return q / 1000;
  return null;
}
const nbRepas = l => Math.max(1, (l.repas || []).length);
function consoRations() {
  let kg = 0;
  chevaux().forEach(h => (h.ration || []).forEach(l => { if (estFoin(l)) { const q = kgLigne(l); if (q != null) kg += q * nbRepas(l); } }));
  return kg;
}
function consoReelle(st) {
  const t = todayISO();
  const outs = list('foin').filter(m => m.sens === 'out' && validISO(m.date));
  if (!outs.length) return null;
  const first = outs.reduce((a, m) => (m.date < a ? m.date : a), t);
  const span = Math.min(30, diffDays(first, t));
  if (span < 14) return null;
  const from = addDays(t, -span);
  let kg = 0;
  outs.forEach(m => { if (m.date > from && m.date <= t) { const x = st.by[m.balle]; kg += (Number(m.nb) || 0) * (x ? x.poidsMoy : 0); } });
  return kg / span;
}
function autonomie() {
  const st = stock(), C = cfg(), t = todayISO();
  const reel = consoReelle(st), rat = consoRations();
  const rate = reel != null && reel > 0 ? reel : (rat > 0 ? rat : null);
  const src = reel != null && reel > 0 ? 'reel' : 'rations';
  let fin = `${t.slice(0, 4)}-${C.finSaison}`;
  if (!validISO(fin) || fin <= t) fin = `${+t.slice(0, 4) + 1}-${C.finSaison}`;
  const joursSaison = diffDays(t, fin);
  return {
    st, reel, rat, rate, src, finSaison: fin, joursSaison,
    days: rate ? st.kg / rate : null,
    besoin: rate ? rate * joursSaison : null,
    solde: rate ? st.kg - rate * joursSaison : null
  };
}
function balleRef(st) {
  const xs = Object.values(st.by).filter(x => x.poidsMoy > 0);
  xs.sort((a, b) => b.kg - a.kg);
  return xs[0] || null;
}

const engLabel = id => (ENGAGEMENT.find(n => n.id === id) || {}).label || '';

/* Contrôle vaccinal à la date du concours (règles FFE / SHF / FEI) */
function vacCheck(c) {
  const out = [];
  if (!c.horseId || !validISO(c.date) || c.niveau === 'autre') return out;
  const ss = soinsDe(c.horseId).filter(s => validISO(s.date) && s.date <= c.date);
  const last = type => ss.filter(s => soinTypes(s).includes(type)).sort((a, b) => b.date.localeCompare(a.date))[0];
  const fei = c.niveau === 'fei';
  const g = last('grippe');
  if (!g) out.push({ sev: 'warn', short: 'Grippe non renseignée', msg: "Aucun vaccin grippe enregistré pour ce cheval : il est obligatoire en compétition." });
  else {
    const d = diffDays(g.date, c.date), lim = fei ? 203 : 365;
    const prevu = g.statut === 'prevu' ? ' (prévu)' : '';
    if (d > lim) out.push({ sev: 'danger', short: 'Grippe expirée', msg: `Dernier vaccin grippe le ${dFull(g.date)}${prevu} : plus de ${fei ? '6 mois + 21 jours' : '12 mois'} avant le concours.` });
    else out.push({ sev: 'ok', short: 'Grippe OK', msg: `Vaccin grippe du ${dFull(g.date)}${prevu} : valable à la date du concours.` });
  }
  if (['amateur', 'pro', 'shf'].includes(c.niveau)) {
    const r = last('rhino');
    if (!r) out.push({ sev: 'warn', short: 'Rhino non renseignée', msg: `La rhinopneumonie est obligatoire en ${nivLabel(c.niveau)} : aucun vaccin enregistré.` });
    else if (diffDays(r.date, c.date) > 365) out.push({ sev: 'danger', short: 'Rhino expirée', msg: `Dernier vaccin rhinopneumonie le ${dFull(r.date)} : plus de 12 mois avant le concours.` });
    else out.push({ sev: 'ok', short: 'Rhino OK', msg: `Vaccin rhinopneumonie du ${dFull(r.date)} : valable à la date du concours.` });
  }
  const recent = ss.filter(s => soinTypes(s).some(t => soinType(t).vac)).map(s => ({ s, d: diffDays(s.date, c.date) })).filter(x => x.d <= 7)
    .sort((a, b) => a.d - b.d)[0];
  if (recent) {
    out.unshift(recent.d <= 6
      ? { sev: 'danger', short: 'Vaccin < 7 jours', msg: `Injection le ${dFull(recent.s.date)}, ${nJ(recent.d)} avant le concours : aucune injection n'est admise dans les 7 jours qui précèdent.` }
      : { sev: 'warn', short: 'Vaccin à 7 jours', msg: `Injection le ${dFull(recent.s.date)}, pile 7 jours avant : vérifie le délai auprès de l'organisateur.` });
  }
  return out;
}
function statsConcours(hid) {

  return { sorties: cs.length, podiums: ranks.filter(n => n <= 3).length, victoires: ranks.filter(n => n === 1).length, best: ranks.length ? Math.min(...ranks) : null };
}

};

/* ---------- Tâches partagées ---------- */
const taches = () => list('taches').sort((a, b) => String(a.titre || '').localeCompare(String(b.titre || ''), 'fr'));
const faitsDe = tk => (Array.isArray(tk.fait) ? tk.fait : []).filter(f => f && validISO(f.d))
  .sort((a, b) => b.d.localeCompare(a.d) || (b.t || 0) - (a.t || 0));
/* done = fait pour la période en cours ; retard = jours de retard (0 = à faire aujourd'hui) */
function tacheEtat(tk) {
  const t = todayISO(), fs = faitsDe(tk), last = fs[0] || null;
  if (tk.freq === 'une') {
    if (last) return { done: true, last, visible: last.d >= t, n: 0 };
    const due = validISO(tk.date) ? tk.date : null;
    const days = due ? diffDays(t, due) : null;
    return { done: false, last: null, due, days, retard: days != null && days < 0 ? -days : 0, visible: true, n: 0 };
  }
  const n = tk.freq === 'jours' ? Math.max(1, Math.round(Number(tk.n) || 1)) : 1;
  if (!last) return { done: false, last: null, visible: true, n, retard: 0 };

/* ---------- Photo des chevaux : choix, cadrage carré, vignette ---------- */
const PHOTO_PX = 320;      // côté de la vignette enregistrée
const WORK_MIN = 1600;     // les grandes photos sont réduites avant cadrage

function photoField(h, big = false) {
  const has = hasPhoto(h);
  return `<div class="field">
    <span class="flabel">Photo</span>
    <div class="pf${big ? ' lg' : ''}">
      <div class="pf-frame">
        <canvas id="pfCanvas" tabindex="0" aria-label="Cadrage de la photo : fais glisser pour déplacer, ou utilise les flèches du clavier"${has ? '' : ' hidden'}></canvas>
        <label for="f_photo" class="pf-empty" id="pfEmpty"${has ? ' hidden' : ''}>${ic('camera')}<span>Ajouter une photo</span></label>
      </div>
      <div class="pf-side">
        <label for="f_photo" class="btn small" id="pfPick">${ic('camera', 'sm')}<span>${has ? 'Changer' : 'Choisir une photo'}</span></label>
        <button type="button" class="btn small" id="pfDel"${has ? '' : ' hidden'}>${ic('trash', 'sm')}<span>Retirer</span></button>
      </div>
    </div>
    <div class="pf-zoom" id="pfZoomW"${has ? '' : ' hidden'}>
      <input type="range" class="range" id="pfZoom" min="1" max="4" step="0.01" value="1" aria-label="Zoom de la photo">
      <small class="hint">Fais glisser la photo pour la cadrer. Zoom : curseur ou deux doigts.</small>
    </div>
    <input type="file" id="f_photo" accept="image/*" class="vh" tabindex="-1" aria-hidden="true">
    <p class="err" id="pfErr" role="alert" hidden></p>
  </div>`;
}

const newCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
const ctx2d = c => { const x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; return x; };

/* Réduit une très grande image (par paliers, pour rester net) */
function shrink(img, w, h) {
  const m = Math.min(w, h);
  if (m <= WORK_MIN) return { img, w, h };
  const fw = Math.round(w * WORK_MIN / m), fh = Math.round(h * WORK_MIN / m);
  let src = img, cw = w, ch = h;
  while (cw / 2 > fw) {
    const t = newCanvas(cw / 2, ch / 2);
    ctx2d(t).drawImage(src, 0, 0, t.width, t.height);
    src = t; cw = t.width; ch = t.height;
  }
  const out = newCanvas(fw, fh);
  ctx2d(out).drawImage(src, 0, 0, fw, fh);
  if (img.close) { try { img.close(); } catch (e) { /* déjà libérée */ } }
  return { img: out, w: fw, h: fh };
}
async function decodeImage(file) {
  if (file.type && !/^image\//.test(file.type)) throw new Error('pas une image');
  let r = null;
  if (window.createImageBitmap) {
    try { const bm = await createImageBitmap(file, { imageOrientation: 'from-image' }); r = { img: bm, w: bm.width, h: bm.height }; } catch (e) { r = null; }
  }
  if (!r) {
    const url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); });
    const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    r = { img: im, w: im.naturalWidth, h: im.naturalHeight };
  }
  if (!r.w || !r.h) throw new Error('image vide');
  return shrink(r.img, r.w, r.h);
}
/* Dessine le carré choisi de l'image dans ctx, réduit par paliers */
function drawCrop(ctx, st, size) {
  let src = st.img, s = Math.min(st.w, st.h) / st.zoom, sx = st.cx - s / 2, sy = st.cy - s / 2;
  while (s / 2 > size) {
    const t = newCanvas(s / 2, s / 2);
    ctx2d(t).drawImage(src, sx, sy, s, s, 0, 0, t.width, t.height);
    src = t; sx = 0; sy = 0; s = t.width;
  }
  ctx.drawImage(src, sx, sy, s, s, 0, 0, size, size);
}
function encodePhoto(st) {
  let size = PHOTO_PX, q = 0.82, out = '';
  for (let i = 0; i < 3; i++) {
    const c = newCanvas(size, size), x = ctx2d(c);
    x.fillStyle = '#ffffff';
    x.fillRect(0, 0, size, size);
    drawCrop(x, st, size);
    out = c.toDataURL('image/jpeg', q);
    if (out.length < 90000) break;
    size = Math.round(size * 0.8);
    q -= 0.12;
  }
  return out;
}

/* Branche le cadrage sur le formulaire ouvert ; renvoie l'accès au résultat */
function mountPhoto(h) {
  const cv = $('#pfCanvas'), input = $('#f_photo'), zoomEl = $('#pfZoom');
  const st = { img: null, w: 0, h: 0, zoom: 1, cx: 0, cy: 0, changed: false, loading: false };
  const side = () => Math.min(st.w, st.h) / st.zoom;
  const err = msg => { const e = $('#pfErr'); e.textContent = msg || ''; e.hidden = !msg; };
  function clamp() {
    const s2 = side() / 2;
    st.cx = Math.min(Math.max(st.cx, s2), st.w - s2);
    st.cy = Math.min(Math.max(st.cy, s2), st.h - s2);
  }
  function draw() {
    if (!st.img || !cv.isConnected) return;
    const wCss = cv.getBoundingClientRect().width;
    if (!wCss) return;
    const px = Math.round(wCss * Math.min(3, window.devicePixelRatio || 1));
    if (cv.width !== px) { cv.width = px; cv.height = px; }
    const x = ctx2d(cv), s = side();
    x.clearRect(0, 0, px, px);
    x.drawImage(st.img, st.cx - s / 2, st.cy - s / 2, s, s, 0, 0, px, px);
  }
  function show(has) {
    cv.hidden = !has;
    $('#pfEmpty').hidden = has;
    $('#pfDel').hidden = !has;
    $('#pfZoomW').hidden = !has;
    $('#pfPick span').textContent = has ? 'Changer' : 'Choisir une photo';
  }
  function setImage(r) {
    Object.assign(st, { img: r.img, w: r.w, h: r.h, zoom: 1, cx: r.w / 2, cy: r.h / 2 });
    zoomEl.value = '1';
    show(true);
    requestAnimationFrame(draw);
  }
  if (hasPhoto(h)) {
    const im = new Image();
    im.onload = () => { if (!st.changed) setImage({ img: im, w: im.naturalWidth, h: im.naturalHeight }); };
    im.src = h.photo;
  }
  input.addEventListener('change', async () => {
    const f = input.files && input.files[0];
    input.value = '';
    if (!f) return;
    err('');
    st.loading = true;
    $('#pfPick span').textContent = 'Ouverture…';
    try {
      setImage(await decodeImage(f));
      st.changed = true;
    } catch (e) {
      show(!!st.img);
      err("Cette image n'a pas pu être ouverte. Choisis une photo JPEG ou PNG.");
    } finally { st.loading = false; }
  });
  $('#pfDel').addEventListener('click', () => {
    st.img = null;
    st.changed = true;
    show(false);
  });
  zoomEl.addEventListener('input', () => {
    st.zoom = Math.min(4, Math.max(1, Number(zoomEl.value) || 1));
    clamp(); draw(); st.changed = true;
  });
  /* Glisser pour déplacer, pincer pour zoomer */
  const pts = new Map();
  let g = null;
  const begin = () => {
    const a = [...pts.values()];
    g = { cx: st.cx, cy: st.cy, zoom: st.zoom, x: a[0].x, y: a[0].y, d: a.length > 1 ? Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) : 0 };
  };
  cv.addEventListener('pointerdown', e => {
    if (!st.img) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (x) { /* ignoré */ }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    begin();
  });
  cv.addEventListener('pointermove', e => {
    if (!g || !pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const a = [...pts.values()];
    if (a.length > 1 && g.d > 0) {
      st.zoom = Math.min(4, Math.max(1, g.zoom * Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) / g.d));
      zoomEl.value = String(st.zoom);
    } else {
      const k = side() / (cv.getBoundingClientRect().width || 1);
      st.cx = g.cx - (a[0].x - g.x) * k;
      st.cy = g.cy - (a[0].y - g.y) * k;
    }
    clamp(); draw(); st.changed = true;
  });
  const end = e => { pts.delete(e.pointerId); if (pts.size) begin(); else g = null; };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('keydown', e => {
    const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!m || !st.img) return;
    e.preventDefault();
    const step = side() * 0.05;
    st.cx += m[0] * step; st.cy += m[1] * step;
    clamp(); draw(); st.changed = true;
  });
  return {
    busy: () => st.loading,
    result: () => {
      if (!st.changed) return { changed: false };
      if (!st.img) return { changed: true, photo: null };
      return { changed: true, photo: encodePhoto(st) };
    }
  };
}

function alerts() {

    else if (r.days <= C.alerte) out.push({ sev: 'warn', icon: r.type.icon, t: `${r.h.nom} · ${r.type.short}`, s: `À prévoir ${dRel(r.due)} · dernier le ${dShort(r.last.date)}`, act, ord: r.days });
  });
  list('soins').filter(s => s.statut === 'prevu' && s.date < t && cheval(s.horseId) && !cheval(s.horseId).archive).forEach(s =>
    out.push({ sev: 'warn', icon: soinIcon(s), t: `${hNom(s.horseId)} · ${soinLabel(s)}`, s: `Rendez-vous du ${dShort(s.date)} : à confirmer`, act: `data-act="edit-soin" data-id="${s.id}"`, ord: diffDays(t, s.date) }));
  pres().forEach(p => {
    const st = preStatus(p);
    if (!st.occupe || !st.over) return;
    const nx = prePret(p.id);
    const tip = nx ? ` · ${nx.p.nom} ${nx.s.jamais ? 'est libre' : 'repose depuis ' + nJ(nx.s.repos)}` : '';
    out.push({ sev: 'warn', icon: 'fence', t: `${p.nom} · ${nJ(st.days)} de pâture`, s: `Maximum prévu : ${st.max} j${tip}`, act: `data-act="move-from" data-id="${p.id}"`, ord: st.max - st.days });
  });
  list('concours').forEach(c => {
    const h = cheval(c.horseId);
    if (!h || c.statut === 'forfait') return;
    const n = diffDays(t, c.date), nom = c.lieu || c.discipline || 'Concours';
    const act = `data-act="edit-concours" data-id="${c.id}"`;
    if (n >= 0 && n <= 45) {
      vacCheck(c).filter(i => i.sev === 'danger').forEach(i => out.push({ sev: 'danger', icon: 'syringe', t: `${h.nom} · ${nom} ${dShort(c.date)}`, s: i.msg, act, ord: n - 100 }));
      if (c.statut !== 'engage' && validISO(c.cloture)) {
        const k = diffDays(t, c.cloture);
        if (k <= 7) out.push({ sev: k < 0 ? 'danger' : 'warn', icon: 'rosette', t: `${h.nom} · ${nom} ${dShort(c.date)}`, s: k < 0 ? `Clôture des engagements passée (${dShort(c.cloture)})` : `Engagement à faire ${dRel(c.cloture)}`, act, ord: k });
      }
    }
    if (n < 0 && n >= -30 && !hasResult(c)) out.push({ sev: 'info', icon: 'rosette', t: `${h.nom} · ${nom}`, s: `Résultat du ${dShort(c.date)} à saisir`, act, ord: 50 });
  });
  list('seances').filter(s => s.statut === 'prevu' && validISO(s.date) && s.date < t && cheval(s.horseId) && !cheval(s.horseId).archive).forEach(s =>
    out.push({ sev: 'info', icon: 'timer', t: `${hNom(s.horseId)} · ${s.type || 'Séance'}${s.coach ? ' avec ' + s.coach : ''}`, s: `Séance prévue le ${dShort(s.date)} : à confirmer`, act: `data-act="edit-seance" data-id="${s.id}"`, ord: 40 }));
  const A = autonomie();
  if (A.rate && A.days != null && A.days < 30) out.push({ sev: A.days < 10 ? 'danger' : 'warn', icon: 'bale', t: `Foin : environ ${nJ(Math.floor(A.days))} de stock`, s: `Au rythme de ${num(A.rate, 0)} kg par jour`, act: 'data-act="go" data-tab="foin"', ord: A.days - 30 });
  const rank = { danger: 0, warn: 1, info: 2 };
  return out.sort((a, b) => rank[a.sev] - rank[b.sev] || a.ord - b.ord);
}
const rowAlert = a => `<button type="button" class="row sev-${a.sev}" ${a.act}>${lead(a.icon)}<div class="row-main"><div class="row-t">${esc(a.t)}</div><div class="row-s">${esc(a.s)}</div></div><span class="row-end">${ic('next', 'sm')}</span></button>`;

  const rap = R.length ? section('Prochains soins', `<div class="list">${R.map(rowRappel).join('')}</div>`, `<button type="button" class="link" data-act="seg" data-k="sub" data-v="soins">Tout voir ${ic('next', 'sm')}</button>`) : '';
  const lies = tachesTriees(tk => tk.horseId === h.id);
  const tks = lies.length ? section('Tâches', tachesListe(lies)) : '';
  const items = [
    ['Propriétaire', h.proprietaire ? `${h.proprietaire} (pension)` : ''],
    ['Naissance', h.naissance ? `${dFull(h.naissance)} · ${ageTxt(h.naissance)}` : ''],
    ['Sexe', h.sexe], ['Race', h.race], ['Robe', h.robe],
    ['Taille', h.taille ? `${num(h.taille, 0)} cm` : ''], ['Poids', h.poids ? `${num(h.poids, 0)} kg` : ''],
    ['N° SIRE / UELN', h.sire], ['Transpondeur', h.puce]
  ].filter(x => x[1]);
  const dl = items.length ? `<dl class="dl">${items.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`
    : empty('Fiche à compléter', 'Date de naissance, race, robe, n° SIRE, transpondeur…');
  const notes = h.notes ? `<div class="card"><div class="eyebrow">Notes</div><div style="white-space:pre-wrap">${esc(h.notes)}</div></div>` : '';
  return loc + tks + rap + section('Identité', dl + notes, `<button type="button" class="link" data-act="edit-cheval" data-id="${h.id}">${ic('edit', 'sm')}Modifier</button>`);
}

function rationHtml(h) {
  const lines = h.ration || [];
  const others = chevaux().some(x => x.id !== h.id && (x.ration || []).length);
  const actions = `<div class="btnrow"><button type="button" class="btn small primary" data-act="new" data-what="ration" data-hid="${h.id}">${ic('plus', 'sm')}Aliment</button>${others ? `<button type="button" class="btn small" data-act="copy-ration" data-hid="${h.id}">${ic('copy', 'sm')}Copier une autre ration</button>` : ''}</div>`;
  if (!lines.length) return empty('Pas encore de ration', 'Ajoute chaque aliment avec sa quantité et les repas où il est donné : il apparaîtra dans les rations du jour.') + actions;
  const rows = lines.map(l => {
    const repas = (l.repas || []).map(id => (REPAS.find(r => r.id === id) || {}).label).filter(Boolean).join(', ').toLowerCase();
    const tot = l.qte != null ? `${num(l.qte * nbRepas(l), 2)} ${esc(l.unite || '')}/j` : '';
    return `<button type="button" class="row" data-act="edit-ration" data-hid="${h.id}" data-lid="${l.id}">${lead(estFoin(l) ? 'bale' : 'bowl')}<div class="row-main"><div class="row-t">${esc(l.aliment)}</div><div class="row-s">${l.qte != null ? `${num(l.qte, 2)} ${esc(l.unite || '')} × ` : ''}${esc(repas)}</div></div><span class="row-end num">${tot}</span></button>`;
  }).join('');
  const hay = lines.filter(estFoin).reduce((a, l) => { const q = kgLigne(l); return a + (q != null ? q * nbRepas(l) : 0); }, 0);
  const pct = h.poids && hay ? ` · ${num(hay / h.poids * 100, 1)} % de son poids` : '';
  return `<div class="list">${rows}</div>${hay ? `<p class="note">Foin : <b>${num(hay)} kg par jour</b>${pct}.</p>` : ''}${actions}`;
}

function soinsHtml(h) {
  const t = todayISO(), yr = t.slice(0, 4);
  const R = rappels(h.id);
  const ss = soinsDe(h.id).sort((a, b) => b.date.localeCompare(a.date));
  const rap = R.length ? `<div class="list">${R.map(rowRappel).join('')}</div>`
    : `<p class="note">Les rappels apparaissent dès qu'un soin à intervalle (vaccin, vermifuge, maréchal, dentiste, ostéo) est enregistré. Les intervalles se règlent dans les réglages.</p>`;
  const cost = ss.filter(s => s.date.startsWith(yr) && s.statut !== 'prevu').reduce((a, s) => a + (Number(s.cout) || 0), 0);
  const hist = ss.length ? `<div class="list">${ss.map(rowSoin).join('')}</div>${cost ? `<p class="note">Dépenses de soins en ${yr} : <b>${num(cost, 2)} €</b></p>` : ''}`
    : empty('Aucun soin enregistré', 'Utilise le bouton + pour noter un vaccin, un vermifuge, le passage du maréchal…');
  return section('Rappels', rap) + section('Historique', hist);
}
function rowSoin(s) {
  const sub = [dFull(s.date), s.praticien, s.produit].filter(Boolean).join(' · ');
  const end = s.statut === 'prevu' ? '<span class="pill info">Prévu</span>' : (s.cout ? `<span class="row-end num">${num(Number(s.cout), 2)} €</span>` : '');
  return `<button type="button" class="row" data-act="edit-soin" data-id="${s.id}">${lead(soinIcon(s))}<div class="row-main"><div class="row-t">${esc(soinLabel(s))} ${exTag(s)}</div><div class="row-s">${esc(sub)}</div></div>${end}</button>`;
}
function concoursCheval(h) {
  const t = todayISO(), st = statsConcours(h.id);
  const cs = list('concours').filter(c => c.horseId === h.id).sort((a, b) => b.date.localeCompare(a.date));
  if (!cs.length) return empty('Aucun concours', 'Ajoute une sortie avec le bouton + : date, lieu, épreuve, puis le résultat.');
  const stats = `<div class="stats"><div class="stat"><b>${st.sorties}</b><span>${pl(st.sorties, 'sortie')}</span></div><div class="stat"><b>${st.podiums}</b><span>${pl(st.podiums, 'podium')}</span></div><div class="stat"><b>${st.best ? ordinal(st.best) : '–'}</b><span>meilleure place</span></div></div>`;
  const up = cs.filter(c => c.date >= t).reverse(), past = cs.filter(c => c.date < t);
  return stats + (up.length ? section('À venir', `<div class="list">${up.map(c => ccard(c, false)).join('')}</div>`) : '')
    + (past.length ? section('Résultats', `<div class="list">${past.map(c => ccard(c, false)).join('')}</div>`) : '');
}

/* ---------- Formulaires : cheval, ration, soin ---------- */

      const pr = ph ? ph.result() : { changed: false };
      if (pr.changed) h.photo = pr.photo || null;
      const naiss = val('f_naiss');

      Object.assign(h, {
        nom, naissance: naiss || null, sexe: chipVal(f, 'sexe'), race: val('f_race'), robe: val('f_robe'),
        taille: parseNum(val('f_taille')), poids: parseNum(val('f_poids')), sire: val('f_sire'), puce: val('f_puce'),
        couleur: parseInt(chipVal(f, 'coul') || '0', 10), notes: val('f_notes'), proprietaire: val('f_prop')
      });
      if (ex) h.archive = $('#f_arch').checked;
      const saved = put('chevaux', h);
      toast(ex ? 'Fiche enregistrée' : `${nom} ajouté`);
      if (!ex) setTimeout(() => push('cheval', { id: saved.id, sub: 'fiche' }), 50);

function deleteHorse(id) {
  const h = cheval(id);
  if (!h) return;
  ['soins', 'places', 'concours', 'seances'].forEach(k => list(k).filter(o => o.horseId === id).forEach(o => del(k, o.id)));
  list('taches').filter(tk => tk.horseId === id).forEach(tk => put('taches', Object.assign({}, tk, { horseId: null })));
  del('chevaux', id);
  const t = topView();
  if (t && t.view === 'cheval' && t.id === id) nav.stack.pop();
  render();
  toast(`${h.nom} supprimé`);
}

    <div class="grid2">${fld('Praticien', inp('f_prat', s.praticien, 'list="dl-prat" autocomplete="off"'))}${fld('Produit', inp('f_prod', s.produit, 'list="dl-prod" autocomplete="off" placeholder="vaccin, vermifuge…"'))}</div>
    <div class="grid2">${fld('Coût (€)', inp('f_cout', s.cout != null ? String(s.cout).replace('.', ',') : '', numAttr))}${fld('Prochain rappel', inp('f_proch', s.prochain, 'type="date"'), 'Vide : calculé selon les réglages')}</div>

/* ---------- Prés : rotation, repos, entretien ---------- */
function statusPill(s) {
  if (s.occupe) return s.over ? '<span class="pill warn">À changer</span>' : '<span class="pill hay">En pâture</span>';
  if (s.jamais) return '<span class="pill info">Libre</span>';
  return s.pret ? '<span class="pill ok">Prêt</span>' : '<span class="pill">Au repos</span>';
}
function pcard({ p, s }, detail = false) {
  const sub = (p.surface ? `${num(p.surface, 2)} ha` : 'Surface non renseignée')
    + (s.occupe && p.surface ? ` · ${num(s.horses.length / p.surface, 1)} cheval/ha` : '');
  const inner = `<div class="row-main"><div class="row-t">${esc(p.nom)} ${exTag(p)}</div><div class="row-s">${sub}</div></div>${statusPill(s)}`;
  const head = detail ? `<div class="pcard-h">${inner}</div>` : `<button type="button" class="pcard-h" data-act="open-pre" data-id="${p.id}">${inner}</button>`;
  if (s.occupe) {
    const pct = Math.min(100, Math.round(s.days / s.max * 100));
    return `<article class="pcard">${head}
      <div class="pnums"><span class="big">${s.days}</span><span class="unit">${pl(s.days, 'jour')} de pâture · max ${s.max}</span></div>
      <div class="gauge graze${s.over ? ' over' : ''}" role="img" aria-label="${s.days} jours de pâture sur ${s.max}"><i style="width:${pct}%"></i></div>
      <div class="wrap">${s.horses.map(id => hchip(cheval(id))).join('')}</div>
      <button type="button" class="btn small" data-act="move-from" data-id="${p.id}">${ic('move', 'sm')}Déplacer</button></article>`;
  }
  const add = `<button type="button" class="btn small" data-act="move-to" data-id="${p.id}">${ic('plus', 'sm')}Y mettre des chevaux</button>`;
  if (s.jamais) return `<article class="pcard">${head}<p class="note">Pas encore pâturé dans le carnet.</p>${add}</article>`;
  const pct = Math.min(100, Math.round(s.repos / s.cible * 100));
  return `<article class="pcard">${head}
    <div class="pnums"><span class="big">${s.repos}</span><span class="unit">${pl(s.repos, 'jour')} de repos · objectif ${s.cible}</span></div>
    <div class="gauge" role="img" aria-label="${s.repos} jours de repos sur ${s.cible}"><i style="width:${pct}%"></i></div>${add}</article>`;
}
const col = html => `<div style="display:flex;flex-direction:column;gap:12px">${html}</div>`;

VIEWS.pres = () => {
  const ps = pres().map(p => ({ p, s: preStatus(p) }));
  if (!ps.length) return { title: 'Prés', eyebrow: 'Rotation de pâture', html: empty('Aucun pré', 'Ajoute tes parcelles avec le bouton +. Le carnet comptera les jours de pâture et de repos de chacune.'), fab: () => formPre(null), fabLabel: 'Nouveau pré' };
  const occ = ps.filter(x => x.s.occupe).sort((a, b) => b.s.days - a.s.days);
  const prets = ps.filter(x => !x.s.occupe && x.s.pret).sort((a, b) => (b.s.repos ?? -1) - (a.s.repos ?? -1));
  const repos = ps.filter(x => !x.s.occupe && !x.s.pret).sort((a, b) => (b.s.repos / b.s.cible) - (a.s.repos / a.s.cible));
  const surf = ps.reduce((a, x) => a + (Number(x.p.surface) || 0), 0);
  let html = `<div class="stats">
    <div class="stat"><b>${occ.length}</b><span>${pl(occ.length, 'pré occupé', 'prés occupés')}</span></div>
    <div class="stat"><b>${prets.length}</b><span>${pl(prets.length, 'prêt', 'prêts')} à pâturer</span></div>
    <div class="stat"><b>${num(surf, 1)}</b><span>ha au total</span></div></div>`;
  if (occ.length) html += section('En pâture', col(occ.map(x => pcard(x)).join('')));
  if (prets.length) html += section('Prêts à pâturer', col(prets.map(x => pcard(x)).join('')));
  if (repos.length) html += section('Au repos', col(repos.map(x => pcard(x)).join('')));
  const box = chevaux().filter(h => !openPlace(h.id));

  const segs = segments(pre.id).slice().reverse();
  let html = pcard({ p: pre, s }, true);

    <div class="stat"><b>${s.max}</b><span>jours de pâture max</span></div></div>`;

    : '<p class="note">Hersage, fauche des refus, amendement, clôtures… Note-les avec le bouton +.</p>',
    `<button type="button" class="link" data-act="new" data-what="entretien" data-pid="${pre.id}">${ic('plus', 'sm')}Ajouter</button>`);

    : "<p class=\"note\">Aucun passage enregistré pour l'instant.</p>");

  return { title: pre.nom, eyebrow, html, fab: () => formEntretien(null, { pid: pre.id }), fabLabel: 'Ajouter un entretien' };
};

function menuPres() {
  const mi = (what, icon, t, s) => `<button type="button" class="row" data-act="new" data-what="${what}">${lead(icon)}<div class="row-main"><div class="row-t">${t}</div><div class="row-s">${s}</div></div></button>`;

}

function formMove(pre = {}) {
  const hs = chevaux(), ps = pres();
  if (!hs.length) { toast("Ajoute d'abord un cheval."); formCheval(null); return; }
  if (!ps.length) { toast("Ajoute d'abord un pré."); formPre(null); return; }
  let dest = pre.to || null, sel = [];
  if (pre.from) {
    sel = list('places').filter(x => x.preId === pre.from && !x.fin).map(x => x.horseId);
    const nx = prePret(pre.from);
    if (!dest && nx) dest = nx.p.id;
  }
  if (pre.hid) sel = [pre.hid];
  const destOpts = ps.filter(p => p.id !== pre.from).map(p => {
    const s = preStatus(p);
    const sub = s.occupe ? `occupé · ${nJ(s.days)}` : s.jamais ? 'libre' : `repos ${nJ(s.repos)}${s.pret ? ' · prêt' : ''}`;
    return { v: p.id, html: `<span class="two"><span>${esc(p.nom)}</span><small>${esc(sub)}</small></span>` };
  });
  destOpts.push({ v: '__box', html: `${ic('barn', 'sm')}<span>Box / écurie</span>` });
  const from = pre.from ? get('pres', pre.from) : null;
  const body = `
    ${from ? `<p class="note">Depuis <b>${esc(from.nom)}</b></p>` : ''}
    ${grp('Vers', chips('dest', destOpts, dest ? [dest] : []))}
    ${grp('Chevaux', chips('h', horseOpts(hs, h => horseWhere(h.id).txt), sel, { multi: true }) + (hs.length > 2 ? '<button type="button" class="link" data-act="all-h" style="align-self:flex-start">Tout le monde</button>' : ''))}
    ${fld('Date', inp('f_date', todayISO(), 'type="date" required'), 'Change la date si le déplacement a eu lieu avant.')}`;
  openSheet('Déplacer des chevaux', body, {
    submit: 'Déplacer',
    onSubmit: f => {
      const d = chipVal(f, 'dest');
      if (!d) return 'Choisis où vont les chevaux.';
      const hids = chipVals(f, 'h');
      if (!hids.length) return 'Choisis au moins un cheval.';
      const date = val('f_date');
      if (!validISO(date)) return 'Indique la date.';
      if (date > todayISO()) return 'La date ne peut pas être dans le futur.';
      const preId = d === '__box' ? null : d;
      const r = moveHorses(hids, preId, date);
      if (r.err) return r.err;
      const destName = preId ? get('pres', preId).nom : 'au box';
      toast(`${hids.length > 1 ? hids.length + ' chevaux' : hNom(hids[0])} → ${destName}`, { undo: r.undo });
    }
  });
}
ACT['move-from'] = d => formMove({ from: d.id });
ACT['move-to'] = d => formMove({ to: d.id });

function formPre(id) {
  const ex = id ? get('pres', id) : null;
  if (id && !ex) return;
  const p = ex ? clone(ex) : { nom: '' };
  const C = cfg();
  const body = `
    ${fld('Nom', inp('f_nom', p.nom, 'required autocomplete="off" autocapitalize="sentences" placeholder="ex. Pré du bas"'))}
    ${fld('Surface (ha)', inp('f_surf', p.surface != null ? String(p.surface).replace('.', ',') : '', numAttr + ' placeholder="ex. 1,5"'))}
    <div class="grid2">${fld('Repos visé (jours)', inp('f_repos', p.repos, `inputmode="numeric" autocomplete="off" placeholder="${C.repos}"`))}${fld('Pâture max (jours)', inp('f_pat', p.paturage, `inputmode="numeric" autocomplete="off" placeholder="${C.paturage}"`))}</div>
    <p class="hint">Laisse vide pour garder les valeurs des réglages : ${C.repos} jours de repos, ${C.paturage} jours de pâture.</p>
    ${fld('Notes', area('f_notes', p.notes, 'rows="3" placeholder="Abreuvoir, abri, type d\'herbe, clôture…"'))}
    ${ex ? `<label class="check"><input type="checkbox" id="f_arch"${p.archive ? ' checked' : ''}> Archiver ce pré</label>` : ''}`;
  openSheet(ex ? 'Modifier le pré' : 'Nouveau pré', body, {
    focus: ex ? null : '#f_nom',
    onSubmit: () => {
      const nom = val('f_nom');
      if (!nom) return 'Indique le nom du pré.';
      const surface = parseNum(val('f_surf'));
      if (val('f_surf') && (surface == null || surface <= 0)) return 'La surface doit être un nombre positif, en hectares.';
      const repos = parseNum(val('f_repos')), pat = parseNum(val('f_pat'));
      if ((val('f_repos') && (repos == null || repos < 1)) || (val('f_pat') && (pat == null || pat < 1))) return "Les durées doivent être d'au moins 1 jour.";
      Object.assign(p, { nom, surface, repos: repos ? Math.round(repos) : null, paturage: pat ? Math.round(pat) : null, notes: val('f_notes') });
      if (ex) p.archive = $('#f_arch').checked;
      put('pres', p);
      toast(ex ? 'Pré enregistré' : `${nom} ajouté`);
    },
    onDelete: ex ? () => deletePre(id) : null,
    delConfirm: 'Supprimer aussi son historique ?'
  });
}
function deletePre(id) {
  const p = get('pres', id);
  ['places', 'entretiens'].forEach(k => list(k).filter(o => o.preId === id).forEach(o => del(k, o.id)));
  list('taches').filter(tk => tk.preId === id).forEach(tk => put('taches', Object.assign({}, tk, { preId: null })));
  del('pres', id);
  const t = topView();
  if (t && t.view === 'pre' && t.id === id) nav.stack.pop();
  render();
  toast(`${p ? p.nom : 'Pré'} supprimé`);
}
ACT['edit-pre'] = d => formPre(d.id);

function formEntretien(id, pre = {}) {
  const ex = id ? get('entretiens', id) : null;
  if (id && !ex) return;
  const ps = pres(true).filter(p => !p.archive || (ex && ex.preId === p.id));

  const e = ex ? clone(ex) : { preId: pre.pid || (ps.length === 1 ? ps[0].id : null), type: null, date: todayISO() };
  const body = `
    ${grp('Pré', chips('pre', ps.map(p => ({ v: p.id, l: p.nom })), e.preId ? [e.preId] : []))}
    ${grp('Travail', chips('type', ENTRETIENS.map(x => ({ v: x, l: x })), e.type ? [e.type] : []))}
    ${fld('Date', inp('f_date', e.date, 'type="date" required'))}
    ${fld('Notes', area('f_notes', e.notes, 'rows="2" placeholder="Produit, quantité, prestataire…"'))}`;
